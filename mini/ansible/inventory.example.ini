# Generated by `make render` from .bootstrap.env — do not edit directly.
#
# The host is deliberately NOT wrapped in a `[mini]` group. A group and a host
# sharing one name makes `hosts: mini` in site.yml ambiguous and Ansible warns
# about it on every run ("Found both group and host with same name: mini").
# With a single host there is nothing for a group to express — it lands in the
# implicit `all` group, which is what group_vars/all.yml already targets.
mini ansible_host=${HOST_IP}

[all:vars]
# ansible_user is set in group_vars/all.yml from node_user (single source of truth).
ansible_python_interpreter=/usr/bin/python3
# Accept host key on first connection (remove after key is known)
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
