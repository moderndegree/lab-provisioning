[mini]
# Generated by `make render` from .bootstrap.env — do not edit directly.
mini ansible_host=${HOST_IP}

[mini:vars]
# ansible_user is set in group_vars/all.yml from node_user (single source of truth).
ansible_python_interpreter=/usr/bin/python3
# Accept host key on first connection (remove after key is known)
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
