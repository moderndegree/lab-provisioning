---
# Open WebUI — the ChatGPT-style browser UI for mini's local Ollama.
# Disabled by default — flip enable_openwebui: true in group_vars/all.yml to activate.
enable_openwebui: false

# Pin to a release tag for reproducible deploys; "main" tracks upstream latest.
# https://github.com/open-webui/open-webui/pkgs/container/open-webui
openwebui_image: "ghcr.io/open-webui/open-webui:main"

# Data (accounts, chat history, uploaded docs for RAG) persists on the data disk.
openwebui_data_dir: "{{ data_mount }}/services/openwebui/data"

# Root-only-readable env file holding the generated WEBUI_SECRET_KEY (see tasks).
openwebui_env_file: "{{ data_mount }}/services/openwebui/webui.env"

# Open WebUI listens on 8080 inside the container; published on the host at this port.
openwebui_port: 8080

# 0.0.0.0 + the base role's blanket "allow all inbound on tailscale0" UFW rule
# (same model as ollama_host) makes Open WebUI reachable to tailnet peers at
# http://mini:{{ openwebui_port }} and to the cloudflared tunnel via loopback —
# but never the LAN/WAN. Set to 127.0.0.1 to keep it loopback-only (tunnel-only
# access, no direct tailnet path).
openwebui_host: "0.0.0.0"

# Open WebUI talks to mini's own Ollama over Podman's built-in host-gateway
# alias — NOT over Tailscale. host.containers.internal is added automatically to
# every rootless Podman container (4.7+) and resolves to mini itself, so this
# works regardless of whatever Tailscale/MagicDNS is doing to the host's
# /etc/resolv.conf. Do not change this to "localhost" (resolves to the
# container's own loopback) or to the tailnet hostname "mini" (unnecessary
# extra hop, and would need the same DNSSearch trick as roles/observability on
# ser5 to resolve at all from inside a container network namespace).
openwebui_ollama_base_url: "http://host.containers.internal:11434"

# Let `podman auto-update` pull a newer image on its timer.
openwebui_autoupdate: true

# Open WebUI's own signup flow (separate from Cloudflare Access). Leave true for
# first provision so you can create the admin account, then flip to false and
# re-run `make provision` to stop accepting new self-service signups.
openwebui_enable_signup: true
