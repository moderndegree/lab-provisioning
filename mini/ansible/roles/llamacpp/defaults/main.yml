---
# llama.cpp serving path — one llama-server per entry in llamacpp_instances, each
# a systemd *user* unit running inside a Strix Halo toolbox.
#
# WHY THIS EXISTS. vLLM is not competitive on this box for these models. Measured
# 2026-08-02, Qwen3.6-35B-A3B, identical hardware, single-stream / aggregate@8:
#
#   vLLM toolbox 0.22 (tuned MoE)   24.8 /  85.7 tok/s
#   vLLM Lemonade 0.20 (AMD build)  25.2 /  93.9 tok/s
#   llama.cpp                       75.1 / 168.6 tok/s
#   llama.cpp + MTP n=1             86.7 / 120.7 tok/s
#
# Two independent vLLM builds land within 2% of each other because every
# vLLM-compatible quant of Qwen3.6 leaves the GatedDeltaNet projections, lm_head,
# self_attn and shared experts in BF16 — ~3.6 GiB of the ~4.15 GiB read per
# decoded token. GGUF q4_K_M quantizes all of it. That is a property of the
# checkpoint, not the runtime, so no vLLM flag closes it.
#
# This does NOT replace roles/ollama. Ollama stays installed and still manages
# model pulls; it is simply not started alongside this (see ollama_service_* in
# ../ollama/defaults/main.yml). They are both llama.cpp underneath — the reasons
# to run this instead are MTP (Ollama's fork does not expose --spec-type) and
# real control over --parallel.
enable_llamacpp: false

# ─────────────────────────────────────────────────────────────────────────────
# Defaults shared by every instance (override per-instance where it matters)
# ─────────────────────────────────────────────────────────────────────────────
# The container image every instance runs. It is the ONLY special ingredient
# here: Fedora 43 carrying a gfx1151-patched Mesa/RADV userspace and a llama.cpp
# built against it. An ordinary OCI image (empty entrypoint, Cmd=/bin/bash) —
# distrobox was never required to run it, only to make an interactive shell
# pleasant, which is why roles/toolboxes could be folded in here and deleted.
# Override per instance with `image:` to A/B a different backend (e.g. the
# rocm-7.2.4 tag) without touching the others.
#
# PINNED TO A TIMESTAMPED TAG, DELIBERATELY. Upstream rebuilds the moving
# `vulkan-radv` tag several times a DAY, so that tag makes the llama.cpp version
# an accident of when someone last pulled — with nothing in the repo recording
# which build is live. Found 2026-08-11: the box had been sitting on b10222 while
# upstream was at b10380, and the gap was invisible until a model needed a newer
# build. The llama.cpp version is a real dependency; declare it like one.
#
# To upgrade: pick a newer tag from
#   https://hub.docker.com/v2/repositories/kyuz0/amd-strix-halo-toolboxes/tags
# bump the line below, converge, and confirm with
#   podman run --rm <tag> /usr/bin/llama-server --version
#
# vulkan-radv_20260811T205316 == llama.cpp b10380 (0b1bad14f). Chosen because
# Nemotron-3.5 needs it: base nemotron_h support is old, but MTP (#26725,
# 2026-08-10) and DFlash (#26905, 2026-08-11) are days old and absent from b10222.
llamacpp_image: "docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv_20260811T205316"

# Group handle: `systemctl --user {start,stop,status} llama-servers.target`.
llamacpp_target: "llama-servers.target"

# Every distinct image across instances, so the pull tasks iterate images rather
# than instances (two instances sharing one image must not pull it twice).
llamacpp_images: >-
  {{ llamacpp_instances | map(attribute='image', default=llamacpp_image) | unique | list }}

# Where GGUFs live, bind-mounted read-only into every instance. Deliberately NOT
# hardlinks into /data/ollama/blobs: that would hide the dependency and pin a
# blob alive after an `ollama rm`.
#
# NOTHING PRUNES THIS DIRECTORY. Ansible never deletes from it, so every model
# ever downloaded stays until someone removes it by hand. Audit with
# `du -sh /data/models/*.gguf` after any model evaluation.
#
# Contents as of 2026-08-27, and why each is there:
#   qwen3.6-35b-a3b-mtp-q4_K_M      21 GB  LIVE  :8090 quality (restored)
#   qwen3.8-27b-q4_K_M              19 GB  LIVE  :8091 deep (restored)
#   qwen3.8-27b-mtp-q8_0           3.2 GB  LIVE  deep's MTP head (-md)
#   qwen3.8-27b-mmproj-q8_0        0.6 GB  vision projector. NOT wired up.
#   Qwen3.8-Flash-Next UD-Q4_K_XL  111 GB  KEPT  rollback of the 2026-08-26 driver
#   Qwen3.5-122B-A10B MTP UD-Q4_K_XL 79 GB KEPT  2026-08-27 perf test (~14 t/s)
#   gpt-oss-20b-MXFP4            12 GB  KEPT ON PURPOSE — rollback, and still
#                                       the FASTEST aggregate measured on this
#                                       box (140.8 tok/s at n=4 on 2026-08-14,
#                                       vs 109.4 for the current single-endpoint
#                                       design). If fan-out throughput ever
#                                       becomes the bottleneck, restoring a
#                                       third endpoint is a config edit and the
#                                       weights are already here. Do not "tidy"
#                                       this away.
#   nemotron-3.5-lightning...    24 GB  RETIRED 2026-08-14, kept pending the
#                                       unexplained 119.1 -> 92.1 regression
#                                       noted in the backend ledger below.
#                                       Delete once that is closed out.
#
# Deleted 2026-08-12 after evaluation, all re-downloadable, none worth the disk:
#   muse-glimmer-30b-q4_K_M      17 GB  dense; 12.6 tok/s here vs qwen's 91.3
#   muse-dflash-draft           1.6 GB  its drafter (worked — 2.1x — still 3.4x
#                                       behind the MoE anchor)
#   nemotron...-nvfp4            21 GB  no gfx1151 NVFP4 kernel; -38% vs q4_K_M
llamacpp_models_dir: "{{ data_mount }}/models"

# ─────────────────────────────────────────────────────────────────────────────
# GPU device permissions
# ─────────────────────────────────────────────────────────────────────────────
# Rootless Podman maps uids into a user namespace, and a host GID that is not
# mapped there cannot satisfy the kernel's check on /dev/kfd (0660 root:render)
# or /dev/dri/renderD128. The symptom is NOT a permission error — the GPU simply
# fails to enumerate and llama.cpp falls back to CPU. This udev rule removes the
# dependency on gid mapping entirely and is upstream's documented fix for
# headless hosts.
#
# TRADE-OFF: 0666 grants GPU compute to every local user. mini is a headless
# single-user node reachable only over the tailnet, so the exposed surface is the
# same set of people who could already SSH in. Set false on any box with
# untrusted local logins.
llamacpp_permissive_udev: true
llamacpp_udev_rule_path: "/etc/udev/rules.d/70-kfd.rules"

# ─────────────────────────────────────────────────────────────────────────────
# Model staging (HuggingFace CLI)
# ─────────────────────────────────────────────────────────────────────────────
# GGUFs are staged with `hf download`, so the CLI is the front door for every
# model this box serves. Installed with pipx because Ubuntu 26.04 marks its
# Python externally-managed (PEP 668) and a plain `pip install --user` is
# refused. HF_HOME is exported to host shells so a download lands beside the
# models rather than in ~/.cache.
llamacpp_install_hf_cli: true
llamacpp_hf_cli_spec: "huggingface_hub[cli,hf_transfer]"
llamacpp_hf_home: "{{ llamacpp_models_dir }}/huggingface"

# Optional. Only needed for GATED repos (meta-llama/*, google/gemma-*), where you
# must also accept the licence on the model page. Empty writes no token file;
# `hf auth login` on mini is a fine alternative to putting this in the vault.
llamacpp_hf_token: "{{ vault_hf_token | default('') }}"

# 0.0.0.0 so Open WebUI on ser5 reaches these over the tailnet. Not as open as it
# looks: mini's UFW allows only 22/tcp from outside plus everything on
# tailscale0, so these ports are unreachable from the 10.0.0.0/24 wifi LAN.
# 11434 is Ollama's and 8000/8001 are the vLLM bench ports — do not reuse them.
llamacpp_host: "0.0.0.0"

# -fa and --no-mmap are upstream's hard requirements on Strix Halo (crashes or
# severe slowdowns without them). -ngl 999 offloads every layer.
#
# Tool calling needs NO extra flags, unlike vLLM: --jinja defaults to enabled and
# drives each model's own chat template, so Open WebUI's tool payloads work
# as-is. vLLM by contrast rejects them outright without --enable-auto-tool-choice
# and a hand-picked --tool-call-parser.
# --metrics turns on the Prometheus endpoint at /metrics, which ser5's
# observability role scrapes. Off by default in llama.cpp.
llamacpp_base_args: "-ngl 999 -fa 1 --no-mmap --metrics"

# ─────────────────────────────────────────────────────────────────────────────
# Prompt-cache sizing  (measured 2026-08-04, packages/inference-bench)
# ─────────────────────────────────────────────────────────────────────────────
# EMPTY = keep llama-server's default of 8192 MiB. Set a value to raise it.
#
# This is the highest-value untuned knob on the box for multi-turn agent work.
# A warm prefix is worth ~12x on time-to-first-token:
#
#   quality, depth 32768 : cold prefill 40.2s -> warm (cached prefix) 3.3s
#   quality, depth 16384 : cold prefill 17.5s -> warm                 2.8s
#   throughput, depth 32768: cold 37.1s -> warm 3.9s
#
# Decode speed is unchanged by caching (72.9 vs 75.7 t/s) — this is purely a
# prefill/TTFT effect, which is exactly what an agent re-sending its history
# every turn pays.
#
# The risk is eviction: a single deep-context entry is ~0.7-1.2 GiB, so the 8 GiB
# default holds only a handful. `llama-quality` logged 41 "making room for prompt
# cache entry, removing oldest entry" events during one benchmark pass — every one
# of those is a session that will pay the COLD price on its next turn. With
# several concurrent agent sessions the cache thrashes and TTFT reverts from ~3s
# to 40-100s.
#
# Before raising it: this is unified memory shared with the GPU pool. The box sat
# at ~72 GiB of ~122 GiB during benchmarking, so there is headroom, but confirm
# with `free -g` rather than assuming. Raising it costs RAM, not GPU compute.
llamacpp_cache_ram: ""

# min chunk size for reusing cache via KV shifting after a mid-prompt divergence.
# EMPTY = llama-server default of 0 (disabled). Relevant when a tool result or
# edit changes the middle of an otherwise-identical prompt, which is common in
# agent loops. Unmeasured here — treat enabling it as an experiment, not a fix.
llamacpp_cache_reuse: ""
llamacpp_restart_sec: 10

# Health check is a READINESS probe. Model load is 4-12s warm and much longer
# cold, so the start period must cover the worst case — too short and systemd
# restarts a server that was only still loading, forever.
llamacpp_health_interval: "30s"
llamacpp_health_start_period: "600s"
# systemd TimeoutStartSec for the generated service. 600s covers 20-40 GB
# GGUFs; Flash-Next XL (~111 GB) needs the per-instance override below.
llamacpp_timeout_start_sec: 600

# ─────────────────────────────────────────────────────────────────────────────
# THE KV CEILING — READ BEFORE RAISING ANY ctx
# ─────────────────────────────────────────────────────────────────────────────
# `ctx` is TOTAL context, DIVIDED across `parallel` slots — llama.cpp statically
# partitions the KV cache, it does not pool it like vLLM's PagedAttention. So
# per-slot context is ctx / parallel, and a single request larger than that share
# fails outright with
#   "request (N tokens) exceeds the available context size (M tokens)"
# even on an otherwise idle server. SIZE FOR THE WORST-CASE SINGLE REQUEST.
#
# Slots are consumed by IN-FLIGHT REQUESTS, not by open conversations — Open
# WebUI can hold any number of chats; `parallel` caps simultaneous generations.
#
# Measured on this box (single process):
#
#   ctx  262144, parallel 8  ->  32768/slot,  ~28 GiB resident   OK
#   ctx  262144, parallel 2  -> 131072/slot,  ~27 GiB resident   OK
#   ctx  524288, parallel 2  -> 262144/slot,  ~33 GiB resident   OK
#   ctx 1048576, parallel 32 ->  32768/slot,  ~36 GiB resident   OK
#   ctx 1048576, parallel 64 ->  16384/slot,  ~37 GiB resident   OK
#   ctx 2097152, parallel 8  -> 262144/slot,  ~63 GiB            HANGS THE GPU
#
# The threshold is per-PROCESS, not per-box: qwen at 524288 and gptoss at 1048576
# run side by side at ~70 GiB combined with no trouble. What wedges is one
# process asking for too much at once.
#
# THE CEILING IS KV BYTES, NOT CELLS — and the table above is all qwen3.6, at
# 20 KB/token. Read it that way or it will mislead you: nemotron ran ctx
# 2097152 / np 8 here for days without wedging, because at ~6 KB/token that is
# only ~12 GiB of KV, against ~40 GiB for the same cell count on qwen3.6.
# Convert before comparing. Per-token KV = full_attention_layers x kv_heads x
# head_dim x 2 x bytes_per_element; qwen3.6 = 10 x 2 x 256 x 2 x 2 = 20 KB,
# qwen3.8-27b = 16 x 4 x 256 x 2 x 2 = 64 KB, and cache_type q8_0 roughly halves
# whichever you get. The current `quality` instance sits at 1048576 cells x
# 20 KB = ~20 GiB, the largest total measured safe.
#
# The failure is driven by TOTAL KV, not per-slot size — 262144/slot is fine at
# 524288 total and wedges at 2097152. And it does not fail cleanly: the process
# sticks in uninterruptible sleep (state Ds, wchan drm_suballoc_new), immune to
# SIGKILL, holding the GPU device until reboot — and shutdown then hangs ~7
# minutes because systemd cannot kill a D-state task. Somewhere between ~12 GiB
# and ~50 GiB of KV the DRM suballocator gives up rather than erroring.
#
# Step up one increment at a time and confirm each load before committing here.
# Warns per-instance above the largest value measured safe in a single process.
llamacpp_ctx_warn: 1048576

# ─────────────────────────────────────────────────────────────────────────────
# THE OTHER CEILING — HOST RAM, AND IT KILLS THE WRONG PROCESS
# ─────────────────────────────────────────────────────────────────────────────
# Distinct from the DRM/GPU wedge above. GTT is backed by host RAM, so total
# residency across ALL instances is bounded by the 122 GiB the box has, and the
# practical ceiling is ~95 GB — not 122, because the kernel needs slack.
#
# Hit 2026-08-14 while benchmarking Qwen3.8 alongside both live servers
# (32.6 + ~35 + 38 GiB ~= 105 GB). The KERNEL OOM KILLER fired and killed
# llama-quality — a LIVE SERVICE — with status=137 / global_oom. It did NOT kill
# the process that asked for the memory. Restart=on-failure recovered it in
# ~50s, so this self-heals, but every in-flight request was lost.
#
# Two rules follow:
#   1. Before benchmarking a large model by hand, STOP one of the live
#      llama-servers. Do not assume a failed allocation only harms the newcomer.
#   2. Keep the sum of configured instances under ~95 GB. The current pair was
#      REHEARSED together 2026-08-14 before committing: quality alone 43.6 GB,
#      both up 83.3 GB, host 85/122 GiB. That leaves ~12 GB — enough to survive,
#      NOT enough to bench a third model beside them. Stop one first.
#
# BUDGET THE DRAFT MODEL'S KV TOO — it is easy to miss and it is not small. Each
# MTP instance allocates a SECOND kv_cache for the draft head on top of the main
# one: quality 20,480 MiB main + 2,048 MiB draft, deep 16,384 + 1,024. That is
# ~3 GB across the pair that a weights+KV calculation does not predict. The
# `-lv 4` load prints both lines; read both.
#
# Measure residency with the llama.cpp load lines (`llama_kv_cache: size = ...`
# plus the model buffer sizes), NOT with mem_info_gtt_used — GTT tracks TOUCHED
# pages and drifts (the same two servers read 68.3 GB warm and 54.6 GB idle).

# ─────────────────────────────────────────────────────────────────────────────
# Instances
# ─────────────────────────────────────────────────────────────────────────────
# Each entry: name (unit suffix), model, alias (the id clients address — keep it
# stable, renaming breaks whatever referenced the old one), port, ctx, parallel,
# and optionally mtp / mtp_draft_max / draft_model / cache_type_k / cache_type_v
# / chat_template_kwargs / toolbox / host / base_args / extra_args.
#
#   draft_model           path to a SEPARATE MTP head gguf. Only needed when the
#                         head is not embedded in the model file — see `deep`.
#   cache_type_k/v        KV quantisation, e.g. q8_0. Halves KV bytes.
#   chat_template_kwargs  mapping, rendered to JSON and single-quoted into
#                         Exec=. Verified 2026-08-14 that quadlet passes
#                         '{"reasoning_effort":"medium"}' through as ONE argv
#                         element — unlike HealthCmd=, which splits on quotes.
#
# Two instances must not share a model file: ExecStopPost matches on the model
# path to reap the in-container process, so a shared path would kill both.
#
# MTP IS A PER-WORKLOAD TRADE, NOT A FREE WIN. It buys single-stream latency and
# costs aggregate throughput. On qwen3.6-35b-a3b at n=4 (2026-08-14): MTP on
# 106.4 agg / 90.8 solo, MTP off 134.1 agg / 73.9 solo. Since agent loops are
# mostly single-stream, on is right for THIS box's driver endpoint.
#
# THE COST IS STRUCTURAL, NOT QUEUING. Raising `parallel` does not buy the
# aggregate back — at n-max 3, np 8: n=2 112.2, n=4 109.4, n=8 125.5. Going
# np 2 -> 8 moved n=4 by 3 tok/s. Verifying n+1 tokens routes to up to 8*(n+1)
# experts instead of 8, so a longer draft costs much of what it saves.
#
# DRAFT DEPTH IS PER-MODEL AND MUST BE MEASURED — the old default of 1 was
# wrong for both models now configured:
#   qwen3.6-35b-a3b  n=1 93.2 | n=2 103.5 | n=3 106.4 <- peak | n=5 102.0
#   qwen3.8-27b      n=1 18.9 | n=3 28.2  | n=5 31.8  <- peak | n=8 collapses
# An earlier note here recorded "n=1 beating n=3" (86.7 vs 82.5) for qwen3.6.
# That predates b10380 and no longer reproduces; the MTP path has improved.
# Re-measure on any llama.cpp bump rather than trusting either figure.
#
# Confirm MTP is actually live before believing a number: grep the journal for
# "MTP draft context". Without the flag — or with a SEPARATE head gguf and no
# -md — the loader silently logs "unused tensor ...nextn.* -- ignoring" and
# serves at raw speed while the config still reads mtp: true.
#
# Confirm MTP is live by grepping the journal for "MTP draft context"; without
# the flag the loader silently logs "unused tensor blk.40.nextn.* -- ignoring".
#
# QUANT CHOICE (Qwen3.6-35B-A3B, measured with MTP at parallel 1):
#   q4_K_M  21.7 GB  85.8 tok/s   <- current default, staged
#   q8_0    37.8 GB  65.7 tok/s   (76% of q4, not the "about half" long assumed —
#                                  that estimate predated MTP)
# The q8 GGUF is NOT staged any more (reclaimed 2026-08). Nothing is lost: it was
# a copy of an Ollama blob that is still on disk, so restoring it is one cp —
#   cp /data/ollama/blobs/sha256-e143bcc4e3375b59b1cde199d897c54f2e4ca0c75eeee1c559d64b80b445570a \
#      /data/toolboxes/models/qwen3.6-35b-a3b-mtp-q8_0.gguf
# q8 costs ~24% latency for an as-yet-unmeasured quality gain; measure the gain on
# real tasks rather than asserting it before making q8 the default.
llamacpp_instances:
  # NAMING: `name` is the ROLE and becomes the unit/container (llama-quality),
  # `alias` is the MODEL IDENTITY and is what clients send as "model". They are
  # split deliberately — swapping the model behind a role changes the alias while
  # `systemctl --user restart llama-quality` keeps meaning the same thing, and
  # dashboards/units do not churn. Renaming an alias DOES break clients that
  # hardcoded it (Open WebUI addresses these by alias), so change it knowingly.
  #
  # To swap a model: change `model` + `alias`, re-run, done. To add a third
  # instance: append an entry with a free port — it joins llama-servers.target
  # automatically. To A/B a backend: set `image:` on one instance only.

  # RESTORED 2026-08-27 — quality+deep pair after the Qwen3.5-122B-A10B MTP
  # performance test. Flash-Next XL and the 122B GGUF stay on disk as rollbacks;
  # do not delete either without asking. 122B measured ~12–14 tok/s with MTP on
  # Vulkan0 — GPU path was correct, just too slow for daily driving.
  #
  # QUALITY — general / orchestration / critique / docs / chat.
  # qwen3.6-35b-a3b-mtp-q4_K_M, MoE 35B-A3B (3B active), MTP embedded.
  # mtp_draft_max 3 is the measured peak (n=1 93.2 | n=2 103.5 | n=3 106.4 |
  # n=5 102.0). ctx 1048576 / np 4 = 262144 per slot — largest single-process
  # total measured safe. extra_args pins thinking/general sampling.
  - name: "quality"
    alias: "qwen3.6-35b-a3b-mtp"
    model: "{{ llamacpp_models_dir }}/qwen3.6-35b-a3b-mtp-q4_K_M.gguf"
    port: 8090
    ctx: 1048576
    parallel: 4
    mtp: true
    mtp_draft_max: 3
    chat_template_kwargs:
      enable_thinking: true
    extra_args: "--temp 1.0 --top-k 20 --top-p 0.95 --min-p 0 --presence-penalty 1.5"

  # DEEP — coding + hard design. coder/architect/deep share the single slot.
  # Qwen3.8-27B, dense hybrid. draft_model REQUIRED (separate MTP head).
  # mtp_draft_max 5 measured peak. f16 KV (q8_0 was -11% and diverged under
  # greedy). reasoning_effort medium + reasoning_budget 6000 — xhigh returns
  # empty; unbounded think starves OpenCode tools. Do not YaRN past 262144.
  - name: "deep"
    alias: "qwen3.8-27b"
    model: "{{ llamacpp_models_dir }}/qwen3.8-27b-q4_K_M.gguf"
    draft_model: "{{ llamacpp_models_dir }}/qwen3.8-27b-mtp-q8_0.gguf"
    port: 8091
    ctx: 262144
    parallel: 1
    mtp: true
    mtp_draft_max: 5
    chat_template_kwargs:
      reasoning_effort: "medium"
    reasoning_budget: 6000
    extra_args: "--temp 1.0 --top-k 20 --top-p 0.95 --min-p 0 --presence-penalty 0"

# ─────────────────────────────────────────────────────────────────────────────
# BACKEND / QUANT LEDGER — box-level, survives model swaps
# ─────────────────────────────────────────────────────────────────────────────
# Hard-won and expensive to re-derive. Each line cost a model load and a bench.
#
#   NVFP4 quant          -38%   no gfx1151 kernel; it dequantises. Same lesson
#                               as the vLLM bake-off: "native format" is not
#                               fast here.
#   DFlash spec decode   -30%   on nemotron at n=1, where speculative decoding
#                               is supposed to WIN. Acceptance was ~45% against
#                               MTP's ~93% on qwen, and the only published draft
#                               is NVFP4 — slow AND usually wrong. It DOES work
#                               when the drafter is good (2.1x on Muse Glimmer),
#                               so this is a drafter-quality result, not a
#                               verdict on DFlash.
#
# ROCm vs VULKAN CROSSES OVER AT n=4 — measure at YOUR concurrency, not one
# point. Measured 2026-08-12 on nemotron (c 2097152, np 8), aggregate tok/s:
#
#        n=1(judge)   n=4      n=8      n=16
#   Vulkan   70.8    119.1    136.1    131.1
#   ROCm     65.7    119.7    155.3    146.5
#            -----   -----    -----    -----
#   ROCm      -7%      tie     +14%     +12%
#
# The first ROCm test was run ONLY at n=4 and concluded "no gain" — n=4 happens
# to be the exact crossover, so a single data point produced a confidently wrong
# answer. Both backends peak at n=8 and fall off by n=16. Vulkan is retained
# because the single-endpoint design puts most traffic at n<=4, where Vulkan
# leads. Revisit if sustained concurrency rises past 8.
#
# Switching is NOT just an `image:` override: the ROCm image ships llama-server
# at /usr/local/bin, while the quadlet template hardcodes
# Entrypoint=/usr/bin/llama-server. That template needs a per-instance
# entrypoint first, or the unit fails with "executable file not found".
#
# RETIRED 2026-08-14 — nemotron-3.5-lightning-30b-a3b (was :8091, ctx 2097152,
# np 8, no MTP). Dominated: :8090 with MTP beat it on BOTH aggregate (106.4 vs
# 92.1) and single-stream (90.8 vs 70.8) at the same 262144/slot.
#
# OPEN, and it predates this swap: nemotron measured 92.1 t/s at n=4 under a
# clean 2-server control on 2026-08-14, against the 119.1 recorded here on
# 2026-08-11 — same build, same flags. gpt-oss reproduced fine (140.8 vs 146.2),
# so this is nemotron-specific, not a method shift. ~23% unexplained. The GGUF
# is still on disk if anyone wants to chase it.
