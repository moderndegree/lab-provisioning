---
# Ollama serving policy for mini (MS-S1 Max, gfx1151, 128 GB unified RAM).
#
# THIS FILE IS TRACKED IN GIT AND IS THE SOURCE OF TRUTH FOR SERVING POLICY.
# Role defaults are the LOWEST-precedence vars in Ansible, so anything you set in
# group_vars/all.yml still wins. That is the point: policy ships here and updates
# with `git pull`, while all.yml stays small and holds only your box-specific
# overrides. Do NOT copy these keys into all.yml unless you intend to diverge —
# a copied key freezes at whatever value it had the day you copied it and will
# silently shadow every future update to this file.

# ─────────────────────────────────────────────────────────────────────────────
# Service lifecycle
# ─────────────────────────────────────────────────────────────────────────────
# Ollama stays INSTALLED — it is still how models are pulled and managed, and
# `ollama pull` populates /data/ollama regardless of whether the daemon serves.
# What changed on 2026-08-02 is that it is no longer the serving path:
# roles/llamacpp runs llama-server on :8090 and measured ~87 tok/s single-stream
# against Ollama's 70-80, because it can use the GGUF's MTP head (Ollama's fork
# does not expose --spec-type) and because -np is tunable per workload.
#
# They cannot both be up: llama-server holds ~22 GiB resident and the two-warm-
# model policy below wants most of the rest. These were hardcoded to
# enabled/started until llamacpp existed; they are variables now so the box can
# converge to "Ollama installed, not serving" without deleting the role. Flip
# both back (and set enable_llamacpp: false) to make Ollama the serving path
# again — that is the entire revert.
ollama_service_enabled: true
ollama_service_state: started

# ─────────────────────────────────────────────────────────────────────────────
# Service environment (rendered into the systemd override)
# ─────────────────────────────────────────────────────────────────────────────
# Bind address. 0.0.0.0 makes the API reachable over the tailnet; UFW restricts
# inbound to the tailscale0 interface, so nothing is exposed on the LAN. Set to
# 127.0.0.1 to keep Ollama local-only. Hermes on ser5 reaches this over the
# tailnet at http://mini:11434.
ollama_host: "0.0.0.0"

# GLOBAL context window — applies to every model Ollama loads. Per-request
# num_ctx is not reachable through the /v1 endpoint opencode/loopkit use, and a
# Modelfile num_ctx *below* a model's native window is ignored, so this env var
# is the only real control point.
#
# 131072, down from the models' native 262144. The sizing:
#   1. Capacity. Weights are 51 GB (qwen3-coder-next) + 22 GB (qwen3.6 35B-A3B)
#      = 73 GB of the ~110 GB GPU pool. KV cost is context × parallel, so 128k
#      at 2-way parallel is the SAME ~256k-token KV budget as 64k at 4-way —
#      about ~22 GB with q8_0 KV, landing at ~95 GB total with real headroom.
#      Trading concurrency for window is free here; raising both is not.
#      256k × 2 would need ~44 GB of KV and does not fit this pair.
#   2. Prefill is the wall, not capacity. At ~205 t/s a packed 128k prompt costs
#      ~10 minutes before the first token (256k costs ~21 min). That is the
#      worst case, not the normal case — agentic coding turns are a small
#      fraction of the window.
# The window is capacity, not a target — pass what the task needs.
# NOTE: the ~22 GB KV figure is arithmetic, not measured. qwen3-coder-next's
# hybrid Gated-DeltaNet layers do not grow KV like full attention, so the real
# footprint is likely lower. Measure with `ollama ps` and amdgpu_top while both
# models are warm before raising ollama_num_parallel.
ollama_context_length: 131072

# Two concurrent requests PER LOADED MODEL, then queue. With
# ollama_max_loaded_models: 2 that is up to 4 in flight across the warm pair.
# This is the other half of the 128k trade above: these two multiply into the KV
# budget, so raise one only by lowering the other.
ollama_num_parallel: 2

ollama_flash_attention: 1
ollama_kv_cache_type: "q8_0"

# -1 pins the warm pair resident across handoffs (no idle eviction).
ollama_keep_alive: "-1"

# Exactly the warm pair — a third resident model would blow the KV budget above.
ollama_max_loaded_models: 2

# Vulkan ICD selector for the committed Vulkan path (RADV = Mesa's AMD driver).
# Only consumed when gpu_backend == "vulkan" (see roles/amdgpu_rocm/defaults).
ollama_vulkan_icd: "RADV"

# ─────────────────────────────────────────────────────────────────────────────
# Models — two warm base models, no baked variants
# ─────────────────────────────────────────────────────────────────────────────
# Policy (2026-07): exactly two base models stay resident, with NO baked system
# prompts. Agent roles live in prompts (workstation/opencode.json agents,
# loopkit strategy prompts), so one loaded model serves many differently-
# prompted agents instead of one variant per role:
#   qwen3-coder-next:latest      MoE 80B-A3B (3B active) — coding + deep reasoning
#   qwen3.6:35b-a3b-mtp-q4_K_M   MoE 35B-A3B (3B active) — general, orchestration
#
# WHY MoE ON BOTH SLOTS — the rule that governs model choice on this box.
# Strix Halo is memory-bandwidth-bound, not compute-bound. Decode speed tracks
# the *active* parameters read per token, not the total parameter count.
# Calibration anchor (measured on this node): qwen3.6:35b-a3b-mtp-q4_K_M runs
# 70–80 t/s, which implies ~185 GB/s of effective bandwidth (~86% of the ~215
# GB/s real ceiling). Everything else follows from that number:
#   qwen3.6:35b-a3b q4   22 GB,  3B active   →  70–80 t/s  (measured)
#   qwen3-coder-next     51 GB,  3B active   →  ~35–50 t/s (estimate)
#   gpt-oss:120b         65 GB,  5.1B active →  ~30 t/s    (community-measured)
#   qwen3.6:27b q4       17 GB, 27B DENSE    →  ~11–15 t/s (185/17 ≈ 11)
# The dense 27B was the previous coder slot and is ~6x slower than the driver
# while scoring ~11–15 points LOWER on SWE-bench Verified than qwen3-coder-next
# (70.6–74.2 vs ~59). Swapping it is a strict win on both axes. Never put a
# dense model in a warm slot on this hardware.
#
# ROLLBACK: the old pair is still on disk. Restore the previous behaviour by
# setting ollama_base_models in group_vars/all.yml back to the 27B pair and
# re-running `make provision`. The dense 27B is 17 GB against qwen3-coder-next's
# 51 GB, so rolling back frees ~34 GB of weights and buys the window back:
# ollama_context_length can go to 262144 again on the old pair.
#
# Reasoning is toggled per agent at the API level: reasoning_effort "none"
# disables thinking on /v1 (verified on Ollama 0.31.2). The /no_think soft
# switch and a think:false body field are BOTH ignored by /v1 — do not rely on
# them; native /api/chat honours think:false if you need it from scripts.
ollama_manage_models: true

ollama_base_models:
  - "qwen3-coder-next:latest"
  - "qwen3.6:35b-a3b-mtp-q4_K_M"

# ─── Heavy tier — pulled and kept on disk, NEVER resident ────────────────────
# Loading any of these evicts one of the warm pair (max_loaded_models: 2), so
# they are for scheduled/off-hours work only — an `agentlab-run@heavy-*` job on
# ser5, or an explicit opt-in opencode agent. Queue at night, read the eval
# scores in the morning. See docs/operating-manual.md.
#   gpt-oss:120b        117B-A5.1B MoE, ~30 t/s — best general reasoning that
#                       fits 128 GB; the "hard problem, take an hour" tier.
#   nemotron-cascade-2  Mamba2-MoE 30B-A3B — math/algorithms escalation (IMO
#                       35/42, IOI 439/600, ICPC 10/12) and a good INDEPENDENT
#                       judge for best_of_n (a different family judging beats a
#                       model grading its own samples).
# The role pulls these but nothing pins them, so they idle out and free memory.
ollama_heavy_models:
  - "gpt-oss:120b"
  - "nemotron-cascade-2:latest"

# NOT pulled by provisioning: glm-4.7-flash:latest (19 GB) is the bake-off
# challenger for the DRIVER slot, not a default. run-bakeoff.sh skips any model
# missing from mini, so to actually race it, pull it by hand first:
#   ollama pull glm-4.7-flash:latest
# Promote it into ollama_base_models only on a measured win over the incumbent.

# Legacy Modelfile variants (built via `ollama create` when listed). Empty under
# the two-base-model policy; the machinery stays for one-off experiments.
# Reclaim disk from previously built variants with:
#   ollama rm oracle-64k oracle-batch-192k toolcaller-64k heavy-128k coder-256k
# Retirement candidates once the bake-off confirms the swap (67 GB of disk):
#   ollama rm qwen3.6:27b-mtp-q8_0 qwen3.6:35b-a3b-mtp-q8_0
# q8 roughly halves throughput on a bandwidth-bound box for a marginal quality
# gain — a bad trade here. Keep qwen3.6:27b-mtp-q4_K_M until the swap is proven.
ollama_models: []
