---
# ─── Install Ollama ───────────────────────────────────────────────────────────
- name: Install Ollama via official script (idempotent — skips if binary present)
  ansible.builtin.shell:
    cmd: curl -fsSL https://ollama.com/install.sh | sh
    executable: /bin/bash
  args:
    creates: /usr/local/bin/ollama
  # The official installer:
  #   - installs /usr/local/bin/ollama
  #   - creates the `ollama` system user
  #   - installs and enables ollama.service
  # ROCm GPU detection happens automatically via HIP discovery at runtime;
  # the HSA_OVERRIDE_GFX_VERSION in the systemd override handles gfx1151.
  notify:
    - daemon-reload
    - restart ollama

# ─── GPU device access for the service account ────────────────────────────────
# The `ollama` user (created by the installer above) needs render + video group
# membership to reach /dev/kfd and /dev/dri — required by both the ROCm (HIP) and
# Vulkan (RADV) backends. Takes effect on the next service restart (notified below).
- name: Add ollama user to render and video groups (GPU device access)
  ansible.builtin.user:
    name: ollama
    groups:
      - render
      - video
    append: true
  notify: restart ollama

# ─── Ollama model directory on data disk ──────────────────────────────────────
- name: Set ownership of Ollama model directory
  ansible.builtin.file:
    path: "{{ data_mount }}/ollama"
    state: directory
    owner: ollama
    group: ollama
    mode: "0755"
  # The `ollama` user is created by the install script above, which is why this
  # role owns the directory outright (state: directory) rather than base creating
  # it first — base runs before the user exists, and having both manage it made
  # ownership flip on every converge.

# ─── Systemd service override ─────────────────────────────────────────────────
- name: Create ollama systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template ollama systemd override
  ansible.builtin.template:
    src: override.conf.j2
    dest: /etc/systemd/system/ollama.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - restart ollama

# ─── Ensure service is in the configured state ───────────────────────────────
# Not hardcoded to enabled/started any more: roles/llamacpp serves on :8090 and
# holds ~22 GiB resident, which cannot coexist with two warm Ollama models at
# 131072 context in 122 GiB. See ollama_service_* in defaults/main.yml.
- name: Ensure ollama service is in the configured state
  ansible.builtin.systemd:
    name: ollama
    enabled: "{{ ollama_service_enabled }}"
    state: "{{ ollama_service_state }}"
    daemon_reload: true

# ─── Models (two-base-model policy) ───────────────────────────────────────────
# Exactly the base models in ollama_base_models are pulled — no baked system
# prompts; agent roles live in prompts (opencode agents / loopkit). The global
# context window and reasoning toggles are runtime concerns (override.conf and
# per-request reasoning_effort), so plain base tags are all mini needs.
# Querying the existing list first keeps this idempotent — pulls won't re-run.
- name: List existing Ollama models
  ansible.builtin.command: ollama list
  register: ollama_list
  changed_when: false
  environment:
    OLLAMA_HOST: "127.0.0.1:11434"
  when: ollama_manage_models | bool

- name: Pull base models (only when missing)
  ansible.builtin.command:
    cmd: "ollama pull {{ item }}"
  loop: "{{ ollama_base_models | default([]) }}"
  environment:
    OLLAMA_HOST: "127.0.0.1:11434"
  register: ollama_pull
  changed_when: ollama_pull.rc == 0
  # A fresh pull of a ~20 GB model takes a while; steady-state re-runs skip.
  when:
    - ollama_manage_models | bool
    - item not in ollama_list.stdout

# ─── Heavy tier (pulled, never pinned) ────────────────────────────────────────
# Models kept on disk for scheduled/off-hours work. Loading one evicts a member
# of the warm pair (OLLAMA_MAX_LOADED_MODELS=2), so nothing here is resident —
# they idle out and give the memory back. Pulled here only so an overnight
# agentlab job never stalls on a 65 GB download. See group_vars/all.yml.
- name: Pull heavy-tier models (only when missing)
  ansible.builtin.command:
    cmd: "ollama pull {{ item }}"
  loop: "{{ ollama_heavy_models | default([]) }}"
  environment:
    OLLAMA_HOST: "127.0.0.1:11434"
  register: ollama_pull_heavy
  changed_when: ollama_pull_heavy.rc == 0
  when:
    - ollama_manage_models | bool
    - item not in ollama_list.stdout

# ─── Legacy Modelfile variants ────────────────────────────────────────────────
# Kept for one-off experiments; ollama_models is empty under the two-base-model
# policy. Variants are built only when missing; `ollama rm <name>` then
# re-provision to rebuild one after editing its definition in group_vars.
- name: Create Ollama Modelfile directory
  ansible.builtin.file:
    path: "{{ data_mount }}/ollama/modelfiles"
    state: directory
    owner: ollama
    group: ollama
    mode: "0755"
  when:
    - ollama_manage_models | bool
    - ollama_models | length > 0

- name: Template Ollama Modelfile variants
  ansible.builtin.template:
    src: Modelfile.j2
    dest: "{{ data_mount }}/ollama/modelfiles/Modelfile.{{ item.name }}"
    owner: ollama
    group: ollama
    mode: "0644"
  loop: "{{ ollama_models }}"
  loop_control:
    label: "{{ item.name }}"
  when: ollama_manage_models | bool

# `ollama create` is a client call: the running service (ollama user) resolves
# the FROM tag (pulling it if absent) and writes the blobs, so root is safe.
- name: Build Ollama model variants (only when missing)
  ansible.builtin.command:
    cmd: "ollama create {{ item.name }} -f {{ data_mount }}/ollama/modelfiles/Modelfile.{{ item.name }}"
  loop: "{{ ollama_models }}"
  loop_control:
    label: "{{ item.name }}"
  environment:
    OLLAMA_HOST: "127.0.0.1:11434"
  register: ollama_create
  changed_when: ollama_create.rc == 0
  when:
    - ollama_manage_models | bool
    - item.name not in ollama_list.stdout
