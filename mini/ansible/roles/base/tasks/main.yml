---
# ─── Package cache ────────────────────────────────────────────────────────────
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# ─── Kernel ───────────────────────────────────────────────────────────────────
# Ubuntu Server 26.04 LTS ships kernel 7.0, which clears the gfx1151 (Strix Halo)
# stability floor of >= 6.18.4 with no HWE/mainline-PPA juggling. The GA kernel is
# sufficient — no extra kernel package is installed here.

# ─── Kernel cmdline (GRUB) ────────────────────────────────────────────────────
# gfx1151 unified-memory tuning + NPU/SVA fix, reapplied on every provision:
#   iommu=pt                 IOMMU pass-through mode — required for SVA (Shared
#                            Virtual Addressing) used by the amdxdna NPU driver.
#                            Fixes "SVA bind device failed" on kernel 7.0.
#                            NOTE: replaces the earlier amd_iommu=off approach;
#                            pass-through still exposes no devices to guests so
#                            it is safe on this headless inference node.
#   amd_iommu=on             Explicitly enable AMD IOMMU (SVA requires it).
#   amdgpu.gttsize=131072    128 GB GTT (deprecated on newer kernels but harmless)
#   ttm.pages_limit=33554432 128 GB TTM page pool — the load-bearing flag
- name: Set gfx1151 kernel cmdline in GRUB (IOMMU/SVA + unified-memory tuning)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash iommu=pt amd_iommu=on amdgpu.gttsize=131072 ttm.pages_limit=33554432"'
    state: present
    create: true
    mode: "0644"
  register: grub_cmdline
  notify: update grub

# These flags only take effect after a reboot. Flag it here; the final play in
# site.yml performs the reboot (once update-grub has run) when auto_reboot is true.
- name: Flag that a reboot is needed (kernel cmdline changed)
  ansible.builtin.set_fact:
    reboot_needed: true
  when: grub_cmdline is changed

# ─── Base packages ────────────────────────────────────────────────────────────
- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - build-essential
      - ufw
      - curl
      - ca-certificates
      - python3-pip       # general Python tooling
    state: present

# ─── UFW firewall ─────────────────────────────────────────────────────────────
- name: Set UFW default — deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set UFW default — allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: "SSH"

# All node services (Ollama API, etc.) are reached over the tailnet.
# Allowing the whole tailscale0 interface keeps them off the LAN/WAN while making
# every service reachable to tailnet peers — no per-port rules to maintain. The
# rule is valid before tailscaled exists; it simply matches once the iface appears.
- name: Allow all inbound on the tailscale interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0
    comment: "tailnet (all services)"

- name: Enable UFW
  community.general.ufw:
    state: enabled

# ─── Data disk ───────────────────────────────────────────────────────────────
# Skipped entirely when has_data_disk: false — /data is a plain dir on root.

- name: Check if data partition already has a filesystem
  ansible.builtin.command:
    cmd: "blkid -o value -s TYPE {{ data_disk_device }}p1"
  register: data_fs_check
  changed_when: false
  failed_when: false
  when:
    - has_data_disk | bool
    - not (skip_data_disk_format | bool)

- name: Partition and format data disk (when missing or not ext4)
  when:
    - has_data_disk | bool
    - not (skip_data_disk_format | bool)
    - data_fs_check.rc != 0 or (data_fs_check.stdout | trim) != 'ext4'
  block:
    - name: Create GPT label and single partition spanning full disk
      ansible.builtin.command:
        cmd: "parted -s {{ data_disk_device }} mklabel gpt mkpart primary ext4 0% 100%"
      changed_when: true

    - name: Probe new partition table
      ansible.builtin.command:
        cmd: "partprobe {{ data_disk_device }}"
      changed_when: true

    - name: Wait for partition device node to appear
      ansible.builtin.wait_for:
        path: "{{ data_disk_device }}p1"
        timeout: 30

    - name: Format partition as ext4
      ansible.builtin.command:
        cmd: "mkfs.ext4 -F -L data {{ data_disk_device }}p1"
      changed_when: true

- name: Create data mount point
  ansible.builtin.file:
    path: "{{ data_mount }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mount data disk and add to fstab
  ansible.posix.mount:
    path: "{{ data_mount }}"
    src: "LABEL=data"
    fstype: ext4
    opts: defaults,noatime
    state: mounted
  when: has_data_disk | bool

- name: Create standard data subdirectories
  ansible.builtin.file:
    path: "{{ data_mount }}/{{ item }}"
    state: directory
    owner: "{{ node_user }}"
    group: "{{ node_user }}"
    mode: "0755"
  loop:
    - ollama
    - worktrees

# ─── amdgpu_top ──────────────────────────────────────────────────────────────
# Not in Ubuntu apt; installed from upstream GitHub releases as a .deb.
# https://github.com/Umio-Yasuno/amdgpu_top
- name: Check if amdgpu_top is already installed
  ansible.builtin.stat:
    path: /usr/bin/amdgpu_top
  register: amdgpu_top_stat

- name: Download amdgpu_top .deb
  ansible.builtin.get_url:
    url: "https://github.com/Umio-Yasuno/amdgpu_top/releases/download/v{{ amdgpu_top_version }}/amdgpu-top_{{ amdgpu_top_version }}-1_amd64.deb"
    dest: "/tmp/amdgpu-top_{{ amdgpu_top_version }}-1_amd64.deb"
    mode: "0644"
  when: not amdgpu_top_stat.stat.exists

- name: Install amdgpu_top .deb
  ansible.builtin.apt:
    deb: "/tmp/amdgpu-top_{{ amdgpu_top_version }}-1_amd64.deb"
    state: present
  when: not amdgpu_top_stat.stat.exists

# ─── Prometheus exporters ────────────────────────────────────────────────────
# Exposes node (system + GPU) metrics over the tailnet for ser5's Prometheus to
# scrape. The tailscale0 UFW allow-all rule above covers port 9100 — no extra
# firewall rules needed.
- name: Install prometheus-node-exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present

# Enable the drm collector for AMDGPU utilization + VRAM/GTT usage metrics.
# hwmon collector (GPU temps, power draw) is already on by default.
- name: Enable drm collector for prometheus-node-exporter
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: '^ARGS='
    line: 'ARGS="--collector.drm"'
    state: present
    create: true
    mode: "0644"
  notify: restart node-exporter

- name: Ensure prometheus-node-exporter is enabled and running
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
