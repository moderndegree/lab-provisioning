---
# Binary path of the hermes CLI (set by the NousResearch installer).
hermes_bin: "{{ node_home }}/.local/bin/hermes"

# Data directory for Hermes; installer and service use HERMES_HOME.
hermes_home: "{{ data_mount }}/hermes"

# TODO: PLACEHOLDER — confirm the Hermes gateway dashboard/web UI port.
# Default is reported as 8080; verify with: hermes gateway start (check output).
hermes_dashboard_port: 8080
