---
# Strix Halo AI toolboxes — https://strix-halo-toolboxes.com/
#
# THIS FILE IS TRACKED IN GIT AND IS THE SOURCE OF TRUTH FOR TOOLBOX POLICY.
# Role defaults are the LOWEST-precedence vars in Ansible, so anything set in
# group_vars/all.yml still wins. Copy a key down into all.yml only when you
# intend to diverge from the shipped policy — a copied key freezes at the value
# it had the day you copied it and silently shadows every future `git pull`.
#
# WHAT THESE ARE: pre-built container images from kyuz0 that carry a complete,
# gfx1151-patched inference/training stack (llama.cpp, ComfyUI, vLLM, ROCm
# fine-tuning, DwarfStar). They are run through distrobox — a container that
# shares the host's $HOME, /dev and user, so it behaves like a shell on mini
# rather than like an isolated service. That is the whole point: the host keeps
# exactly one ROCm/Vulkan userspace (roles/amdgpu_rocm) and everything
# experimental lives inside images that can be deleted without consequence.
#
# WHAT THEY ARE NOT: a replacement for the Ollama service. Ollama on :11434 is
# still the appliance's committed serving path (see roles/ollama). Toolboxes are
# for benchmarking backends, running raw GGUFs, image/video generation, and
# fine-tuning — workloads Ollama cannot express.
#
# ONE EXCEPTION to "nothing here is enabled at boot": roles/llamacpp runs
# llama-server as a systemd user unit inside the llama-vulkan-radv toolbox, and
# that IS enabled at boot. It measured ~3x faster than vLLM on this box, so it
# became the serving path rather than a bench. Everything else here is still
# on-demand. Consequence: llama-vulkan-radv is no longer disposable — deleting
# or recreating it takes the serving path down with it.

# Master switch, consulted by site.yml. Defaults off so a fresh clone does not
# silently pull tens of GB of images on its first provision; mini's own
# group_vars/all.yml turns it on.
enable_toolboxes: false

# ─────────────────────────────────────────────────────────────────────────────
# Packages
# ─────────────────────────────────────────────────────────────────────────────
# Ubuntu ships distrobox in universe. Upstream's docs say `toolbox` because they
# are written for Fedora; on Ubuntu the equivalent (and the tool upstream tells
# Ubuntu users to substitute) is distrobox. uidmap provides newuidmap/newgidmap,
# without which rootless Podman cannot set up a user namespace at all.
toolboxes_packages:
  - distrobox
  - uidmap

# ─────────────────────────────────────────────────────────────────────────────
# GPU device permissions
# ─────────────────────────────────────────────────────────────────────────────
# The node user is already in the render and video groups (roles/amdgpu_rocm),
# which is enough for processes running directly on the host. Inside rootless
# Podman it is not reliable: the container runs under `--userns keep-id`, and a
# GID that is not mapped into that user namespace cannot satisfy the kernel's
# check on /dev/kfd (0660 root:render) or /dev/dri/renderD128. The symptom is
# not a permission error — the GPU simply does not appear in
# `llama-cli --list-devices`, and `rocm-smi` reports "Failed to load a library".
# distrobox's own `run.oci.keep_original_groups` annotation is the group-based
# fix; this rule is the belt-and-braces one that removes the dependency entirely.
#
# Upstream documents it explicitly for headless hosts: a udev rule making the
# two compute nodes world-accessible, so access never depends on that mapping.
#
# TRADE-OFF: 0666 grants GPU compute to every local user. mini is a headless
# single-user inference node reachable only over the tailnet, so the exposed
# surface is the same set of people who could already SSH in. Set this false on
# any box with untrusted local logins — access then rests entirely on that
# annotation, which needs crun (Ubuntu's default OCI runtime) to work at all.
toolboxes_permissive_udev: true
toolboxes_udev_rule_path: "/etc/udev/rules.d/70-kfd.rules"

# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────
# GGUFs / checkpoints downloaded inside a toolbox. Kept OUT of ~ and out of
# Ollama's blob store: these are raw upstream files (often BF16, 60 GB+), they
# are not managed by `ollama pull`, and mixing them into /data/ollama would make
# `ollama prune`-style cleanup ambiguous. Bind-mounted at the same path inside
# every toolbox so a model downloaded from one is usable from all of them.
toolboxes_models_dir: "{{ data_mount }}/toolboxes/models"

# Host-side launcher scripts (one per toolbox). Ubuntu's stock ~/.profile puts
# ~/.local/bin on PATH when the directory exists, which this role guarantees.
toolboxes_bin_dir: "{{ node_home }}/.local/bin"
toolboxes_create_wrappers: true

# Tuned Triton fused-MoE configs + the device-name shim that lets vLLM find
# them. Lives under toolboxes_models_dir because that is the only path
# bind-mounted into the containers, so it survives `distrobox rm` and
# `make toolbox-refresh` — the configs cost ~10 minutes of GPU time each to
# regenerate and must not live inside a disposable image.
#
# WHY A SHIM IS NEEDED. The vllm-therock image prepends a patch to
# vllm/platforms/rocm.py ending in an unconditional
# `sys.modules["amdsmi"] = MagicMock()`, so RocmPlatform.get_device_name()
# returns a MagicMock rather than a string. vLLM builds every fused-MoE tuning
# lookup from that name:
#   E=256,N=512,device_name=<MagicMock ... id='128122929281888'>,dtype=int4_w4a16.json
# The repr embeds the object's address, so the filename changes on every start
# and no tuned config can ever match — vLLM silently logs "Using default MoE
# config. Performance might be sub-optimal!" and runs untuned block sizes.
#
# Putting the real amdsmi on PYTHONPATH does NOT fix it. The only importable
# copy is the host's ROCm 7.2.4 build reached through /run/host, and loading its
# libamd_smi into a ROCm 7.14 process breaks HIP init outright ("RuntimeError:
# 0 active drivers"). The image's mock is unconditional and would win anyway.
# So sitecustomize.py pins the name instead; `site` imports it in every
# interpreter, including the spawned EngineCore subprocesses that a wrapper
# around `vllm serve` would miss.
#
# MEASURED on Qwen3.6-35B-A3B-AWQ-4bit (E=256, N=512, int4_w4a16):
#   MoE kernel   239 us -> 154 us  (-35%)
#   decode c=1   21.9  -> 24.8 t/s (+13%)
#   decode c=8   54.3  -> 83.7 t/s (+54% aggregate)
# Regenerate after a model or vLLM change with:
#   vllm-therock env RAY_OVERRIDE_RESOURCES='{"GPU":1}' python3 benchmark_moe.py \
#     --model <repo> --tp-size 1 --batch-size 1 8 16 --dtype int4_w4a16 --tune
# then rename the emitted file to the device_name this shim pins.
toolboxes_vllm_tuned_dir: "{{ toolboxes_models_dir }}/vllm-tuned"
toolboxes_vllm_pin_device_name: "AMD Radeon 8060S Graphics"

# ─────────────────────────────────────────────────────────────────────────────
# HuggingFace cache and CLI
# ─────────────────────────────────────────────────────────────────────────────
# ONE cache, shared by the host CLI and every toolbox. It has to live under
# toolboxes_models_dir because that is the only path bind-mounted into the
# containers, and it has to be the same path on both sides or the two disagree
# about where the token file is and gated downloads fail inside the toolbox
# while working fine on the host. Exported to host shells via /etc/profile.d and
# into each container via --env in the flag profiles below.
#
# vLLM's own compiled-kernel cache (~/.cache/vllm) is deliberately NOT moved:
# it is small, and leaving it in the shared $HOME means it survives recreating
# the toolbox.
toolboxes_hf_home: "{{ toolboxes_models_dir }}/huggingface"

# vLLM takes HuggingFace repo ids, not GGUFs, so `hf download` is the front door
# for every model it serves. The toolbox images ship their own copy; this is the
# host-side one, so you can stage a 60 GB download without entering a container.
# Installed with pipx because Ubuntu 26.04 marks its Python externally-managed
# (PEP 668) and a plain `pip install --user` is refused.
toolboxes_install_hf_cli: true
toolboxes_hf_cli_spec: "huggingface_hub[cli,hf_transfer]"

# Optional. Only needed for GATED repos — meta-llama/*, google/gemma-* and
# friends, where you must also accept the licence on the model page first. The
# community AWQ quants most worth benchmarking here are ungated. Left empty
# means no token file is written and nothing else changes; `hf auth login` on
# mini remains a perfectly good alternative to putting this in the vault.
toolboxes_hf_token: "{{ vault_hf_token | default('') }}"

# ─────────────────────────────────────────────────────────────────────────────
# Podman flag profiles
# ─────────────────────────────────────────────────────────────────────────────
# Passed verbatim to Podman via `distrobox create --additional-flags`. They are
# split by backend only because Vulkan needs the render node alone while ROCm
# additionally needs /dev/kfd, the compute driver interface.
#
# seccomp=unconfined is required by both stacks: the ROCm/Vulkan userspace makes
# ioctls the default Podman seccomp profile blocks, which surfaces as the GPU
# simply not being enumerated rather than as a permission error.
#
# There is deliberately NO --group-add here. Upstream's docs add
# `--group-add keep-groups`, but distrobox already passes
# `--annotation run.oci.keep_original_groups=1` on every rootless create, which
# is exactly what Podman translates keep-groups into — repeating it buys nothing.
# (crun honours that annotation; runc does not. Ubuntu's Podman defaults to crun.)
#
# What matters is the negative rule: NEVER put a *named* group here. Under
# rootless Podman the name is resolved against the container image's /etc/group
# and the gid that comes back lives inside the user namespace, so it never maps
# to the host's render gid. Best case `--group-add render` grants nothing; worst
# case the image has no such group and the container refuses to start at all
# ("unable to find group render: no matching entries in group file").
#
# HF_HOME is set on all three so a model pulled from any toolbox — or from the
# host CLI — lands in the same cache and reuses the same token.
toolboxes_flags_vulkan: >-
  --device /dev/dri
  --security-opt seccomp=unconfined
  --env HF_HOME={{ toolboxes_hf_home }}

toolboxes_flags_rocm: >-
  --device /dev/dri
  --device /dev/kfd
  --security-opt seccomp=unconfined
  --env HF_HOME={{ toolboxes_hf_home }}

# Same devices as the ROCm profile; kept separate so vLLM-only tuning (env vars,
# ulimits, RDMA devices for clustering) has somewhere to go that does not
# perturb the llama.cpp benchmark toolboxes.
#
# PYTHONPATH and VLLM_TUNED_CONFIG_FOLDER are the fused-MoE tuning wiring
# described above: the first makes `site` load sitecustomize.py (which pins the
# GPU name so a tuned config filename is deterministic), the second tells vLLM
# where to look. They must point at the same directory. Dropping either one is
# silent — vLLM falls back to default block sizes and only says so in an
# easily-missed startup warning, so check for "Using configuration from ..."
# in the serve log after changing this.
toolboxes_flags_vllm: >-
  --device /dev/dri
  --device /dev/kfd
  --security-opt seccomp=unconfined
  --env HF_HOME={{ toolboxes_hf_home }}
  --env PYTHONPATH={{ toolboxes_vllm_tuned_dir }}
  --env VLLM_TUNED_CONFIG_FOLDER={{ toolboxes_vllm_tuned_dir }}

# ─────────────────────────────────────────────────────────────────────────────
# Which toolboxes to create
# ─────────────────────────────────────────────────────────────────────────────
# Each entry: name (distrobox + wrapper name), image (fully qualified), flags.
# Images are 10-30 GB each and are pulled on first provision, so the default set
# is deliberately small: the two llama.cpp backends worth A/B-ing on gfx1151.
# vulkan-radv is upstream's "most stable, works with every model" recommendation
# and matches this box's committed gpu_backend; rocm-7.2.4 matches the host's
# pinned ROCm and is the performance comparison. Uncomment the rest as needed —
# adding an entry and re-running `make provision` is the entire workflow.
toolboxes_instances:
  - name: "llama-vulkan-radv"
    image: "docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv"
    flags: "{{ toolboxes_flags_vulkan }}"

  - name: "llama-rocm-7.2.4"
    image: "docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-7.2.4"
    flags: "{{ toolboxes_flags_rocm }}"

  # vLLM (TheRock gfx1151 build) — continuous batching, which is the reason it
  # is here: llama.cpp and Ollama both serve concurrency poorly on this box,
  # and vLLM is the tool for measuring aggregate multi-user throughput rather
  # than single-stream t/s. It overlaps Ollama's job, so treat it as a bench
  # rig: stop ollama.service before a run or the two fight over the same 128 GB
  # of unified memory and the numbers are meaningless. Serves on :8000.
  # `:dev` is the bleeding-edge tag; `:latest` is upstream's last verified build.
  # Named for the build, not "vllm", so the launcher does not shadow the real
  # vllm binary — `vllm serve X` on the host would otherwise silently become
  # `distrobox enter --name vllm -- serve X`.
  - name: "vllm-therock"
    image: "docker.io/kyuz0/vllm-therock-gfx1151:latest"
    flags: "{{ toolboxes_flags_vllm }}"

  # ─── Other llama.cpp backends ───
  # AMDVLK is the fastest Vulkan driver but caps a single buffer allocation at
  # 2 GiB, so large single-file models fail to load. Benchmark-only.
  # - name: "llama-vulkan-amdvlk"
  #   image: "docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-amdvlk"
  #   flags: "{{ toolboxes_flags_vulkan }}"
  #
  # - name: "llama-rocm-6.4.4"
  #   image: "docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-6.4.4"
  #   flags: "{{ toolboxes_flags_rocm }}"
  #
  # Do NOT add the rocm7-nightlies tag: upstream flags a live memory-limit bug,
  # and ROCm 7 nightlies are the same thing that caps this box at 64 GB (see
  # ../amdgpu_rocm/defaults/main.yml).

  # ─── Other toolbox families (strix-halo-toolboxes.com) ───
  # Image generation / video — LTX2, Wan 2.2, HunyuanVideo, Qwen.
  # - name: "comfyui"
  #   image: "docker.io/kyuz0/amd-strix-halo-comfyui:latest"
  #   flags: "{{ toolboxes_flags_rocm }}"
  #
  # vLLM on the stable Ubuntu/ROCm base instead of TheRock. Same interface;
  # keep it around as the fallback if a TheRock build regresses.
  # - name: "vllm-rocm"
  #   image: "docker.io/kyuz0/vllm-rocm-gfx1151:latest"
  #   flags: "{{ toolboxes_flags_vllm }}"
  #
  # QLoRA / full fine-tuning (Gemma 3, Qwen 3, generic).
  # - name: "llm-finetuning"
  #   image: "docker.io/kyuz0/amd-strix-halo-llm-finetuning:latest"
  #   flags: "{{ toolboxes_flags_rocm }}"
  #
  # DwarfStar — native engine optimised for DeepSeek V4 Flash.
  # - name: "ds4-rocm-7.2.4"
  #   image: "docker.io/kyuz0/strix-halo-ds4-toolbox:rocm-7.2.4"
  #   flags: "{{ toolboxes_flags_rocm }}"

# Re-pull images that are already present on every provision. Left false because
# these images are tens of GB and are rebuilt on every llama.cpp master commit,
# so a true here turns `make provision` into an unbounded download. Refresh
# deliberately instead: `make toolbox-refresh`.
toolboxes_pull_always: false
