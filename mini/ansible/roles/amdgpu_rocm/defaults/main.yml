---
# GPU backend: rocm | vulkan
#
# TRACKED IN GIT and the source of truth. Role defaults are the lowest-precedence
# vars in Ansible, so a value in group_vars/all.yml still wins — set it there only
# to deliberately diverge from the committed path.
#
# vulkan is the COMMITTED path on mini: measured +7-26% decode vs ROCm. The role
# installs BOTH stacks regardless, so flipping this var is the whole revert — no
# separate package pass. This default used to be "rocm", which meant a fresh box
# with a pruned all.yml came up on the slower backend.
gpu_backend: "vulkan"

# Used only on the ROCm fallback path (gpu_backend: rocm), and referenced by
# roles/ollama's systemd override template on BOTH paths (it renders a commented
# revert hint, and Jinja still expands {{ }} inside a systemd '#' line), so this
# must always be defined.
# NO LONGER NEEDED as of ROCm 7.14 — kept only for the rollback path.
# gfx1151 became an officially supported target in ROCm 7.14.0 (2026-07-15), and
# 7.14 enumerates it natively: `rocminfo` reports "Name: gfx1151 / Marketing
# Name: AMD RYZEN AI MAX+ 395 w/ Radeon 8060S" with no override set. This var is
# only consumed when rocm_install_method is "apt" (the pre-7.14 path), where the
# older stack did need to be tricked into the closest supported target.
hsa_override_gfx_version: "11.5.1"


# ─── ROCm userspace (7.14 via TheRock tarball) ───────────────────────────────
# WHY A TARBALL AND NOT apt. ROCm moved to TheRock at 7.14 and the apt repo
# (repo.radeon.com/rocm/apt) is frozen at 7.2.4 — checking it and concluding
# "we are current" is a trap. 7.14 ships as per-architecture tarballs instead,
# and there is a build for exactly this GPU.
#
# WHAT 7.14 CHANGES for this box, all verified on mini:
#   - gfx1151 is an OFFICIALLY SUPPORTED target (7.14.0, 2026-07-15), not a
#     tricked-into-gfx1100 workaround. rocminfo names it natively.
#   - Ubuntu 26.04 is supported, so the old "point at the noble deb because AMD
#     has no 26.04 repo" workaround is gone.
#   - The arch-specific tarball is 8.3 GiB installed against 22 GiB for the apt
#     stack, because it carries one architecture instead of all of them.
#
# The 64 GB memory-cap bug that made ROCm 7 NIGHTLIES unusable does not apply:
# 7.14.0 is a production release. Do not confuse the two.
#
# Nothing on the serving path actually consumes this — Ollama runs Vulkan
# (OLLAMA_VULKAN=1) and roles/llamacpp carries Mesa/RADV inside its image. ROCm
# is here as the gpu_backend: rocm fallback and for host-side tooling
# (rocminfo, rocm-smi). That is why it is worth keeping small.
rocm_version: "7.14.0"
rocm_install_userspace: true
rocm_install_method: "tarball"          # "tarball" (7.14+) or "apt" (<= 7.2.4)
rocm_prefix: "/opt/rocm-{{ rocm_version }}"
rocm_tarball_url: "https://repo.amd.com/rocm/tarball-multi-arch/therock-dist-linux-gfx{{ rocm_gfx_target }}-{{ rocm_version }}.tar.gz"

# AMD publishes no sidecar .sha256 for these tarballs, so this hash is derived
# rather than official: two independent fetches of 7.14.0/gfx1151 produced it, so
# it pins the artifact as it exists today. BE HONEST ABOUT WHAT IT PROVES — it
# catches corruption in transit and silent upstream mutation of a released
# filename, which is the realistic failure. It is NOT a signature and does not
# prove provenance. Recompute and update when bumping rocm_version:
#   curl -sfL <rocm_tarball_url> | sha256sum
rocm_tarball_sha256: "2567d5e34e470db104a62a02c36aa770cb0430175e48c1c46df0eefc05e1d77c"
rocm_gfx_target: "1151"

# Legacy apt path — only consulted when rocm_install_method == "apt".
amdgpu_installer_version: "7.2.4.70204-1"
amdgpu_installer_deb: "amdgpu-install_{{ amdgpu_installer_version }}_all.deb"
amdgpu_installer_url: "https://repo.radeon.com/amdgpu-install/7.2.4/ubuntu/noble/{{ amdgpu_installer_deb }}"
