---
# GPU backend: rocm | vulkan
# Overridden by group_vars/all.yml (gpu_backend: rocm by default).
gpu_backend: "rocm"

# ─── AMD GPU installer (ROCm 7.2.4 production — pinned for gfx1151) ───────────
# ROCm 7.2.x production is the community-proven stack for gfx1151 (Strix Halo).
# Do NOT use 7.9–7.12 preview/nightlies: ROCm 7 nightlies cap memory allocation
# at 64 GB (known bug) — useless on this 128 GB box.
#
# NOTE: AMD has not published a 26.04 ("questing") ROCm repo. The amdgpu-install
# deb is just the repo-config/installer; the ROCm *userspace* it pulls (installed
# with --no-dkms, driven by the in-tree amdgpu) works on 26.04. We therefore point
# at the `noble` (24.04) deb. Switch the codename below if/when AMD ships a 26.04 repo.
rocm_version: "7.2.4"
amdgpu_installer_version: "7.2.4.70204-1"
amdgpu_installer_deb: "amdgpu-install_{{ amdgpu_installer_version }}_all.deb"
amdgpu_installer_url: "https://repo.radeon.com/amdgpu-install/7.2.4/ubuntu/noble/{{ amdgpu_installer_deb }}"
