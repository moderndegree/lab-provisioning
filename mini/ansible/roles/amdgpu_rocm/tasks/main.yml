---
# ─── Vulkan / RADV — always installed as ROCm fallback ───────────────────────
# Mesa RADV (Vulkan) is installed regardless of gpu_backend so that flipping
# gpu_backend to "vulkan" never requires a separate package install pass.
- name: Install Mesa Vulkan drivers and tools
  ansible.builtin.apt:
    name:
      - mesa-vulkan-drivers
      - vulkan-tools
    state: present

# ─── ROCm stack (gpu_backend == rocm) ────────────────────────────────────────
# gfx1151 (Strix Halo / Radeon 8060S) is NOT on AMD's official ROCm support
# matrix. The HSA_OVERRIDE_GFX_VERSION=11.5.1 workaround in /etc/profile.d/rocm.sh
# and the Ollama systemd override makes the HSA runtime recognise gfx1151.
#
# We install ROCm *userspace only* with --no-dkms: the in-tree amdgpu driver that
# ships with kernel 7.0 drives the GPU. DKMS fails to build on kernel 7.0 and
# Ryzen APUs are meant to use the inbox driver, so the kernel module is skipped.
# ROCm is pinned to 7.2.4 production (see defaults/main.yml) — no nightlies.

# ─── ROCm userspace ──────────────────────────────────────────────────────────
# Installed regardless of gpu_backend, unlike the old apt path which only ran for
# the rocm backend. Two reasons: it is the documented one-line fallback, and
# rocminfo/rocm-smi are the host-side tools for answering "what does the GPU
# think it is" — useful on a Vulkan box too. At 8.3 GiB for a single-arch build
# that is cheap insurance; set rocm_install_userspace: false to skip it.
- name: Download the ROCm tarball
  ansible.builtin.get_url:
    url: "{{ rocm_tarball_url }}"
    dest: "/tmp/rocm-{{ rocm_version }}-gfx{{ rocm_gfx_target }}.tar.gz"
    mode: "0644"
  when:
    - rocm_install_userspace | bool
    - rocm_install_method == "tarball"

- name: Create the ROCm prefix
  ansible.builtin.file:
    path: "{{ rocm_prefix }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - rocm_install_userspace | bool
    - rocm_install_method == "tarball"

# creates: makes this idempotent — the tarball is only unpacked once per version.
- name: Unpack ROCm
  ansible.builtin.unarchive:
    src: "/tmp/rocm-{{ rocm_version }}-gfx{{ rocm_gfx_target }}.tar.gz"
    dest: "{{ rocm_prefix }}"
    remote_src: true
    creates: "{{ rocm_prefix }}/bin/rocminfo"
  when:
    - rocm_install_userspace | bool
    - rocm_install_method == "tarball"

# /opt/rocm is what everything references. Under the old apt stack this was an
# update-alternatives symlink, so purging those packages deletes it — recreate it
# unconditionally rather than assuming it survived.
- name: Point /opt/rocm at the installed version
  ansible.builtin.file:
    src: "{{ rocm_prefix }}"
    dest: /opt/rocm
    state: link
    force: true
  when: rocm_install_userspace | bool

# ─── Legacy apt path (rocm_install_method: apt) ──────────────────────────────
# Kept only as a rollback to the pre-7.14 stack. It pins 7.2.4 from the noble
# repo; see defaults/main.yml for why that is no longer the right default.
- name: Download amdgpu-install deb
  ansible.builtin.get_url:
    url: "{{ amdgpu_installer_url }}"
    dest: "/tmp/{{ amdgpu_installer_deb }}"
    mode: "0644"
  when: rocm_install_method == "apt"

- name: Install amdgpu-install deb
  ansible.builtin.apt:
    deb: "/tmp/{{ amdgpu_installer_deb }}"
    state: present
  when: rocm_install_method == "apt"

- name: Run amdgpu-install for ROCm usecase (userspace only, no DKMS)
  ansible.builtin.command:
    # --no-dkms skips the out-of-tree kernel module: the in-tree amdgpu (kernel
    # 7.0) drives the GPU. DKMS does not build on kernel 7.0 and is unnecessary.
    cmd: amdgpu-install -y --usecase=rocm --no-dkms
    creates: /opt/rocm/bin/rocminfo
  when: rocm_install_method == "apt"
  notify: update initramfs

# Both backends need /dev/kfd + /dev/dri access: ROCm via HIP, RADV via Vulkan.
# (render/video are stock Ubuntu groups, present regardless of the GPU stack.)
- name: Add the node user to render and video groups (GPU device access)
  ansible.builtin.user:
    name: "{{ node_user }}"
    groups:
      - render
      - video
    append: true

- name: Install ROCm environment profile (gfx1151 override)
  ansible.builtin.copy:
    dest: /etc/profile.d/rocm.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # ROCm environment for Strix Halo (gfx1151).
      # gfx1151 is not on AMD's official support matrix; HSA_OVERRIDE_GFX_VERSION
      # instructs the HSA runtime to use the nearest supported RDNA3 target.
      export HSA_OVERRIDE_GFX_VERSION="{{ hsa_override_gfx_version }}"
      export ROCM_PATH=/opt/rocm
      export PATH="${ROCM_PATH}/bin:${PATH}"
      export LD_LIBRARY_PATH="${ROCM_PATH}/lib:${LD_LIBRARY_PATH:-}"
  when: gpu_backend == "rocm"

- name: Remove ROCm profile if switching to Vulkan backend
  ansible.builtin.file:
    path: /etc/profile.d/rocm.sh
    state: absent
  when: gpu_backend == "vulkan"

# The Vulkan backend selector (OLLAMA_GPU_DRIVER) is set in the ollama systemd
# override (roles/ollama/templates/override.conf.j2), NOT /etc/environment —
# systemd units do not source /etc/environment, so it would never reach the service.
