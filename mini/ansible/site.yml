---
# Entry point — provision mini end-to-end.
# Run: make provision
#
# Role execution order (dependencies flow top-to-bottom):
#   base        → kernel, packages, UFW, data disk mount
#   amdgpu_rocm → ROCm stack + Vulkan fallback drivers
#   ollama      → Ollama LLM server + model variants (depends on amdgpu_rocm)
#   tailscale   → tailnet access
#   containers  → rootless Podman; user lingering; quadlet support
#   cloudflared → Cloudflare Zero Trust tunnel (enable_cloudflared: true to activate)
#
# Open WebUI moved to ser5 (roles/openwebui there) — mini stays inference-only.

- name: Provision mini
  hosts: mini
  become: true
  gather_facts: true
  roles:
    - role: base
    - role: amdgpu_rocm
    - role: ollama
    - role: tailscale
    - role: containers
    - role: cloudflared
      when: enable_cloudflared | bool

# Reboot last — after the provision play's handlers (update-grub, update-initramfs)
# have flushed — so the gfx1151 kernel cmdline is regenerated *then* applied in one
# `make provision`. reboot_needed is set by the base role only when the cmdline
# actually changed, so steady-state re-runs never reboot.
- name: Apply kernel changes
  hosts: mini
  become: true
  gather_facts: false
  tasks:
    - name: Reboot to apply gfx1151 kernel cmdline
      ansible.builtin.reboot:
        msg: "Rebooting to apply gfx1151 kernel cmdline (amd_iommu/gtt/ttm)"
        reboot_timeout: 600
      when:
        - reboot_needed | default(false) | bool
        - auto_reboot | bool
