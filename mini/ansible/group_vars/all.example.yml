---
# mini group_vars — copy to all.yml and fill in real values.
# all.yml is gitignored; all.example.yml (this file, with placeholders) is tracked.
#
# Run: make init   → copies this file to ansible/group_vars/all.yml
# Then edit ansible/group_vars/all.yml with your real values.

# ─────────────────────────────────────────────────────────────────────────────
# Node identity
# Single source of truth for the OS user and home dir used by service accounts,
# file ownership, home paths, and the Ansible SSH login (ansible_user, below).
# node_user MUST match `username:` in autoinstall/user-data (cloud-init is static
# and cannot read this var). node_hostname likewise matches the autoinstall hostname.
# ─────────────────────────────────────────────────────────────────────────────
node_user: "YOUR_USERNAME"
node_home: "/home/{{ node_user }}"
node_hostname: "{{ inventory_hostname }}"

# Drive the Ansible SSH login from node_user (overrides any value in inventory.ini).
ansible_user: "{{ node_user }}"

# ─────────────────────────────────────────────────────────────────────────────
# Pinned versions
# Update these values when upgrading; re-run `make provision` to converge.
# ─────────────────────────────────────────────────────────────────────────────

# NodeSource LTS stream (resolves to Node.js v22.x as of 2026-06)
# ─────────────────────────────────────────────────────────────────────────────
# GPU backend
#   vulkan → Mesa RADV (COMMITTED primary — measured +7–26% decode vs ROCm)
#   rocm   → AMD ROCm stack (fallback; flip this var to revert if Vulkan regresses)
# The amdgpu_rocm role installs BOTH stacks; this var only chooses which backend
# the Ollama systemd override activates. See the moderndegree agent-stack runbook.
# ─────────────────────────────────────────────────────────────────────────────
gpu_backend: "vulkan"

# ─────────────────────────────────────────────────────────────────────────────
# Ollama service environment (written to systemd override.conf)
# ─────────────────────────────────────────────────────────────────────────────
# Bind address. 0.0.0.0 makes the API reachable over the tailnet; UFW restricts
# inbound to the tailscale0 interface, so nothing is actually exposed on the LAN.
# Set to 127.0.0.1 to keep Ollama local-only. The Hermes gateway runs on ser5 and
# reaches this API over the tailnet (http://mini:11434).
ollama_host: "0.0.0.0"
# GLOBAL context window — applies to every model Ollama loads (per-request
# num_ctx is not reachable through the /v1 endpoint opencode/loopkit use).
# Maxed to the native window of both base models (262144). KV-cache budget at
# 256k with q8_0:
#   qwen3.6:27b      (65 layers, 4 KV heads × 256)  ≈ 34 GB
#   qwen3.6:35b-a3b  (41 layers, 2 KV heads × 256)  ≈ 11 GB
# → weights (18 + 23 GB) + KV ≈ 86 GB of the ~110 GB GPU pool. Headroom is
# real but thin — if a third model ever needs to load, drop this to 131072
# first. Prefill is the wall at ~205 t/s: a fully-packed 256k prompt costs
# ~21 min before first token. The window is capacity, not a target.
ollama_context_length: 262144
# Single interactive stream — the warm pair is sized for one agent loop at a time.
ollama_num_parallel: 1
ollama_flash_attention: 1
ollama_kv_cache_type: "q8_0"
# -1 pins the warm pair resident across handoffs (no idle eviction).
ollama_keep_alive: "-1"
# Exactly the warm pair — a third resident model would blow the KV budget above.
ollama_max_loaded_models: 2

# Vulkan ICD selector for the committed Vulkan path (RADV = Mesa's AMD driver).
ollama_vulkan_icd: "RADV"

# Used only on the ROCm fallback path (gpu_backend: rocm). Strix Halo is NOT on
# AMD's official ROCm support matrix; HSA_OVERRIDE_GFX_VERSION tricks ROCm into the
# closest supported target (RDNA3/gfx1100). Kernel 7.0 clears the >=6.18.4 floor.
hsa_override_gfx_version: "11.5.1"

# ─────────────────────────────────────────────────────────────────────────────
# Ollama models — two warm base models, no baked variants
# ─────────────────────────────────────────────────────────────────────────────
# Policy (2026-07): exactly two base models stay resident, with NO baked system
# prompts. Agent roles live in prompts (workstation/opencode.json agents,
# loopkit strategy prompts), so one loaded model serves many differently-
# prompted agents instead of one variant per role:
#   qwen3.6:27b-mtp-q4_K_M      dense — complex coding + deep reasoning
#   qwen3.6:35b-a3b-mtp-q4_K_M  MoE (3B active) — general tasks, orchestration
# Reasoning is toggled per agent at the API level: reasoning_effort "none"
# disables thinking on /v1 (verified on Ollama 0.31.2). The /no_think soft
# switch and a think:false body field are BOTH ignored by /v1 — do not rely
# on them; native /api/chat honours think:false if you need it from scripts.
# NOTE: the tags must be pullable; adjust to the exact tags your store carries.
ollama_manage_models: true
ollama_base_models:
  - "qwen3.6:27b-mtp-q4_K_M"
  - "qwen3.6:35b-a3b-mtp-q4_K_M"

# Legacy Modelfile variants (built via `ollama create` when listed). Empty
# under the two-base-model policy; the machinery stays for one-off experiments.
# Reclaim disk from previously built variants with:
#   ollama rm oracle-64k oracle-batch-192k toolcaller-64k heavy-128k coder-256k
ollama_models: []

# ─────────────────────────────────────────────────────────────────────────────
# Data disk
# ─────────────────────────────────────────────────────────────────────────────
# Set false when there is no dedicated data disk (single-disk node).
# /data will be a plain directory on the root filesystem instead.
has_data_disk: false

# Only used when has_data_disk: true.
data_disk_device: "/dev/nvme1n1"
data_mount: "/data"

# Set true to skip first-time partition+format (disk is already prepared).
# Only relevant when has_data_disk: true.
skip_data_disk_format: false

# ─────────────────────────────────────────────────────────────────────────────
# Converge behaviour
# ─────────────────────────────────────────────────────────────────────────────
# When the gfx1151 kernel cmdline changes (first provision, or any later edit),
# the new flags only take effect after a reboot. With auto_reboot: true the play
# reboots mini at the very end — after update-grub/update-initramfs have run — so a
# single `make provision` fully converges and `cat /proc/cmdline` reflects reality.
# Set false if you prefer to schedule the reboot yourself.
auto_reboot: true

# ─────────────────────────────────────────────────────────────────────────────
# Cloudflare Tunnel (browser-reachable, public "from anywhere" path)
# ─────────────────────────────────────────────────────────────────────────────
# Tailscale (above) is the primary, fully-private path. Enable cloudflared as well
# for browser access without a VPN client. The tunnel only *starts* once a real
# vault_cloudflared_token is set, so leaving this true with a placeholder token is
# safe (it won't break a provision). Hostname→service mapping and — importantly —
# Cloudflare Access policies are configured in the Zero Trust dashboard, so your
# domain and routes never live in this repo. See README "Remote access".
enable_cloudflared: true

# Pin to a release tag/digest for reproducible deploys (default is :latest).
cloudflared_image: "docker.io/cloudflare/cloudflared:latest"
cloudflared_autoupdate: true

# ─────────────────────────────────────────────────────────────────────────────
# Open WebUI (browser chat UI for mini's local Ollama)
# ─────────────────────────────────────────────────────────────────────────────
# Rootless Podman quadlet (roles/containers sets up lingering + quadlet support).
# Reaches Ollama via Podman's host.containers.internal alias — no Tailscale DNS
# involved for that hop (see roles/openwebui/defaults/main.yml). Reachable over
# the tailnet at http://mini:8080 (UFW's blanket tailscale0 allow) and, once
# enable_cloudflared is wired up with a public hostname, via the tunnel too.
enable_openwebui: false
openwebui_port: 8080
# First provision: leave true, create the admin account in the UI, then flip to
# false and re-run `make provision` to stop accepting new self-service signups.
openwebui_enable_signup: true
