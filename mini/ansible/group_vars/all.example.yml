---
# mini group_vars — copy to all.yml (`make init`) and fill in real values.
# all.yml is gitignored; this file, with placeholders, is tracked.
#
# ─────────────────────────────────────────────────────────────────────────────
# READ THIS BEFORE ADDING A KEY
# ─────────────────────────────────────────────────────────────────────────────
# This file is for values that are specific to YOUR box: identity, disks, and
# deliberate feature toggles. It is NOT where serving policy lives.
#
# Serving policy (context window, concurrency, which models stay warm, package
# versions, GPU backend) lives in TRACKED role defaults:
#     roles/ollama/defaults/main.yml       context, parallelism, model tiers
#     roles/amdgpu_rocm/defaults/main.yml  gpu_backend, ROCm/Vulkan pinning
#     roles/base/defaults/main.yml         amdgpu_top version
#     roles/cloudflared/defaults/main.yml  tunnel image, autoupdate
#
# Role defaults are the LOWEST-precedence vars in Ansible, so anything you set
# here still wins. The reason policy lives there and not here is that all.yml is
# gitignored and `make init` only copies this file when all.yml is ABSENT —
# so a key you copy into all.yml freezes at that value forever and silently
# shadows every future `git pull`. Copy a policy key down here ONLY when you
# intend to diverge, and delete it again when you no longer do.
#
# Check what Ansible will actually apply, after all precedence, with:
#     make show-config

# ─────────────────────────────────────────────────────────────────────────────
# Node identity  (REQUIRED — no role default, provisioning fails without these)
# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth for the OS user and home dir used by service accounts,
# file ownership, home paths, and the Ansible SSH login (ansible_user, below).
# node_user MUST match `username:` in autoinstall/user-data (cloud-init is static
# and cannot read this var). node_hostname likewise matches the autoinstall hostname.
node_user: "YOUR_USERNAME"
node_home: "/home/{{ node_user }}"
node_hostname: "{{ inventory_hostname }}"

# Drive the Ansible SSH login from node_user (overrides any value in inventory.ini).
ansible_user: "{{ node_user }}"

# ─────────────────────────────────────────────────────────────────────────────
# Data disk  (REQUIRED — data_mount is consumed by the ollama role)
# ─────────────────────────────────────────────────────────────────────────────
# Set has_data_disk false when there is no dedicated data disk (single-disk node);
# /data then becomes a plain directory on the root filesystem instead.
has_data_disk: false

# Only used when has_data_disk: true.
data_disk_device: "/dev/nvme1n1"
data_mount: "/data"

# Set true to skip first-time partition+format (disk is already prepared).
# Only relevant when has_data_disk: true.
skip_data_disk_format: false

# ─────────────────────────────────────────────────────────────────────────────
# Converge behaviour
# ─────────────────────────────────────────────────────────────────────────────
# When the gfx1151 kernel cmdline changes (first provision, or any later edit),
# the new flags only take effect after a reboot. With auto_reboot: true the play
# reboots mini at the very end — after update-grub/update-initramfs have run — so a
# single `make provision` fully converges and `cat /proc/cmdline` reflects reality.
# Set false if you prefer to schedule the reboot yourself.
auto_reboot: true

# ─────────────────────────────────────────────────────────────────────────────
# Optional overrides — uncomment ONLY to diverge from the tracked default
# ─────────────────────────────────────────────────────────────────────────────
# Every key below already has a working value in a role default. Leaving them
# commented means you inherit policy updates automatically on `git pull`.
# Uncommenting pins the value on this box until you remove the line again.

# ─── Remote access (roles/cloudflared) ───
# Tailscale is the primary, fully-private path and is always on. Enable this for
# browser access to the tunnel without a VPN client. cloudflared only *starts*
# once a real vault_cloudflared_token is set, so enabling it with a placeholder
# token is safe. Open WebUI now lives on ser5 (roles/openwebui there), not mini.
# enable_cloudflared: true

# ─── llama.cpp serving path (roles/llamacpp) ───
# Podman quadlets, one per entry in llamacpp_instances: llama-quality on :8090
# (THE DRIVER — 4 slots, MTP n-max 3, 105 tok/s single-stream) and llama-deep on
# :8091 (Qwen3.8-27B, 1 slot, ~30 tok/s, called deliberately for hard problems).
# 105 tok/s against vLLM's 25 on the same model and hardware — see that role's
# defaults for why the gap is the checkpoint, not the runtime.
#
#   systemctl --user start|stop|status llama-servers.target
#
# Needs the GGUFs staged first (the role asserts they exist) — see
# docs/provisioning-checklist.md. Holds ~83 GiB resident across both instances
# (measured together 2026-08-14), hence the two Ollama lines below. The old
# llama-throughput/nemotron instance was retired 2026-08-14 as dominated.
# enable_llamacpp: true

# ─── Ollama service lifecycle (roles/ollama/defaults/main.yml) ───
# Uncomment these two ONLY alongside enable_llamacpp above. Ollama stays
# installed (it is still how models are pulled) but must not serve at the same
# time as llama-server — they cannot both hold weights in 122 GiB. Leaving them
# commented keeps the role's default of enabled/started, which is correct when
# Ollama is the serving path.
# ollama_service_enabled: false
# ollama_service_state: stopped

# ─── GPU backend (roles/amdgpu_rocm/defaults/main.yml) ───
# Default is "vulkan" (committed path, +7-26% decode vs ROCm). Both stacks are
# installed either way, so this one line is the entire revert.
# gpu_backend: "rocm"

# ─── Ollama policy (roles/ollama/defaults/main.yml) ───
# Ollama is no longer the serving path, so its defaults are sized for hand
# testing: 32768 context, 1 parallel, 1 loaded, keep_alive 5m — it must give GPU
# memory back rather than pin it. Context and parallelism MULTIPLY into the KV
# budget, so raise one only by lowering the other, and stop a llama-server
# instance first.
# ollama_context_length: 32768
# ollama_num_parallel: 1
