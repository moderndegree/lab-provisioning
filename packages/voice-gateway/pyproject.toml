[project]
name = "voice-gateway"
version = "0.1.0"
description = "Streaming voice loop for the lab: VAD -> STT -> mini -> TTS, with barge-in."
requires-python = ">=3.11"

# Deliberately few and boring. Every one of these is load-bearing:
#   fastapi/uvicorn  the WS server the clients speak to
#   httpx            streaming SSE from mini and streaming PCM from the TTS
#   websockets       the WhisperLive client (WhisperLive is WS-only)
#   numpy            int16 <-> float32 for the VAD window
#   silero-vad       endpointing and barge-in; ships its own ONNX weights, so
#                    there is no separate model download step to provision
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13.0",
    "numpy>=1.26",
    "silero-vad>=5.1",
    "onnxruntime>=1.19",
]

[project.optional-dependencies]
# The Windows push-to-talk client. Not installed on ser5 — the gateway never
# touches an audio device, it only moves PCM between sockets.
client = [
    "sounddevice>=0.5",
    "openwakeword>=0.6",
    "pynput>=1.7",
]

[project.scripts]
voice-gateway = "voice_gateway.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voice_gateway*"]
