[project]
name = "voice-chatter"
version = "0.1.0"
description = "OpenAI-compatible TTS for the lab presence: Chatterbox Turbo with zero-shot cloning."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Isolated from the gateway venv on purpose. Chatterbox pulls its own torch;
# silero-vad on ser5 must not see it, and this process lives on the workstation GPU.
engine = [
    "chatterbox-tts",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
voice-chatter = "voice_chatter.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voice_chatter*"]
