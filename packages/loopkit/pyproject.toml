[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopkit"
version = "0.1.0"
description = "AI loop strategies (refine, best-of-N, ACE playbooks, STaR bootstrapping, evals) against the lab's local inference node"
requires-python = ">=3.10"
# Zero runtime dependencies by design: loopkit must run on a freshly provisioned
# ser5 with nothing but the system Python. Everything uses the stdlib
# (urllib for HTTP, sqlite3 for run tracking, json/argparse for the CLI).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
loopkit = "loopkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
