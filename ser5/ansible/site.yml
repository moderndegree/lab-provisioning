---
# Provision ser5 end-to-end.
# Run: make provision  (idempotent — safe to re-run)
#
# Role execution order:
#   base           → kernel, apt, UFW, user account, SSH keys
#   desktop        → GNOME (ubuntu-desktop-minimal)
#   storage        → mount 1TB SATA SSD at {{ data_mount }}; create subdirs
#   workstation    → git, ansible, podman, libvirt-clients, editor; dev workstation + Ansible control node
#   virtualization → libvirt + qemu-kvm + virt-manager; IaC test-lab pool on {{ data_mount }}/vms
#   containers     → rootless Podman; user lingering; quadlet support
#   tailscale      → join tailnet with authkey from vault
#   cloudflared    → Cloudflare Zero Trust tunnel (enable_cloudflared: true to activate)
#   hermes         → Hermes gateway quadlet (enable_hermes: true to activate)
#   agentlab       → quality-loop experiment layer (enable_agentlab: true to activate)
#   brain          → Obsidian-compatible second-brain vault under /data/brain
#   observability  → Prometheus + Grafana quadlets (enable_observability: true to activate)
#   backups        → restic snapshots + daily timer (enable_backups: true to activate)

- name: Provision ser5
  hosts: ser5_host
  become: true
  gather_facts: true
  roles:
    - role: base
    - role: desktop
    - role: storage
    - role: workstation
    - role: virtualization
    - role: containers
    - role: tailscale
    - role: cloudflared
      when: enable_cloudflared | bool
    - role: hermes
      when: enable_hermes | bool
    - role: agentlab
      when: enable_agentlab | bool
    - role: brain
      when: enable_brain | bool
    - role: observability
      when: enable_observability | bool
    - role: backups
      when: enable_backups | bool
