---
# ser5 group_vars — copy to all.yml and fill in real values.
# all.yml is gitignored; all.example.yml (this file, with placeholders) is tracked.
#
# Run: make init   → copies this file to ansible/group_vars/all.yml
# Then edit ansible/group_vars/all.yml with your real values.

# ─── Node identity ────────────────────────────────────────────────────────────
# MUST match USERNAME / HOSTNAME in .bootstrap.env — autoinstall is static and
# cannot read Ansible vars. Keep them in sync or the user account won't exist
# when Ansible tries to connect.
username: "YOUR_USERNAME"
user_full_name: "Your Full Name"
hostname: "YOUR_HOSTNAME"

# Derived path — do NOT change; roles reference {{ user_home }}
user_home: "/home/{{ username }}"

# Ansible SSH login follows username (single source of truth)
ansible_user: "{{ username }}"

# ─── Locale ───────────────────────────────────────────────────────────────────
# Must match LOCALE / KEYBOARD_LAYOUT / TIMEZONE in .bootstrap.env (autoinstall).
timezone: "America/Chicago"
locale: "en_US.UTF-8"
keyboard_layout: "us"

# ─── SSH authorized keys ──────────────────────────────────────────────────────
# List of public keys to install in ~/.ssh/authorized_keys.
# Must include at least the key whose private half your Ansible control node uses.
ssh_authorized_keys:
  - "ssh-ed25519 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA your_comment_here"

# ─── Wi-Fi (optional) ─────────────────────────────────────────────────────────
# Managed by NetworkManager in the desktop role. Leave wifi_ssid blank to skip
# (wired-only hosts). The password lives in the vault as vault_wifi_psk.
wifi_ssid: ""

# ─── Disk layout ──────────────────────────────────────────────────────────────
# Verify device names before running: lsblk -d -o NAME,SIZE,MODEL,TRAN
#
# os_disk   — 500GB NVMe; targeted by autoinstall ONLY (never touched by Ansible)
# data_disk — 1TB SATA SSD; configured by the storage role
# data_disk_partition — first partition on data_disk
#   SATA SSD:  /dev/sda  → /dev/sda1    (default)
#   NVMe:      /dev/nvme1n1 → /dev/nvme1n1p1
os_disk: "/dev/nvme0n1"
data_disk: "/dev/sda"
data_disk_partition: "/dev/sda1"
data_mount: "/data"

# Set true if the data disk is already partitioned and formatted (skip fdisk/mkfs).
# When true, ensure the partition has label 'data': e2label /dev/sda1 data
skip_data_disk_format: false

# ─── Node.js / opencode-ai ───────────────────────────────────────────────────
# Node version installed by `n` into the user prefix (~/.n). Use "lts", "latest",
# or a pinned version like "22.14.0". Re-run make provision to change.
node_version: "lts"
# opencode-ai pinned npm version. Update and re-run make provision to upgrade.
opencode_version: "1.17.8"

# ─── Grok Build (xAI coding agent CLI) ───────────────────────────────────────
# Installed by the workstation role via https://x.ai/cli/install.sh into
# ~/.grok/bin. Use "latest" for the current stable, or pin e.g. "0.2.101".
# Auth is NOT provisioned: on the host run `grok login` (SuperGrok / X Premium+)
# or set XAI_API_KEY. Hermes can delegate coding to this CLI when
# enable_hermes_grok_skill is true (see Hermes section below).
grok_version: "latest"
grok_auto_update: false
grok_permission_mode: "ask"          # ask | always-approve
grok_default_model: "grok-build-0.1"

# ─── Tailscale ────────────────────────────────────────────────────────────────
# "latest" installs/upgrades to the current stable release (recommended — the
# Tailscale apt repo only keeps recent versions, so exact pins can age out).
# To pin, set an exact version that exists at https://pkgs.tailscale.com/stable/
# (e.g. "1.98.4"); re-run make provision to apply.
tailscale_version: "latest"

# ─── Feature flags ───────────────────────────────────────────────────────────
# Optional roles now reflect the running ser5 profile; leave true when rebuilding.
enable_observability: true    # Prometheus + Grafana quadlets (mini metrics reachable)
enable_backups: true          # restic snapshots + daily timer (needs real vault_restic_password)
enable_agentlab: true         # loopkit AI-loop layer (needs mini reachable over tailnet)

# ─── Cloudflare Zero Trust tunnel ────────────────────────────────────────────
# System-level Podman quadlet. Token lives in vault (vault_cloudflared_token).
# The tunnel only STARTS once a real token is vaulted — a PLACEHOLDER never
# crashes a provision run. Hostname→service routing is in the Zero Trust dashboard.
enable_cloudflared: false
cloudflared_image: "docker.io/cloudflare/cloudflared:latest"
cloudflared_autoupdate: true

# ─── Hermes gateway (remote agent surface) ───────────────────────────────────
# Installed via the official NousResearch installer and run as a systemd user
# service. Points at mini for Tier L (Sovereign) inference over the tailnet.
# See roles/hermes/defaults/main.yml for hermes_home, hermes_bin, hermes_version.
enable_hermes: true
hermes_ollama_base_url: "http://mini:11434"
# Expose Hermes's OpenAI-compatible proxy (port 8645) to the tailnet so other
# machines (AI Workstation, scripts) can chat through Hermes. UFW-scoped to
# the tailscale0 interface. See roles/hermes/defaults/main.yml to tune.
enable_hermes_proxy: true
# Expose the Hermes dashboard browser UI on port 9119 to the tailnet only.
# This is the sovereign phone/browser surface for client-confidential work.
enable_hermes_dashboard: true
#
# Messaging gateways configured on the running ser5. `hermes gateway start --all`
# starts every configured platform adapter; this list documents paired platforms
# and drives token writing from vault when values are real (non-PLACEHOLDER).
enable_hermes_messaging: true
hermes_messaging_platforms:
  - "telegram"
  - "discord"
#
# Governance / privacy boundary:
# Telegram and Discord route through their providers' servers, so use messaging
# for personal/lab traffic and notifications only. Client-confidential work uses
# the tailnet-only dashboard (:9119) or SSH. This is a rule, not a preference.
#
# Grok / xAI integration (special Hermes support — does NOT change default model):
#   1. Official skill: Hermes can spawn the `grok` CLI for coding tasks
#      (requires Grok Build on PATH from the workstation role + `grok login`).
#   2. Optional model provider: SuperGrok OAuth (`hermes auth add xai-oauth`)
#      or vault_xai_api_key → HERMES_HOME/.env as XAI_API_KEY (provider: xai).
# OAuth cannot be automated; run post-provision steps on the host (see README).
# xAI is Tier X Personal and never for client-confidential work.
enable_hermes_grok_skill: true
# When true and vault_xai_api_key is set (non-PLACEHOLDER), write XAI_API_KEY
# into HERMES_HOME/.env for API-key path. Prefer OAuth for SuperGrok tiers.
enable_hermes_xai_api_key: false
# Optional: set Hermes web search backend to xAI when xAI credentials exist.
# Leave empty to leave config alone; set "xai" to prefer xAI-hosted search.
hermes_web_backend: ""

# ─── Future stubs (not yet implemented) ───────────────────────────────────────
# Set true only after the corresponding role is built.
enable_postgres: false
enable_forgejo: false
enable_jellyfin: false
enable_coolify: false

# ─── Repo URL (for bootstrap documentation) ───────────────────────────────────
repo_url: "https://github.com/YOUR_GH_USERNAME/ser5-provisioning"
