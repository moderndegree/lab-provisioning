# Group is named ser5_host (not ser5) so it doesn't collide with the host's own
# name below — Ansible warns/behaves ambiguously when a group and host share a name.
[ser5_host]
# After autoinstall, find the assigned IP:
#   - Check your router's DHCP table, OR
#   - Connect a monitor/keyboard and run: ip addr show
# Then set HOST_IP in .bootstrap.env and run: make render
${HOSTNAME} ansible_host=${HOST_IP}

[ser5_host:vars]
ansible_python_interpreter=/usr/bin/python3
# Accept the host key on first connection. Remove this line once the key is in known_hosts.
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
