---
# SearXNG — rootless Podman quadlet, JSON API for Open WebUI web search.
# Joins the existing openwebui.network so Open WebUI can resolve "searxng".

- name: searxng stub — role is disabled
  ansible.builtin.debug:
    msg: >
      searxng role is disabled (enable_searxng: false).
      Set enable_searxng: true in group_vars/all.yml to activate.
  when: not (enable_searxng | default(false) | bool)

- name: Deploy SearXNG
  when: enable_searxng | default(false) | bool
  block:
    - name: Resolve {{ username }} UID (needed for systemctl --user calls)
      ansible.builtin.command: "id -u {{ username }}"
      register: searxng_user_uid
      changed_when: false

    - name: Ensure SearXNG data directory exists
      ansible.builtin.file:
        path: "{{ searxng_data_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0750"

    # Secret is generated once and reused. settings.yml is world-readable
    # inside the container, so the secret lives in a 0600 sidecar file that
    # ansible reads back into the template.
    - name: Generate persistent SearXNG secret (first run only)
      ansible.builtin.shell:
        cmd: openssl rand -hex 32 > {{ searxng_secret_file }}
      args:
        creates: "{{ searxng_secret_file }}"
      changed_when: true

    - name: Restrict SearXNG secret file
      ansible.builtin.file:
        path: "{{ searxng_secret_file }}"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0600"

    - name: Read SearXNG secret
      ansible.builtin.slurp:
        src: "{{ searxng_secret_file }}"
      register: searxng_secret_slurp
      no_log: true

    - name: Set searxng_secret fact
      ansible.builtin.set_fact:
        searxng_secret: "{{ searxng_secret_slurp.content | b64decode | trim }}"
      no_log: true

    - name: Write SearXNG settings.yml (JSON format required by Open WebUI)
      ansible.builtin.template:
        src: settings.yml.j2
        dest: "{{ searxng_data_dir }}/settings.yml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - restart searxng

    - name: Write SearXNG limiter.toml (bot detection off — private lab)
      ansible.builtin.template:
        src: limiter.toml.j2
        dest: "{{ searxng_data_dir }}/limiter.toml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - restart searxng

    - name: Template SearXNG quadlet unit
      ansible.builtin.template:
        src: searxng.container.j2
        dest: "{{ user_home }}/.config/containers/systemd/searxng.container"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - searxng daemon-reload
        - restart searxng

    - name: Flush handlers (daemon-reload before enable/start)
      ansible.builtin.meta: flush_handlers

    - name: Ensure searxng user service is started
      ansible.builtin.systemd:
        name: searxng.service
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ searxng_user_uid.stdout }}"
      when: not ansible_check_mode

    - name: Check for an existing Open WebUI database
      ansible.builtin.stat:
        path: "{{ openwebui_db_path }}"
      register: openwebui_db

    - name: Write Open WebUI web-search config helper
      ansible.builtin.template:
        src: configure-openwebui.py.j2
        dest: "{{ searxng_data_dir }}/configure-openwebui.py"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0750"
      when: openwebui_db.stat.exists

    - name: Point Open WebUI PersistentConfig at this SearXNG
      ansible.builtin.command:
        cmd: python3 {{ searxng_data_dir }}/configure-openwebui.py
      register: openwebui_search_config
      changed_when: true
      when:
        - openwebui_db.stat.exists
        - not ansible_check_mode
