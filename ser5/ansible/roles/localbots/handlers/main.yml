---
- name: localbots daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ username }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ localbots_user_uid.stdout }}"

- name: restart localbots
  ansible.builtin.systemd:
    name: localbots.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ username }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ localbots_user_uid.stdout }}"
