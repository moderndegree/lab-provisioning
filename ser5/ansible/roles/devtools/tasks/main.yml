---
# Developer tooling: make ser5 a usable Linux workstation and Ansible control node.
# This role installs the toolset needed to author and run Ansible playbooks locally
# (i.e. to rehearse provisioning the mini or other targets from ser5).
#
# NOTE: This role does NOT install AI inference stacks, ROCm, or GPU compute tooling.
# The Vega iGPU is for display/transcode only; inference runs on the mini.

- name: Install workstation packages
  ansible.builtin.apt:
    name:
      # Version control + build
      - git
      - build-essential
      - make
      # Ansible control node
      - ansible
      - ansible-lint
      # Container tooling
      - podman
      # libvirt client (server-side installed by virtualization role)
      - libvirt-clients
      - virt-viewer
      # CLI utilities
      - jq
      - tree
      - ripgrep
      - fd-find
      - tmux
      - neovim
      - btop
      # Network debugging
      - nmap
      - netcat-openbsd
      - dnsutils
      # Python
      - python3-pip
      - python3-venv
      # YAML linting (for this repo)
      - yamllint
    state: present

- name: Install required Ansible collections (as the provisioned user)
  ansible.builtin.command:
    cmd: >
      ansible-galaxy collection install
      community.general
      ansible.posix
      community.libvirt
  become: true
  become_user: "{{ username }}"
  register: galaxy_install
  changed_when: "'Nothing to do' not in galaxy_install.stdout"

# ─── Node.js via NodeSource LTS (v22.x) — bootstrap only ─────────────────────
# Provides a recent npm to bootstrap the user-space toolchain below. After this,
# `n` manages Node versions under the user's own prefix (no sudo).
- name: Check if NodeSource apt repository is configured
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/nodesource.list
  register: nodesource_list

- name: Download NodeSource LTS setup script
  ansible.builtin.get_url:
    url: "https://deb.nodesource.com/setup_lts.x"
    dest: /tmp/nodesource_setup.sh
    mode: "0700"
  when: not nodesource_list.stat.exists

- name: Run NodeSource setup script (configures apt repo)
  ansible.builtin.command:
    cmd: bash /tmp/nodesource_setup.sh
  changed_when: true
  when: not nodesource_list.stat.exists

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

# ─── Migration cleanup: remove old root-owned global packages ────────────────
# Earlier versions of this role installed n / opencode-ai into the system prefix
# (/usr/lib/node_modules, root-owned, sudo to update). Remove them so the
# user-owned copies below are the only ones. Idempotent: no-op once gone.
- name: Remove old system-global n / opencode-ai (pre-user-prefix installs)
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: absent
  loop:
    - n
    - opencode-ai

# ─── User-owned npm/n prefixes (no-sudo global installs) ─────────────────────
# Split layout: `n` manages Node under ~/.n (N_PREFIX); npm installs globals into
# ~/.npm-global. Both are user-owned, so Node version installs and global npm
# packages never need sudo.
- name: Ensure user-owned n + npm prefix directories exist
  ansible.builtin.file:
    path: "{{ user_home }}/{{ item }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"
  loop:
    - .n
    - .npm-global

- name: Configure npm to use the user-owned global prefix
  ansible.builtin.copy:
    dest: "{{ user_home }}/.npmrc"
    content: "prefix={{ user_home }}/.npm-global\n"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"

- name: Set N_PREFIX and PATH for the user's interactive shells
  ansible.builtin.blockinfile:
    path: "{{ user_home }}/.bashrc"
    create: true
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED — node (n) user prefix"
    block: |
      export N_PREFIX="$HOME/.n"
      export PATH="$N_PREFIX/bin:$HOME/.npm-global/bin:$PATH"

# ─── n (Node.js version manager) — user space ────────────────────────────────
- name: Install n (Node.js version manager) into the npm user prefix
  community.general.npm:
    name: n
    global: true
    state: present
  become: true
  become_user: "{{ username }}"
  environment:
    HOME: "{{ user_home }}"
    npm_config_prefix: "{{ user_home }}/.npm-global"
  # Switch Node versions with `n latest` / `n lts` — installs into ~/.n, no sudo.

# ─── Node.js runtime via n (installs into ~/.n) ──────────────────────────────
- name: Check the active Node version under N_PREFIX
  ansible.builtin.command:
    cmd: "{{ user_home }}/.n/bin/node --version"
  become: true
  become_user: "{{ username }}"
  register: n_node_version
  changed_when: false
  failed_when: false

- name: Install the target Node version with n
  ansible.builtin.command:
    cmd: "{{ user_home }}/.npm-global/bin/n {{ node_version }}"
  become: true
  become_user: "{{ username }}"
  environment:
    HOME: "{{ user_home }}"
    N_PREFIX: "{{ user_home }}/.n"
  register: n_install
  # Re-run n when no Node is active yet, or when the install/download actually ran.
  changed_when: >-
    ('installed' in (n_install.stdout | lower))
    or ('installing' in (n_install.stdout | lower))
    or ('downloading' in ((n_install.stdout ~ n_install.stderr) | lower))
  when: n_node_version.rc != 0 or node_version not in ('lts', 'latest')

# ─── opencode-ai (global npm package) — user space ───────────────────────────
- name: Install opencode-ai into the npm user prefix
  community.general.npm:
    name: opencode-ai
    version: "{{ opencode_version }}"
    global: true
    state: present
  become: true
  become_user: "{{ username }}"
  environment:
    HOME: "{{ user_home }}"
    npm_config_prefix: "{{ user_home }}/.npm-global"
  # Pinned to {{ opencode_version }} — update opencode_version in group_vars/all.yml to upgrade

# ─── opencode global config ───────────────────────────────────────────────────
- name: Ensure ~/.config/opencode directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/opencode"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"

- name: Deploy opencode global config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../workstation/opencode.json"
    dest: "{{ user_home }}/.config/opencode/opencode.json"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"

- name: Deploy opencode AGENTS.md into config directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../workstation/AGENTS.md"
    dest: "{{ user_home }}/.config/opencode/AGENTS.md"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"

- name: Deploy .moderndegree prompts and support files into config directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../workstation/.moderndegree/"
    dest: "{{ user_home }}/.config/opencode/.moderndegree/"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
    directory_mode: "0755"

# ─── Prune skills/prompts deleted from the repo ──────────────────────────────
# ansible.builtin.copy on a directory only ADDS and overwrites — it never removes
# a file that disappeared from the source. Every agent loads
# .moderndegree/skills/*.md, so a deleted skill keeps being injected into every
# prompt indefinitely.
#
# This was not theoretical: quality-flow.md, quality-gate.md and
# work-breakdown.md survived the 2026-08 quality-loop deletion and were still
# being loaded on 2026-08-05. quality-gate.md instructs the orchestrator to run
# `qloop gate` — a binary that no longer exists — so agents were being told to
# invoke a deleted tool as a REQUIRED step.
#
# Comparing both trees is deliberate: an explicit deny-list of known-stale names
# needs updating every time something is removed, which is the same failure again.
- name: Enumerate .moderndegree source files (control node)
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../../workstation/.moderndegree"
    recurse: true
    file_type: file
  register: moderndegree_src
  delegate_to: localhost
  become: false
  changed_when: false

- name: Enumerate deployed .moderndegree files
  ansible.builtin.find:
    paths: "{{ user_home }}/.config/opencode/.moderndegree"
    recurse: true
    file_type: file
  register: moderndegree_deployed
  changed_when: false

- name: Prune deployed .moderndegree files no longer present in the repo
  ansible.builtin.file:
    path: "{{ user_home }}/.config/opencode/.moderndegree/{{ item }}"
    state: absent
  loop: "{{ moderndegree_deployed_rel | difference(moderndegree_src_rel) }}"
  vars:
    moderndegree_src_rel: >-
      {{ moderndegree_src.files | map(attribute='path')
         | map('regex_replace', '^.*/workstation/\.moderndegree/', '') | list }}
    moderndegree_deployed_rel: >-
      {{ moderndegree_deployed.files | map(attribute='path')
         | map('regex_replace', '^.*/\.config/opencode/\.moderndegree/', '') | list }}

# ─── Grok Build (xAI coding agent CLI) ───────────────────────────────────────
# Official installer places the binary under ~/.grok/bin and may symlink into
# ~/.local/bin. Auth is interactive (grok login) or XAI_API_KEY — not provisioned
# here. Hermes can delegate coding tasks to this CLI via the official skill
# (see roles/hermes).
- name: Check if Grok Build binary exists
  ansible.builtin.stat:
    path: "{{ user_home }}/.grok/bin/grok"
  register: grok_binary_stat

- name: Resolve installed Grok Build version
  ansible.builtin.command:
    cmd: "{{ user_home }}/.grok/bin/grok --version"
  become: true
  become_user: "{{ username }}"
  register: grok_installed_version
  changed_when: false
  failed_when: false
  when: grok_binary_stat.stat.exists

# Download to a file (not stdin) so bash reads the script from the file path
# rather than stdin — same pattern as the Hermes installer task.
- name: Install Grok Build CLI via official xAI installer
  ansible.builtin.shell:
    cmd: >-
      curl -fsSL https://x.ai/cli/install.sh
      -o /tmp/grok-install-{{ username }}.sh &&
      chmod 700 /tmp/grok-install-{{ username }}.sh &&
      {% if grok_version | length > 0 and grok_version != 'latest' -%}
      bash /tmp/grok-install-{{ username }}.sh {{ grok_version }}
      {%- else -%}
      bash /tmp/grok-install-{{ username }}.sh
      {%- endif %}
    executable: /bin/bash
  environment:
    HOME: "{{ user_home }}"
    USER: "{{ username }}"
  become: true
  become_user: "{{ username }}"
  when: >-
    not grok_binary_stat.stat.exists
    or (
      grok_version | length > 0
      and grok_version != 'latest'
      and grok_binary_stat.stat.exists
      and grok_version not in (grok_installed_version.stdout | default(''))
    )
  register: grok_install_result
  failed_when: grok_install_result.rc != 0

- name: Ensure Grok Build is on PATH for interactive shells
  ansible.builtin.blockinfile:
    path: "{{ user_home }}/.bashrc"
    create: true
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED — grok build"
    block: |
      export PATH="$HOME/.grok/bin:$PATH"
      [[ -r "$HOME/.grok/completions/bash/grok.bash" ]] && source "$HOME/.grok/completions/bash/grok.bash"

- name: Ensure ~/.grok directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.grok"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"

- name: Deploy Grok Build global config
  ansible.builtin.template:
    src: grok-config.toml.j2
    dest: "{{ user_home }}/.grok/config.toml"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
    force: false
  # force: false — do not clobber operator edits after first provision
