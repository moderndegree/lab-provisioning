---
# Read-only probes for roles/devtools. Appends to `problems`; changes nothing.
#
# Every version in group_vars was pinned BECAUSE the box had already drifted off
# it — opencode was pinned at 1.18.17 after being found at 1.18.13, grok and
# tailscale were pinned to "what is installed". Pinning records the intent; it
# does not detect the next drift. npm in particular will happily leave a newer
# global package in place, and `state: present` with a version is not enforced on
# an already-installed package by every path through this role.
#
# These read the binaries. A mismatch is not automatically a fault — it usually
# means someone upgraded deliberately and the var needs updating — but it should
# never be a surprise.

- name: Read the active Node version
  ansible.builtin.command: "{{ user_home }}/.n/bin/node --version"
  become: true
  become_user: "{{ username }}"
  register: verify_node
  changed_when: false
  failed_when: false
  check_mode: false

- name: Flag a Node version off the pin
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [
        'node is ' ~ (verify_node.stdout | trim) ~ ' but node_version pins ' ~ node_version ~ '.'
      ] }}
  when:
    - node_version not in ['lts', 'latest']
    - verify_node.rc == 0
    - (verify_node.stdout | trim | regex_replace('^v', '')) != (node_version | regex_replace('^v', ''))

- name: Flag a missing Node install
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [user_home ~ '/.n/bin/node is not runnable — the user-prefix Node install is gone.'] }}
  when: verify_node.rc != 0

- name: Read the installed opencode version
  ansible.builtin.command: "{{ user_home }}/.npm-global/bin/opencode --version"
  become: true
  become_user: "{{ username }}"
  environment:
    PATH: "{{ user_home }}/.npm-global/bin:{{ user_home }}/.n/bin:/usr/local/bin:/usr/bin:/bin"
  register: verify_opencode
  changed_when: false
  failed_when: false
  check_mode: false

- name: Flag an opencode version off the pin
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [
        'opencode is ' ~ (verify_opencode.stdout_lines[-1] | trim) ~ ' but opencode_version pins '
        ~ opencode_version ~ ' — this is the exact drift the pin was added for.'
      ] }}
  when:
    - opencode_version not in ['latest']
    - verify_opencode.rc == 0
    - opencode_version not in (verify_opencode.stdout | default(''))

- name: Read the installed Grok Build version
  ansible.builtin.command: "{{ user_home }}/.grok/bin/grok --version"
  become: true
  become_user: "{{ username }}"
  register: verify_grok
  changed_when: false
  failed_when: false
  check_mode: false

- name: Flag a Grok Build version off the pin
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [
        'grok is ' ~ (verify_grok.stdout_lines[-1] | trim) ~ ' but grok_version pins '
        ~ grok_version ~ ' (grok_auto_update is ' ~ (grok_auto_update | bool) ~ ').'
      ] }}
  when:
    - grok_version not in ['latest']
    - verify_grok.rc == 0
    - grok_version not in (verify_grok.stdout | default(''))

# ─────────────────────────────────────────────────────────────────────────────
# skills.sh freshness
# ─────────────────────────────────────────────────────────────────────────────
# The skills under ~/.agents/skills are what OpenCode loads on demand for
# framework best practices. A dead refresh timer does not fail anything — it just
# quietly serves whatever was current the day it stopped, which is the failure
# this timer exists to prevent. Same shape as a backup timer that runs and
# snapshots nothing.
- name: Read the skills refresh timer state
  ansible.builtin.command: systemctl --user is-active skills-update.timer
  become: true
  become_user: "{{ username }}"
  environment: "{{ user_systemd_env }}"
  register: verify_skills_timer_raw
  changed_when: false
  failed_when: false
  check_mode: false
  when: skills_update_enabled | bool

- name: Flag a stopped skills refresh timer
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [
        'skills-update.timer is ' ~ (verify_skills_timer_raw.stdout | default('absent') | trim)
        ~ ' — the skills in ~/.agents/skills stop being refreshed and silently go stale.'
      ] }}
  when:
    - skills_update_enabled | bool
    - (verify_skills_timer_raw.stdout | default('') | trim) != 'active'

- name: Check how stale the installed skills are
  ansible.builtin.slurp:
    src: "{{ user_home }}/.agents/.skill-lock.json"
  register: verify_skill_lock
  failed_when: false
  when: skills_update_enabled | bool

# Every entry carries its install/update timestamp. If the NEWEST one is older
# than two refresh cycles, the timer is nominally fine and nothing is landing.
- name: Flag skills that have not moved in a long time
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [
        'the newest entry in ~/.agents/.skill-lock.json is from ' ~ verify_skill_newest[:10]
        ~ ' — nothing has updated in over 30 days despite the weekly timer.'
      ] }}
  vars:
    verify_skill_newest: >-
      {{ ((verify_skill_lock.content | b64decode | from_json).skills | default({}))
         | dict2items | map(attribute='value.installedAt') | select('string') | list | sort | last | default('') }}
  when:
    - skills_update_enabled | bool
    - verify_skill_lock.content is defined
    - verify_skill_newest | length > 0
    - verify_skill_newest[:10] < '%Y-%m-%d' | strftime((ansible_date_time.epoch | int) - 2592000)
