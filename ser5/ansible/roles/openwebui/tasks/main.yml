---
# Open WebUI — rootless Podman quadlet, browser chat UI reaching mini's Ollama
# over the tailnet. The containers role (runs earlier in site.yml) already
# enables lingering and creates ~/.config/containers/systemd/.

- name: openwebui stub — role is disabled
  ansible.builtin.debug:
    msg: >
      openwebui role is disabled (enable_openwebui: false).
      Set enable_openwebui: true in group_vars/all.yml to activate.
  when: not (enable_openwebui | bool)

- name: Deploy Open WebUI
  when: enable_openwebui | bool
  block:
    - name: Resolve {{ username }} UID (needed for systemctl --user calls)
      ansible.builtin.command: "id -u {{ username }}"
      register: openwebui_user_uid
      changed_when: false

    - name: Ensure Open WebUI data directory exists
      ansible.builtin.file:
        path: "{{ openwebui_data_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0750"

    # WEBUI_SECRET_KEY signs Open WebUI's session JWTs. Without a persisted value,
    # Open WebUI generates a random one on every container start, silently logging
    # everyone out on each restart/update. `creates:` makes this a one-time
    # generation; the value is then left alone across re-provisions.
    - name: Generate persistent Open WebUI secret key (first run only)
      ansible.builtin.shell:
        cmd: echo "WEBUI_SECRET_KEY=$(openssl rand -hex 32)" > {{ openwebui_env_file }}
      args:
        creates: "{{ openwebui_env_file }}"
      changed_when: true

    - name: Set ownership/permissions on Open WebUI env file
      ansible.builtin.file:
        path: "{{ openwebui_env_file }}"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0600"

    - name: Ensure user containers/systemd quadlet directory exists
      ansible.builtin.file:
        path: "{{ user_home }}/.config/containers/systemd"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Write Open WebUI Podman network quadlet
      ansible.builtin.template:
        src: openwebui.network.j2
        dest: "{{ user_home }}/.config/containers/systemd/openwebui.network"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - openwebui daemon-reload

    - name: Template Open WebUI quadlet unit
      ansible.builtin.template:
        src: openwebui.container.j2
        dest: "{{ user_home }}/.config/containers/systemd/openwebui.container"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - openwebui daemon-reload
        - restart openwebui

    - name: Flush handlers (daemon-reload before enable/start)
      ansible.builtin.meta: flush_handlers

    # No enabled: true here — openwebui.service is Quadlet-generated (from
    # openwebui.container's own [Install] WantedBy=), and `systemctl enable`
    # on a generated/transient unit fails with "Unit ... is transient or
    # generated". Quadlet wires its own autostart at generation time.
    - name: Ensure openwebui user service is started
      ansible.builtin.systemd:
        name: openwebui.service
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ openwebui_user_uid.stdout }}"
      when: not ansible_check_mode

    - name: Enable podman auto-update timer (image updates)
      ansible.builtin.systemd:
        name: podman-auto-update.timer
        enabled: true
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ openwebui_user_uid.stdout }}"
      when:
        - openwebui_autoupdate | bool
        - not ansible_check_mode
