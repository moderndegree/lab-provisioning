---
# Open WebUI — the ChatGPT-style browser UI, talking to mini's llama-server
# instances over the tailnet. Disabled by default — flip enable_openwebui: true in group_vars/all.yml.
enable_openwebui: false

# Pinned to a release tag for reproducible deploys.
# https://github.com/open-webui/open-webui/pkgs/container/open-webui
#
# Was ":main" until 2026-08-12 — a ROLLING DEV TAG, not a release, and
# openwebui_autoupdate below has podman pulling it on a timer. That combination
# meant an unattended dev build could land on a service published through
# Cloudflare, with nothing in the repo recording what was running. The pin below
# is the version that was already live at the time of the change, so it is a
# no-op deploy, not an upgrade.
openwebui_image: "ghcr.io/open-webui/open-webui:v0.11.0"

# Data (accounts, chat history, uploaded docs for RAG) persists on the data disk.
openwebui_data_dir: "{{ data_mount }}/services/openwebui/data"

# Root-only-readable env file holding the generated WEBUI_SECRET_KEY (see tasks).
openwebui_env_file: "{{ data_mount }}/services/openwebui/webui.env"

# Open WebUI listens on 8080 inside the container.
openwebui_port: 8080

# Loopback-only, same posture as roles/observability's Grafana — ser5 has no
# blanket tailscale0 UFW allow (unlike mini). Reach it remotely via
# `tailscale serve --bg --https=8080 http://127.0.0.1:8080` or the Cloudflare
# tunnel (enable_cloudflared) once a hostname is routed to it.
openwebui_host: "127.0.0.1"

# Reaches mini's Ollama over the tailnet — see openwebui.network.j2 for the
# DNSSearch trick that makes "mini" resolve from inside the container netns.
openwebui_ollama_base_url: "http://mini:11434"

# ─────────────────────────────────────────────────────────────────────────────
# OpenAI-compatible backends (mini's llama-server)
# ─────────────────────────────────────────────────────────────────────────────
# Ollama and llama-server speak DIFFERENT protocols. OLLAMA_BASE_URL above only
# makes Open WebUI query mini:11434/api/tags; it will never discover the
# llama-server on :8090, which serves the OpenAI API. Without these vars the
# model list is empty whenever ollama.service is stopped — which is now the
# normal state, because llama-server holds ~22 GiB resident and cannot coexist
# with two warm Ollama models at 131072 context in 122 GiB
# (see ../../../mini/ansible/roles/llamacpp/defaults/main.yml).
#
# SEEDS ONLY — these do NOT override a configured instance. Open WebUI keeps its
# live settings in the `config` table of webui.db and falls back to DEFAULT_CONFIG
# (built from these env vars) only for keys the table does not have. Once anyone
# saves Admin Settings -> Connections, the DB wins and changing these vars has no
# effect. So they matter on a fresh data dir; to change an existing install, edit
# it in the UI. Editing webui.db by hand needs the container STOPPED, or the
# running app flushes its cached config back over the change on restart.
#
# Whitespace is not trimmed on the DB path: a URL saved through the UI with a
# trailing space becomes "http://mini:8000/v1 ", which aiohttp percent-encodes
# into ".../v1%20/models" and the endpoint 404s while looking correct on screen.
# The env-var path below is trimmed (config.py strips each split element), which
# is one more reason to prefer a rebuild over hand-editing.
#
# Semicolon-separated, and the two lists are positional: the Nth key belongs to
# the Nth URL. Open WebUI skips an endpoint whose key is empty, so a placeholder
# is required even though llama-server takes no API key and ignores it.
# Authentication is not the security boundary here: mini's UFW only allows 22/tcp
# from outside plus everything on tailscale0, so :8090 is unreachable from the
# 10.0.0.0/24 wifi LAN and the exposed surface is the tailnet.
#
# Both ports are llama-server instances managed by mini's roles/llamacpp — real
# boot services, unlike the vLLM bench servers on :8000/:8001 this used to point
# at. Those were dropped because vLLM measured ~3x slower single-stream
# (25 vs 87 tok/s); add them back only for a bench.
#
# Both models are discovered dynamically from each endpoint's /v1/models, so a
# model swap on mini needs NO change here — the new alias simply appears in the
# picker after the llama-server restart. These notes exist so the picker's two
# entries are legible; keep them true.
#
#   :8090  qwen3.6-35b-a3b-mtp  GENERAL — 106 tok/s single-stream, 109 at
#          4-way. 262144 ctx per chat = 1048576 total / 4 slots, the model's
#          full native window. Default for chat, planning, critique, docs.
#   :8091  qwen3.8-27b          CODING — ~25 tok/s. 262144 ctx per chat on a
#          SINGLE slot, the full native window. A second concurrent request
#          QUEUES. FOUR TIMES SLOWER than :8090. Use for implementation and
#          hard design. A long answer here is a two-to-three MINUTE wait;
#          that is expected, not a hang.
#
# Measured 2026-08-14 on llama.cpp b10380 with fanoutsim.py. Earlier figures in
# this file came from long-generation synthetics and read about twice as fast as
# real traffic; these do not.
#
# :8091 replaced nemotron-3.5-lightning on 2026-08-14, which had in turn replaced
# gpt-oss-20b. Nemotron was retired because :8090 with MTP beat it on BOTH
# aggregate (106.4 vs 92.1) and single-stream (90.8 vs 70.8) — it was dominated,
# not merely slower.
#
# Qwen3.8-27B is a reasoning model: expect a collapsed "thinking" section before
# the answer. llama.cpp separates that into reasoning_content, so it will not
# contaminate the visible reply. The server pins reasoning_effort=medium; the
# model's own default (xhigh) spends 8192 tokens thinking and returns NOTHING.
#
# It is also natively multimodal (image + video), but the vision projector is
# staged on mini WITHOUT being wired into the server, so image uploads to :8091
# will NOT work until --mmproj is added there.
#
# Context is per SLOT and statically partitioned at startup, so a single chat can
# never exceed the per-slot figure no matter how idle the box is.
openwebui_enable_openai_api: true
openwebui_openai_base_urls: "http://mini:8090/v1;http://mini:8091/v1"
openwebui_openai_api_keys: "llamacpp;llamacpp"

# Let `podman auto-update` pull a newer image on its timer.
#
# Now that openwebui_image is a fixed release tag this is nearly inert — it can
# only pick up a re-push of that exact tag, not a new version. Left ON so a
# security re-tag still lands; set false for strict control. It was genuinely
# dangerous while the image tracked ":main".
openwebui_autoupdate: true

# Open WebUI's own signup flow (separate from Cloudflare Access). Leave true for
# first provision so you can create the admin account, then flip to false and
# re-run `make provision` to stop accepting new self-service signups.
openwebui_enable_signup: true
