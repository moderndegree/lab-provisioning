---
# Open WebUI — the ChatGPT-style browser UI, talking to mini's halogen
# server over the tailnet. Disabled by default — flip enable_openwebui: true in group_vars/all.yml.
enable_openwebui: false

# Pinned to a release tag for reproducible deploys.
# https://github.com/open-webui/open-webui/pkgs/container/open-webui
#
# Was ":main" until 2026-08-12 — a ROLLING DEV TAG, not a release, and
# openwebui_autoupdate below has podman pulling it on a timer. That combination
# meant an unattended dev build could land on a service published through
# Cloudflare, with nothing in the repo recording what was running. Bump this
# pin on purpose when upgrading; auto-update only re-pulls this exact tag.
# 2026-11-24: v0.12.4 -> v0.13.4.
openwebui_image: "ghcr.io/open-webui/open-webui:v0.13.4"

# Data (accounts, chat history, uploaded docs for RAG) persists on the data disk.
openwebui_data_dir: "{{ data_mount }}/services/openwebui/data"

# Root-only-readable env file holding the generated WEBUI_SECRET_KEY (see tasks).
openwebui_env_file: "{{ data_mount }}/services/openwebui/webui.env"

# Open WebUI listens on 8080 inside the container.
openwebui_port: 8080

# Loopback-only — ser5 has no blanket tailscale0 UFW allow (unlike mini).
# Grafana is the exception (0.0.0.0 + a tailscale0 UFW rule). Reach Open WebUI
# remotely via `tailscale serve --bg --https=8080 http://127.0.0.1:8080` or the
# Cloudflare tunnel (enable_cloudflared) once a hostname is routed to it.
openwebui_host: "127.0.0.1"

# Ollama backends over the tailnet. DNSSearch= on the container (MagicDNS
# suffix) is what makes short names like "desktop" and "mini" resolve from
# inside the netns.
#
# desktop (Windows, tailnet name `desktop`) is the LIVE Ollama — currently
# serving qwen3.5:4b, qwen3.5:9b, gpt-oss:20b. mini:11434 is installed but
# STOPPED: halogen holds the GPU, and the two cannot both stay resident.
# Do not point the enabled Ollama connection at mini unless you have stopped
# halogen and started ollama.service by hand.
#
# Plural, semicolon-separated. Seed only — once Admin -> Connections is saved,
# webui.db wins (see the OpenAI comment block below).
openwebui_ollama_base_urls: "http://desktop:11434"
# Legacy singular; kept as the first URL so anything still reading
# OLLAMA_BASE_URL does not silently go back to dead mini:11434.
openwebui_ollama_base_url: "http://desktop:11434"
openwebui_enable_ollama_api: true

# ─────────────────────────────────────────────────────────────────────────────
# OpenAI-compatible backends (mini's halogen)
# ─────────────────────────────────────────────────────────────────────────────
# Ollama and halogen speak DIFFERENT protocols. OLLAMA_BASE_URLS above only
# makes Open WebUI query those hosts' /api/tags. Halogen serves the OpenAI API
# at http://mini:8731/v1, model id qwen3.8-flash (it also accepts the old
# llama.cpp alias qwen3.8-flash-next). Ports 8090 and 8091 are Breeze TTS, not
# chat. Without the OpenAI vars below, the model list is empty whenever no
# Ollama is reachable. mini's ollama.service stays stopped while halogen holds
# the GPU; desktop is the live Ollama.
#
# SEEDS ONLY — these do NOT override a configured instance. Open WebUI keeps its
# live settings in the `config` table of webui.db and falls back to DEFAULT_CONFIG
# (built from these env vars) only for keys the table does not have. Once anyone
# saves Admin Settings -> Connections, the DB wins and changing these vars has no
# effect. So they matter on a fresh data dir. To change an existing install, use
# the admin connections API or the UI. Editing webui.db by hand needs the
# container STOPPED, or the running app flushes its cached config back over the
# change on restart.
#
# Whitespace is not trimmed on the DB path: a URL saved through the UI with a
# trailing space becomes "http://mini:8731/v1 ", which aiohttp percent-encodes
# into ".../v1%20/models" and the endpoint 404s while looking correct on screen.
# The env-var path below is trimmed (config.py strips each split element).
#
# Semicolon-separated, and the two lists are positional: the Nth key belongs to
# the Nth URL. Open WebUI skips an endpoint whose key is empty on the env path,
# so a placeholder is required even though halogen takes no API key and ignores
# it. The chat API is published on mini's Tailscale address only.
#
# Models are discovered from each endpoint's /v1/models.
#
# SEEDS ONLY — once Admin -> Connections is saved, webui.db wins. Changing these
# vars alone will not update an existing install.
openwebui_enable_openai_api: true
openwebui_openai_base_urls: "http://mini:8731/v1"
openwebui_openai_api_keys: "llamacpp"

# Let `podman auto-update` pull a newer image on its timer.
#
# Now that openwebui_image is a fixed release tag this is nearly inert — it can
# only pick up a re-push of that exact tag, not a new version. Left ON so a
# security re-tag still lands; set false for strict control. It was genuinely
# dangerous while the image tracked ":main".
openwebui_autoupdate: true

# Open WebUI's own signup flow (separate from Cloudflare Access). Leave true for
# first provision so you can create the admin account, then flip to false and
# re-run `make provision` to stop accepting new self-service signups.
openwebui_enable_signup: true
