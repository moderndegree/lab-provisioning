---
- name: Update apt cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - build-essential
      - curl
      - ca-certificates
      - ufw
      - openssh-server
      - python3
      - python3-pip
      - apt-transport-https
      - gnupg
      - lsb-release
      - unzip
      - htop
      - vim
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Ensure locale is generated
  community.general.locale_gen:
    name: "{{ locale }}"
    state: present

- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"

- name: Ensure /etc/hosts reflects hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ hostname }}"
    state: present

- name: Ensure primary user account
  ansible.builtin.user:
    name: "{{ username }}"
    comment: "{{ user_full_name }}"
    password: "{{ vault_user_password_hash }}"
    update_password: always
    shell: /bin/bash
    create_home: true
    groups:
      - sudo
    append: true

- name: Set up authorized SSH keys for user
  ansible.posix.authorized_key:
    user: "{{ username }}"
    state: present
    key: "{{ item }}"
  loop: "{{ ssh_authorized_keys }}"

- name: Configure UFW defaults — deny inbound, allow outbound
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - {direction: incoming, policy: deny}
    - {direction: outgoing, policy: allow}

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Ensure sshd is enabled and running
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started
