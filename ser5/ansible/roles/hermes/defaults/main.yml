---
# Hermes gateway — the remote agent surface, installed via the official NousResearch
# installer and run as a systemd user service on ser5. It routes requests to mini
# for Tier L (Sovereign) inference over the tailnet.
#
# Disabled by default — flip enable_hermes: true in group_vars/all.yml to activate.
enable_hermes: false

# Hermes CLI binary (placed here by the NousResearch installer).
hermes_bin: "{{ user_home }}/.local/bin/hermes"

# Data directory for Hermes; the installer and service both use HERMES_HOME.
# Lives under the data disk services/ tree created by the storage role.
hermes_home: "{{ data_mount }}/services/hermes"

# Hermes points at mini's Ollama API over the tailnet (Tier L), NOT localhost.
hermes_ollama_base_url: "http://mini:11434"

# Version reference (installer always fetches latest; update when Hermes gains
# a --version flag and pinning becomes possible).
hermes_version: "0.16.0"

# ─── OpenAI-compatible proxy (tailnet surface) ────────────────────────────────
# `hermes proxy` exposes an OpenAI-compatible /v1 API (default 127.0.0.1:8645)
# that other tailnet machines — e.g. the AI Workstation app — use to chat
# through Hermes with its credentials/routing. The gateway alone exposes no
# HTTP API, so without this the agent is unreachable from other hosts.
enable_hermes_proxy: true
hermes_proxy_host: "0.0.0.0"
hermes_proxy_port: 8645

# UFW is default-deny; this opens the proxy port on the tailnet interface only,
# so the proxy is never reachable from the LAN or WAN.
hermes_tailnet_interface: "tailscale0"

# ─── Grok Build / xAI integration ─────────────────────────────────────────────
# Hermes has first-class xAI support (separate from the Grok Build CLI):
#
#   • Model provider: SuperGrok OAuth (`hermes auth add xai-oauth`) or API key
#     (`XAI_API_KEY` → provider: xai). Default model for OAuth is grok-build-0.1.
#     This does NOT change Hermes's default routing — Tier L stays Ollama on mini
#     unless the operator runs `hermes model` / `hermes config set` themselves.
#
#   • Coding skill: `hermes skills install official/autonomous-ai-agents/grok`
#     teaches Hermes to delegate coding to the `grok` CLI (installed by the
#     workstation role). Auth for the CLI is separate: `grok login`.
#
# Docs:
#   https://hermes-agent.nousresearch.com/docs/guides/xai-grok-oauth
#   https://hermes-agent.nousresearch.com/docs/user-guide/skills/optional/autonomous-ai-agents/autonomous-ai-agents-grok
#   https://x.ai/news/grok-hermes
enable_hermes_grok_skill: true
hermes_grok_skill: "official/autonomous-ai-agents/grok"

# Write vault_xai_api_key into HERMES_HOME/.env when true and the vault value
# is real (not a PLACEHOLDER). Prefer OAuth for SuperGrok; use API key for
# headless / pay-as-you-go.
enable_hermes_xai_api_key: false

# Optional web search backend override. Empty = leave Hermes config alone.
# Set to "xai" once xAI credentials exist (OAuth or API key).
hermes_web_backend: ""

# PATH for gateway/proxy so Hermes can find `grok` when the skill runs.
hermes_path: "{{ user_home }}/.grok/bin:{{ user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
