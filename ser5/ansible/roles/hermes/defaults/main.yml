---
# Hermes gateway — the remote agent surface, installed via the official NousResearch
# installer and run as a systemd user service on ser5. It routes requests to mini
# for Tier L (Sovereign) inference over the tailnet.
#
# Enabled on ser5: Hermes is the always-on driver box agent surface.
enable_hermes: true

# Hermes CLI binary (placed here by the NousResearch installer).
hermes_bin: "{{ user_home }}/.local/bin/hermes"

# Data directory for Hermes; the installer and service both use HERMES_HOME.
# Lives under the data disk services/ tree created by the storage role.
hermes_home: "{{ data_mount }}/services/hermes"

# ─────────────────────────────────────────────────────────────────────────────
# Model routing — mini's llama-server over the tailnet
# ─────────────────────────────────────────────────────────────────────────────
# CORRECTED 2026-08-14. This used to be `hermes_ollama_base_url: http://mini:11434`,
# written into the units as OLLAMA_BASE_URL. That route has been DEAD since Ollama
# was stopped on mini to give its residency to llama-server — and Hermes did not
# fail over to anything local. It fell through to OpenRouter and served 292
# third-party models (found 2026-08-04, docs/todo.md).
#
# The note in todo.md and ser5/README.md said Hermes "speaks only OLLAMA_BASE_URL,
# so mini's OpenAI-compatible :8090/v1 is not a drop-in substitute." That is no
# longer true — current Hermes has a first-class `custom` provider for any
# endpoint implementing /v1/chat/completions, configured in config.yaml:
#   https://hermes-agent.nousresearch.com/docs/integrations/providers
#
# The legacy env-var path (LLM_MODEL, CUSTOM_BASE_URL) is REMOVED upstream —
# config.yaml is the single source of truth — which is why the OLLAMA_BASE_URL
# lines are gone from all three unit templates and these values are applied with
# `hermes config set` instead.
hermes_manage_model: true

# ─────────────────────────────────────────────────────────────────────────────
# Runtime settings that delegation depends on
# ─────────────────────────────────────────────────────────────────────────────
# All three were found by running a real delegation end-to-end on 2026-08-15,
# and none of them is discoverable by asking Hermes whether it can use OpenCode.
#
# terminal.timeout — the default 60s (via TERMINAL_TIMEOUT) is fine for ordinary
# commands but the LAUNCH call for a backgrounded run still has to return inside
# it. 300 leaves room without letting a genuinely hung foreground command sit for
# minutes.
#
# command_allowlist — `approvals.mode` is `manual` with a 60s timeout, so any
# command needing consent is AUTO-DENIED when nobody answers (gateway, Discord,
# cron). The denial then tends to be reported as success. Allowlisting `opencode`
# specifically keeps manual approval for everything else.
hermes_terminal_timeout: 300
hermes_command_allowlist:
  - opencode

# :8090 is the "quality" llama-server instance from mini/ansible/roles/llamacpp —
# qwen3.6-35b-a3b with MTP, ~106 tok/s single-stream, THE driver model.
# The name must match the server's --alias exactly; Hermes sends it as the model
# field and llama-server rejects anything else.
hermes_model_provider: "custom"
hermes_model_base_url: "http://mini:8090/v1"
hermes_model_default: "qwen3.6-35b-a3b-mtp"

# Per-SLOT context, not the instance total. :8090 runs ctx 1048576 across
# parallel 4, statically partitioned at startup, so one conversation can never
# exceed 262144 no matter how idle the box is. Setting the true total here would
# let Hermes build a prompt the server truncates without saying so.
hermes_model_context_length: 262144

# No API key: llama-server takes none and ignores what it is sent. The boundary
# is mini's UFW (tailnet-only), not authentication.

# Version reference ONLY — this variable controls nothing. The NousResearch
# installer always fetches latest, so a converge upgrades Hermes whether or not
# this line changes. It is the one component here that cannot be pinned.
#
# Hermes does now report a version, and it uses DATE-based tags upstream:
#   installed 2026-08-12: v0.19.0 (2026.7.20)   upstream latest: v2026.8.3
# so the box is ~3 weeks behind and the next converge will move it. The
# "+1 carried commit" in `hermes --version` is an upstream merge, not a local
# patch — nothing to preserve across an upgrade (verified 2026-08-12).
hermes_version: "2026.7.20"   # observed on ser5, NOT enforced

# ─── OpenAI-compatible proxy (tailnet surface) ────────────────────────────────
# `hermes proxy` exposes an OpenAI-compatible /v1 API (default 127.0.0.1:8645)
# that other tailnet machines — e.g. the AI Workstation app — use to chat
# through Hermes with its credentials/routing. The gateway alone exposes no
# HTTP API, so without this the agent is unreachable from other hosts.
enable_hermes_proxy: true
hermes_proxy_host: "0.0.0.0"
hermes_proxy_port: 8645

# ─── Web dashboard (browser UI) ───────────────────────────────────────────────
# `hermes dashboard` is the tailnet-only sovereign browser UI for config, API
# keys, and sessions. Bind to 0.0.0.0 so the service can listen beyond localhost
# at boot; UFW scopes the port to tailscale0 below.
enable_hermes_dashboard: true
hermes_dashboard_host: "0.0.0.0"
hermes_dashboard_port: 9119

# UFW is default-deny; this opens the proxy port on the tailnet interface only,
# so the proxy is never reachable from the LAN or WAN.
hermes_tailnet_interface: "tailscale0"
hermes_dashboard_tailnet_interface: "tailscale0"

# ─── Messaging gateway (Discord) ──────────────────────────────────────────────
# `--all` on the gateway unit just means "kill stale gateway processes across
# all profiles before starting" — it is not a platform selector. Hermes itself
# decides which platforms to activate from HERMES_HOME/.env + config.yaml, so
# enable_hermes_discord just gates whether Ansible writes the Discord token
# into .env (matching the XAI_API_KEY handling below). Telegram is not
# Ansible-managed — set up manually on the box if/when wanted (bot token +
# `hermes pairing approve telegram <code>`, a non-automatable step anyway).
enable_hermes_messaging: true
enable_hermes_discord: true
#
# Governance / privacy boundary:
# Telegram and Discord gateways route through Telegram's and Discord's servers.
# They are approved for personal/lab traffic and notifications only. Client-
# confidential work must use the tailnet-only dashboard on port 9119 or SSH.
# This is a governance rule, not an operator preference.

# ─── Grok Build / xAI integration ─────────────────────────────────────────────
# Hermes has first-class xAI support (separate from the Grok Build CLI):
#
#   • Model provider: SuperGrok OAuth (`hermes auth add xai-oauth`) or API key
#     (`XAI_API_KEY` → provider: xai). Default model for OAuth is grok-build-0.1.
#     This does NOT change Hermes's default routing — Tier L stays Ollama on mini
#     unless the operator runs `hermes model` / `hermes config set` themselves.
#
#   • Coding skill: `hermes skills install official/autonomous-ai-agents/grok`
#     teaches Hermes to delegate coding to the `grok` CLI (installed by the
#     workstation role). Auth for the CLI is separate: `grok login`.
#
# Docs:
#   https://hermes-agent.nousresearch.com/docs/guides/xai-grok-oauth
#   https://hermes-agent.nousresearch.com/docs/user-guide/skills/optional/autonomous-ai-agents/autonomous-ai-agents-grok
#   https://x.ai/news/grok-hermes
enable_hermes_grok_skill: true
hermes_grok_skill: "official/autonomous-ai-agents/grok"

# Write vault_xai_api_key into HERMES_HOME/.env when true and the vault value
# is real (not a PLACEHOLDER). Prefer OAuth for SuperGrok; use API key for
# headless / pay-as-you-go.
enable_hermes_xai_api_key: false

# Optional web search backend override. Empty = leave Hermes config alone.
# Set to "xai" once xAI credentials exist (OAuth or API key).
hermes_web_backend: ""

# ─── Repo-owned local skills ──────────────────────────────────────────────────
# Each name is a directory under roles/hermes/files/skills/<name>/ containing a
# SKILL.md, installed into HERMES_HOME/skills/autonomous-ai-agents/.
#
# These are OURS, versus the `official`/`builtin` skills Hermes ships. Keeping
# them in the role means a converge repairs hand-edits and `git log` explains
# them; the retired quality-gate skill is what happens to a local skill nobody
# owns — it outlived the binary it invoked and kept being offered to the agent.
#
# Removing a name here does NOT uninstall it from the box. Delete the directory
# under HERMES_HOME/skills/autonomous-ai-agents/ by hand, or add a prune step
# modelled on roles/devtools' .moderndegree pruning.
hermes_local_skills:
  - opencode-lab

# PATH for gateway/proxy/dashboard, baked into the unit files.
#
# ~/.npm-global/bin is REQUIRED and was missing until 2026-08-15. `opencode` is
# installed there by roles/devtools (user-owned npm prefix), so without it Hermes
# cannot see the binary at all — it reported "OpenCode is not installed,
# `opencode` command not found anywhere" and offered to build the project itself
# instead. The opencode-lab skill was therefore unreachable in practice: perfect
# instructions for a command that could not be resolved.
#
# Found by running a real delegation end-to-end. Asking Hermes whether it could
# use OpenCode would not have caught it — it only fails at the moment of
# execution.
#
# ~/.n/bin is deliberately NOT here: node resolves from /usr/bin/node, and
# opencode runs correctly with npm-global alone (verified 2026-08-15).
hermes_path: "{{ user_home }}/.grok/bin:{{ user_home }}/.npm-global/bin:{{ user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
