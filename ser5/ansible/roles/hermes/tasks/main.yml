---
# Hermes gateway — NousResearch installer + systemd user service on ser5.
# The containers role (which runs earlier in site.yml) already enables lingering
# and creates ~/.config/systemd/user/, so this role just installs and wires up
# the service.

- name: hermes stub — role is disabled
  ansible.builtin.debug:
    msg: >
      hermes role is disabled (enable_hermes: false).
      Set enable_hermes: true in group_vars/all.yml to activate.
  when: not (enable_hermes | bool)

- name: Configure Hermes gateway
  when: enable_hermes | bool
  block:
    - name: Resolve {{ username }} UID (needed for systemctl --user calls)
      ansible.builtin.command: "id -u {{ username }}"
      register: hermes_user_uid
      changed_when: false

    - name: Ensure Hermes home directory exists
      ansible.builtin.file:
        path: "{{ hermes_home }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0750"

    # ─── Install Hermes Agent ─────────────────────────────────────────────────
    - name: Check if Hermes Agent binary exists
      ansible.builtin.stat:
        path: "{{ hermes_bin }}"
      register: hermes_binary_stat

    # Download to a file (not stdin) so bash reads the script from the file path
    # rather than stdin. `curl | bash </dev/null` was broken: </dev/null overrides
    # the pipe so bash reads an empty stdin and exits 0 without installing anything.
    # `--skip-setup` suppresses the interactive `hermes setup` wizard.
    # Running as {{ username }} so the downloaded file is owned by that user.
    - name: Install Hermes Agent via official NousResearch installer
      ansible.builtin.shell:
        cmd: >-
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh
          -o /tmp/hermes-install-{{ username }}.sh &&
          chmod 700 /tmp/hermes-install-{{ username }}.sh &&
          bash /tmp/hermes-install-{{ username }}.sh --skip-setup
        executable: /bin/bash
      environment:
        HOME: "{{ user_home }}"
        HERMES_HOME: "{{ hermes_home }}"
        USER: "{{ username }}"
      become: true
      become_user: "{{ username }}"
      when: not hermes_binary_stat.stat.exists
      register: hermes_install_result
      failed_when: hermes_install_result.rc != 0

    - name: Ensure HERMES_HOME is set in the user's .bashrc
      ansible.builtin.lineinfile:
        path: "{{ user_home }}/.bashrc"
        regexp: '^export HERMES_HOME='
        line: "export HERMES_HOME={{ hermes_home }}"
        state: present
        create: true
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"

    # ─── Optional secrets (HERMES_HOME/.env) ──────────────────────────────────
    # Prefer SuperGrok OAuth (`hermes auth add xai-oauth`) — not automatable.
    # API key path is opt-in via enable_hermes_xai_api_key + vault_xai_api_key.
    - name: Ensure Hermes env file exists
      ansible.builtin.file:
        path: "{{ hermes_home }}/.env"
        state: touch
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0600"
        modification_time: preserve
        access_time: preserve
      when: >-
        (enable_hermes_xai_api_key | bool)
        or (enable_hermes_messaging | bool)

    - name: Write XAI_API_KEY into Hermes env when vaulted
      ansible.builtin.lineinfile:
        path: "{{ hermes_home }}/.env"
        regexp: '^XAI_API_KEY='
        line: "XAI_API_KEY={{ vault_xai_api_key }}"
        state: present
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0600"
      when: >-
        (enable_hermes_xai_api_key | bool)
        and (vault_xai_api_key | default('') | length > 0)
        and not (vault_xai_api_key | default('') is search('^PLACEHOLDER'))
      no_log: true
      notify:
        - restart hermes-gateway
        - restart hermes-proxy

    # Telegram is not managed by Ansible — set up manually on the box
    # (bot token + `hermes pairing approve telegram <code>`) if/when wanted.
    - name: Write Hermes Discord bot token into env when vaulted
      ansible.builtin.lineinfile:
        path: "{{ hermes_home }}/.env"
        regexp: "^DISCORD_BOT_TOKEN="
        line: "DISCORD_BOT_TOKEN={{ vault_hermes_discord_bot_token }}"
        state: present
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0600"
      when: >-
        (enable_hermes_messaging | bool)
        and (enable_hermes_discord | bool)
        and (vault_hermes_discord_bot_token | default('') | length > 0)
        and not (vault_hermes_discord_bot_token | default('') is search('^PLACEHOLDER'))
      no_log: true
      notify:
        - restart hermes-gateway

    # ─── Optional web.backend: xai ────────────────────────────────────────────
    # Only patches config.yaml when hermes_web_backend is non-empty. Does not
    # change model.provider — default inference stays Ollama / Tier L.
    - name: Ensure Hermes config.yaml exists before web.backend patch
      ansible.builtin.stat:
        path: "{{ hermes_home }}/config.yaml"
      register: hermes_config_stat
      when: hermes_web_backend | default('') | length > 0

    - name: Set Hermes web.backend (xAI search) when requested
      ansible.builtin.command:
        cmd: >-
          {{ hermes_bin }} config set web.backend {{ hermes_web_backend }}
      environment:
        HOME: "{{ user_home }}"
        HERMES_HOME: "{{ hermes_home }}"
        PATH: "{{ hermes_path }}"
      become: true
      become_user: "{{ username }}"
      when: >-
        (hermes_web_backend | default('') | length > 0)
        and (hermes_config_stat.stat.exists | default(false))
      register: hermes_web_backend_set
      changed_when: hermes_web_backend_set.rc == 0
      failed_when: false

    # ─── Official Grok Build skill (delegate coding to `grok` CLI) ─────────────
    - name: Check if Hermes Grok skill is already installed
      ansible.builtin.command:
        cmd: "{{ hermes_bin }} skills list"
      environment:
        HOME: "{{ user_home }}"
        HERMES_HOME: "{{ hermes_home }}"
        PATH: "{{ hermes_path }}"
      become: true
      become_user: "{{ username }}"
      register: hermes_skills_list
      changed_when: false
      failed_when: false
      when: enable_hermes_grok_skill | bool

    # -y skips the interactive confirmation prompt; without it this hangs under
    # Ansible (stdin is a PTY but no human answers "yes").
    - name: Install Hermes official Grok Build skill
      ansible.builtin.command:
        cmd: "{{ hermes_bin }} skills install -y {{ hermes_grok_skill }}"
      environment:
        HOME: "{{ user_home }}"
        HERMES_HOME: "{{ hermes_home }}"
        PATH: "{{ hermes_path }}"
      become: true
      become_user: "{{ username }}"
      register: hermes_grok_skill_install
      changed_when: >-
        hermes_grok_skill_install.rc == 0
        and ('already' not in (hermes_grok_skill_install.stdout | default('') | lower))
      failed_when: false
      # Safety net: skill install is network-bound; don't block provision forever.
      async: 120
      poll: 5
      when: >-
        (enable_hermes_grok_skill | bool)
        and (
          hermes_skills_list.rc != 0
          or ('grok' not in (hermes_skills_list.stdout | default('') | lower))
        )

    - name: Note post-provision Grok auth steps
      ansible.builtin.debug:
        msg: >-
          Hermes Grok skill: {{ 'enabled' if (enable_hermes_grok_skill | bool) else 'disabled' }}.
          On the host after provision: (1) grok login   (2) hermes auth add xai-oauth
          (optional model provider / x_search / Imagine / TTS).
          Messaging gateway: run `hermes gateway setup`, then approve each new chat with
          `hermes pairing approve <platform> <code>`; revoke pairings later if needed.
          Default Hermes model stays Ollama at {{ hermes_ollama_base_url }}.

    # ─── quality-loop free-text gate (local skill + agentlab wrapper) ─────────
    - name: Ensure Hermes quality-gate skill directory exists
      ansible.builtin.file:
        path: "{{ hermes_quality_gate_skill_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"
      when: enable_hermes_quality_gate | bool

    - name: Install Hermes quality-gate skill markdown
      ansible.builtin.template:
        src: quality-gate-skill.md.j2
        dest: "{{ hermes_quality_gate_skill_dir }}/SKILL.md"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      when: enable_hermes_quality_gate | bool

    # ─── Systemd user service ─────────────────────────────────────────────────
    - name: Ensure user systemd directory exists
      ansible.builtin.file:
        path: "{{ user_home }}/.config/systemd/user"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Template hermes-gateway user service unit
      ansible.builtin.template:
        src: hermes-gateway.service.j2
        dest: "{{ user_home }}/.config/systemd/user/hermes-gateway.service"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - hermes daemon-reload
        - restart hermes-gateway

    - name: Template hermes-proxy user service unit
      ansible.builtin.template:
        src: hermes-proxy.service.j2
        dest: "{{ user_home }}/.config/systemd/user/hermes-proxy.service"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - hermes daemon-reload
        - restart hermes-proxy
      when: enable_hermes_proxy | bool

    - name: Template hermes-dashboard user service unit
      ansible.builtin.template:
        src: hermes-dashboard.service.j2
        dest: "{{ user_home }}/.config/systemd/user/hermes-dashboard.service"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - hermes daemon-reload
        - restart hermes-dashboard
      when: enable_hermes_dashboard | bool

    # Flush so daemon-reload runs before the enable/start tasks below.
    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Ensure hermes-gateway user service is enabled and started
      ansible.builtin.systemd:
        name: hermes-gateway.service
        enabled: true
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ hermes_user_uid.stdout }}"

    - name: Ensure hermes-proxy user service is enabled and started
      ansible.builtin.systemd:
        name: hermes-proxy.service
        enabled: true
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ hermes_user_uid.stdout }}"
      when: enable_hermes_proxy | bool

    - name: Ensure hermes-dashboard user service is enabled and started
      ansible.builtin.systemd:
        name: hermes-dashboard.service
        enabled: true
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ hermes_user_uid.stdout }}"
      when: enable_hermes_dashboard | bool

    # UFW is default-deny (base role); scope the proxy to the tailnet only.
    - name: Allow Hermes proxy in from the tailnet interface
      community.general.ufw:
        rule: allow
        direction: in
        interface: "{{ hermes_tailnet_interface }}"
        to_port: "{{ hermes_proxy_port }}"
        proto: tcp
      when: enable_hermes_proxy | bool

    # Keep the dashboard reachable only from the tailnet by default.
    - name: Allow Hermes dashboard in from the tailnet interface
      community.general.ufw:
        rule: allow
        direction: in
        interface: "{{ hermes_dashboard_tailnet_interface }}"
        to_port: "{{ hermes_dashboard_port }}"
        proto: tcp
      when: enable_hermes_dashboard | bool
