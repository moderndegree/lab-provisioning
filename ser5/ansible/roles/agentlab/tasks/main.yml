---
# agentlab — deploy loopkit (packages/loopkit in this repo) onto ser5.
# Gated by enable_agentlab in site.yml. Long-running experiments run as
# systemd user units (lingering is enabled by the containers role) so they
# survive SSH disconnects and reboots don't leave zombies.

- name: Install agentlab system packages
  ansible.builtin.apt:
    name:
      - python3-venv
      - sqlite3
      - rsync
    state: present

# ─── Directory layout on the data disk ────────────────────────────────────────
- name: Create agentlab directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"
  loop:
    - "{{ agentlab_root }}"
    - "{{ agentlab_root }}/src"
    - "{{ agentlab_root }}/playbooks"
    - "{{ agentlab_root }}/suites"
    - "{{ agentlab_root }}/datasets"
    - "{{ agentlab_root }}/jobs"

# ─── Push the loopkit source from the repo checkout ───────────────────────────
- name: Sync loopkit package source to the host
  ansible.posix.synchronize:
    src: "{{ agentlab_local_pkg }}/"
    dest: "{{ agentlab_src }}"
    delete: true
    recursive: true
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=.pytest_cache"
      - "--exclude=*.egg-info"
  register: agentlab_sync

- name: Own the synced source as {{ username }}
  ansible.builtin.file:
    path: "{{ agentlab_src }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    recurse: true
  when: agentlab_sync.changed

# ─── Virtualenv + install (loopkit is stdlib-only; pip has no net deps) ───────
- name: Create loopkit virtualenv
  ansible.builtin.command:
    cmd: "python3 -m venv {{ agentlab_venv }}"
    creates: "{{ agentlab_venv }}/bin/python"
  become: true
  become_user: "{{ username }}"
  register: agentlab_venv_created

- name: Install loopkit into the virtualenv
  ansible.builtin.command:
    cmd: "{{ agentlab_venv }}/bin/pip install --upgrade {{ agentlab_src }}"
  become: true
  become_user: "{{ username }}"
  when: agentlab_sync.changed or agentlab_venv_created.changed
  changed_when: true

- name: Symlink loopkit onto the system PATH
  ansible.builtin.file:
    src: "{{ agentlab_venv }}/bin/loopkit"
    dest: /usr/local/bin/loopkit
    state: link

- name: Export loopkit environment for interactive shells
  ansible.builtin.template:
    src: agentlab-env.sh.j2
    dest: /etc/profile.d/agentlab.sh
    owner: root
    group: root
    mode: "0644"

# ─── Seed content (force: false — user edits are never clobbered) ─────────────
- name: Seed the smoke suite into the suites directory
  ansible.builtin.copy:
    src: "{{ agentlab_src }}/suites/smoke.jsonl"
    dest: "{{ agentlab_root }}/suites/smoke.jsonl"
    remote_src: true
    force: false
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"

- name: Seed an example experiment job
  ansible.builtin.template:
    src: example-eval.sh.j2
    dest: "{{ agentlab_root }}/jobs/example-eval.sh"
    force: false
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"

# ─── systemd user template unit for long-horizon experiments ──────────────────
# Start a job with:  systemctl --user start agentlab-run@example-eval
# Logs:              journalctl --user -u agentlab-run@example-eval -f
- name: Resolve {{ username }} UID (needed for systemctl --user calls)
  ansible.builtin.command: "id -u {{ username }}"
  register: agentlab_user_uid
  changed_when: false

- name: Ensure user systemd directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/systemd/user"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"

- name: Template agentlab-run@ user service unit
  ansible.builtin.template:
    src: agentlab-run@.service.j2
    dest: "{{ user_home }}/.config/systemd/user/agentlab-run@.service"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
  notify: agentlab daemon-reload
