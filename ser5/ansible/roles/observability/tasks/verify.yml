---
# Read-only probes for roles/observability. Appends to `problems`; changes nothing.
#
# THIS IS THE ROLE THE WHOLE VERIFY LAYER EXISTS FOR. Prometheus 2.55.1 and
# Grafana 11.4.0 ran here for ~6 weeks against quadlets that said 3.13.2 and
# 13.1.1. The generated units were correct. Ansible was green. The only signal
# that would have caught it is the one below: asking each service what version it
# believes it is.
#
# So the version checks here deliberately do NOT read the quadlet, the image tag,
# or the unit — all three were correct throughout the incident. They read the
# HTTP endpoint of the process that is actually serving.

- name: Check the observability units are active
  ansible.builtin.command: "systemctl --user is-active {{ item }}.service"
  become: true
  become_user: "{{ username }}"
  environment: "{{ user_systemd_env }}"
  loop: [prometheus, grafana, json-exporter]
  register: verify_obs_units
  changed_when: false
  failed_when: false
  check_mode: false

- name: Flag inactive observability units
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [item.item ~ '.service is ' ~ (item.stdout | default('unknown')) ~ '.'] }}
  loop: "{{ verify_obs_units.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout | default('') != 'active'

# ─────────────────────────────────────────────────────────────────────────────
# Ask each service its own version
# ─────────────────────────────────────────────────────────────────────────────
# Prometheus reports the version WITHOUT the leading "v" that the image tag
# carries, so strip it before comparing rather than pinning the var to a bare
# number — the tag has to keep the v to be pullable.
- name: Ask Prometheus what it is running
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/api/v1/status/buildinfo"
    timeout: "{{ verify_http_timeout }}"
    return_content: true
  register: verify_prom_build
  failed_when: false
  check_mode: false

- name: Flag Prometheus serving a different version than the quadlet pins
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [
        'Prometheus is SERVING ' ~ verify_prom_build.json.data.version ~ ' but the quadlet pins '
        ~ prometheus_version ~ '. The unit and the image tag are probably both correct — '
        ~ 'check for a shadowing unit or a container that never restarted.'
      ] }}
  when:
    - verify_prom_build.status | default(0) == 200
    - verify_prom_build.json.data.version | default('') != (prometheus_version | regex_replace('^v', ''))

- name: Flag Prometheus not answering
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + ['Prometheus is not answering on :' ~ prometheus_port ~ '.'] }}
  when: verify_prom_build.status | default(0) != 200

- name: Ask Grafana what it is running
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/health"
    timeout: "{{ verify_http_timeout }}"
    return_content: true
  register: verify_grafana_health
  failed_when: false
  check_mode: false

- name: Flag Grafana serving a different version than the quadlet pins
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [
        'Grafana is SERVING ' ~ verify_grafana_health.json.version ~ ' but the quadlet pins '
        ~ grafana_version ~ '. Same failure shape as the 2026-06 incident — suspect a '
        ~ 'shadowing unit before suspecting the quadlet.'
      ] }}
  when:
    - verify_grafana_health.status | default(0) == 200
    - verify_grafana_health.json.version | default('') != grafana_version

- name: Flag Grafana not answering or unhealthy
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [
        'Grafana on :' ~ grafana_port ~ ' is not healthy (database: '
        ~ (verify_grafana_health.json.database | default('no response')) ~ ').'
      ] }}
  when: >-
    verify_grafana_health.status | default(0) != 200
    or verify_grafana_health.json.database | default('') != 'ok'

- name: Check UFW for the Grafana tailnet rule
  ansible.builtin.command: ufw status
  register: verify_grafana_ufw
  changed_when: false
  failed_when: false
  check_mode: false
  when: grafana_host | default('0.0.0.0') != "127.0.0.1"

- name: Flag Grafana published beyond loopback without a tailnet UFW rule
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [
        'Grafana publishes on ' ~ grafana_host ~ ':' ~ grafana_port
        ~ ' but UFW has no ' ~ grafana_port ~ '/tcp on ' ~ grafana_tailnet_interface
        ~ ' rule — it is reachable from the wifi LAN, or from nowhere on the tailnet.'
      ] }}
  when:
    - grafana_host | default('0.0.0.0') != "127.0.0.1"
    - verify_grafana_ufw.rc | default(1) == 0
    - not (verify_grafana_ufw.stdout is search(grafana_port | string ~ '/tcp on ' ~ grafana_tailnet_interface))

# ─────────────────────────────────────────────────────────────────────────────
# json-exporter
# ─────────────────────────────────────────────────────────────────────────────
- name: Ask json-exporter whether it is serving
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ json_exporter_port }}/metrics"
    timeout: "{{ verify_http_timeout }}"
    return_content: true
  register: verify_json_exporter
  failed_when: false
  check_mode: false

- name: Flag json-exporter not answering
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + ['json-exporter is not answering on :' ~ json_exporter_port ~ '.'] }}
  when: verify_json_exporter.status | default(0) != 200

# ─────────────────────────────────────────────────────────────────────────────
# Scrape targets
# ─────────────────────────────────────────────────────────────────────────────
# A Prometheus that is up but scraping nothing produces flat dashboards, not
# alerts — the exact failure mode where you only find out when you go looking.
# mini's node exporter is reached over the tailnet, so this doubles as a check
# that MagicDNS still resolves and the wifi link is actually carrying traffic.
#
# llama.cpp /metrics on :8090/:8091 is the ROLLBACK path. halogen occupies
# :8090 and has no /metrics, so those targets are expected down while halogen
# is the serving path. Do not flag them as an outage if halogen_engine_responds
# is 1. Flag a missing serving path instead if NEITHER is up.
- name: Ask Prometheus about its scrape targets
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/api/v1/targets?state=active"
    timeout: "{{ verify_http_timeout }}"
    return_content: true
  register: verify_prom_targets
  failed_when: false
  check_mode: false

- name: Ask Prometheus whether halogen's engine is responding
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/api/v1/query?query=halogen_engine_responds"
    timeout: "{{ verify_http_timeout }}"
    return_content: true
  register: verify_halogen_responds
  failed_when: false
  check_mode: false

- name: Classify live scrape health
  ansible.builtin.set_fact:
    verify_obs_targets: "{{ verify_prom_targets.json.data.activeTargets | default([]) }}"
    verify_halogen_engine_up: >-
      {{
        (verify_halogen_responds.json.data.result | default([]))
        | selectattr('value', 'defined')
        | map(attribute='value')
        | map('last')
        | map('float')
        | select('equalto', 1.0)
        | list | length > 0
      }}
    verify_halogen_health_up: >-
      {{
        (verify_prom_targets.json.data.activeTargets | default([]))
        | selectattr('health', 'defined')
        | selectattr('labels', 'defined')
        | selectattr('health', 'equalto', 'up')
        | map(attribute='labels')
        | selectattr('job', 'defined')
        | selectattr('job', 'equalto', 'mini-halogen-health')
        | list | length > 0
      }}
    verify_llamacpp_quality_up: >-
      {{
        (verify_prom_targets.json.data.activeTargets | default([]))
        | selectattr('health', 'defined')
        | selectattr('labels', 'defined')
        | selectattr('health', 'equalto', 'up')
        | map(attribute='labels')
        | selectattr('job', 'defined')
        | selectattr('instance', 'defined')
        | selectattr('job', 'equalto', 'mini-llamacpp')
        | selectattr('instance', 'equalto', 'mini-quality')
        | list | length > 0
      }}

- name: Flag required scrape targets that are down
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [
        'Prometheus target ' ~ (item.labels.job | default('?')) ~ ' at '
        ~ (item.labels.instance | default('?')) ~ ' is down: '
        ~ (item.lastError | default('no error reported')) ~ '.'
      ] }}
  loop: "{{ verify_obs_targets }}"
  loop_control:
    label: "{{ item.labels.job | default('?') }} {{ item.labels.instance | default('?') }}"
  when:
    - item.health | default('') != 'up'
    - (item.labels.job | default('')) in ['mini-node', 'json-exporter']

- name: Flag halogen probes down when llama.cpp is not the serving path
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [
        'Prometheus target ' ~ (item.labels.job | default('?')) ~ ' at '
        ~ (item.labels.instance | default('?')) ~ ' is down: '
        ~ (item.lastError | default('no error reported')) ~ '.'
      ] }}
  loop: "{{ verify_obs_targets }}"
  loop_control:
    label: "{{ item.labels.job | default('?') }}"
  when:
    - item.health | default('') != 'up'
    - (item.labels.job | default('')) in ['mini-halogen-health', 'mini-halogen-cache']
    - not (verify_llamacpp_quality_up | bool)

- name: Flag no inference scrape succeeding
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [
        'No inference scrape is up — halogen health is down and llama-quality '
        ~ '/metrics is down. Grafana will show GPU numbers with no serving path.'
      ] }}
  when:
    - not (verify_halogen_engine_up | bool)
    - not (verify_halogen_health_up | bool)
    - not (verify_llamacpp_quality_up | bool)

# ─────────────────────────────────────────────────────────────────────────────
# Dashboard
# ─────────────────────────────────────────────────────────────────────────────
# File-provisioned. A Grafana that is healthy with an empty search result is
# the 2026-08 state (datasource only) — that is no longer the desired state.
- name: Ask Grafana for the mini inference dashboard
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/dashboards/uid/mini-inference"
    timeout: "{{ verify_http_timeout }}"
    return_content: true
  register: verify_grafana_dash
  failed_when: false
  check_mode: false

- name: Flag a missing mini inference dashboard
  ansible.builtin.set_fact:
    problems: >-
      {{ problems + [
        'Grafana has no dashboard uid mini-inference — provisioning/dashboards did not load.'
      ] }}
  when: verify_grafana_dash.status | default(0) != 200
