---
# Observability — Prometheus + Grafana + json-exporter as rootless Podman
# quadlets on ser5. Scrapes:
#   mini node-exporter (:9100, system + GPU hwmon/drm)
#   halogen-flash /health and /cache via json-exporter (live serving path)
#   llama.cpp /metrics on :8090/:8091 (rollback; expected down while halogen is on)
#
# The containers role must run first (lingering + ~/.config/systemd/user/).
# Access Grafana at http://ser5:3000 — dashboard "mini — inference" is
# file-provisioned. Bound 0.0.0.0; UFW scopes the port to tailscale0.
#
# llama.cpp llamacpp:* panels on that dashboard stay empty until the rollback
# path is started. tokens_predicted_total / n_decode_total is MTP acceptance
# only at concurrency 1 — continuous batching inflates it independently of MTP.

- name: Observability role is disabled
  ansible.builtin.debug:
    msg: "enable_observability: false — skipping Prometheus + Grafana."
  when: not (enable_observability | bool)

- name: Deploy observability stack
  when: enable_observability | bool
  block:
    - name: Resolve {{ username }} UID (needed for systemctl --user calls)
      ansible.builtin.command: "id -u {{ username }}"
      register: obs_user_uid
      changed_when: false
      # check_mode: false because `command` does not support check mode and is
      # SKIPPED there — and a skipped register renders `.stdout` as the EMPTY
      # STRING, not as undefined. Every `XDG_RUNTIME_DIR: /run/user/{{ ... }}`
      # below then becomes `/run/user/`, and `systemctl --user` fails with
      # "Failed to connect to user scope bus via local transport" — a message
      # that reads like a broken user manager rather than an empty variable.
      # Nothing about `id -u` needs to be withheld from a dry run.
      check_mode: false

    # ─── Data directories ──────────────────────────────────────────────────────
    - name: Create Prometheus config directory
      ansible.builtin.file:
        path: "{{ prometheus_config_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create Prometheus data directory
      ansible.builtin.file:
        path: "{{ prometheus_data_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create Grafana data directory
      ansible.builtin.file:
        path: "{{ grafana_data_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create Grafana provisioning/datasources directory
      ansible.builtin.file:
        path: "{{ grafana_provisioning_dir }}/datasources"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create Grafana provisioning/dashboards directory
      ansible.builtin.file:
        path: "{{ grafana_provisioning_dir }}/dashboards/json"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create json-exporter config directory
      ansible.builtin.file:
        path: "{{ json_exporter_config_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    # ─── Configuration ────────────────────────────────────────────────────────
    - name: Write Prometheus scrape config
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ prometheus_config_dir }}/prometheus.yml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - prometheus daemon-reload
        - restart prometheus

    - name: Write Grafana Prometheus datasource provisioning
      ansible.builtin.template:
        src: grafana-datasource.yml.j2
        dest: "{{ grafana_provisioning_dir }}/datasources/prometheus.yml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - grafana daemon-reload
        - restart grafana

    - name: Write Grafana dashboard provider
      ansible.builtin.template:
        src: grafana-dashboards.yml.j2
        dest: "{{ grafana_provisioning_dir }}/dashboards/dashboards.yml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - grafana daemon-reload
        - restart grafana

    - name: Install the mini inference dashboard
      ansible.builtin.copy:
        src: dashboards/mini-inference.json
        dest: "{{ grafana_provisioning_dir }}/dashboards/json/mini-inference.json"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - restart grafana

    - name: Write json-exporter module config
      ansible.builtin.template:
        src: json-exporter.yml.j2
        dest: "{{ json_exporter_config_dir }}/config.yml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - json-exporter daemon-reload
        - restart json-exporter

    # ─── Retire pre-quadlet static units ──────────────────────────────────────
    # RETIREMENT TASK — delete once every host has converged past it (see docs/todo.md).
    #
    # These roles used to write plain .service units into ~/.config/systemd/user/.
    # A static unit file there SHADOWS the quadlet generator's output for the same
    # name: generator units are the lowest-precedence source systemd considers, so
    # ~/.config/systemd/user/prometheus.service silently wins over the prometheus.service
    # compiled from prometheus.container.
    #
    # This failed silently and durably. Ansible reported `ok`/`changed` on the
    # quadlet templates, the generated unit was correct, and `systemctl restart`
    # succeeded — while the container kept booting the image pinned in the June
    # leftover. ser5 ran Prometheus 2.55.1 / Grafana 11.4.0 for weeks against
    # quadlets that said 3.13.2 / 13.1.1. Nothing in a converge could surface it;
    # only comparing the RUNNING image against the quadlet catches it.
    #
    # `systemctl --user show <unit> -p FragmentPath` is the check: a path under
    # .../systemd/generator/ means the quadlet is live, anything under
    # ~/.config/systemd/user/ means it is being shadowed.
    - name: Retire pre-quadlet static units that shadow the generator
      ansible.builtin.file:
        path: "{{ user_home }}/.config/systemd/user/{{ item }}"
        state: absent
      loop:
        - prometheus.service
        - grafana.service
        - json-exporter.service
        - obs-network.service
      notify:
        - prometheus daemon-reload
        - grafana daemon-reload
        - json-exporter daemon-reload
        - restart prometheus
        - restart grafana
        - restart json-exporter

    # ─── Quadlet units ────────────────────────────────────────────────────────
    # Podman's quadlet generator scans ~/.config/containers/systemd/ for .container
    # and .network files (NOT ~/.config/systemd/user/ — that's for plain .service units).
    - name: Ensure user containers/systemd quadlet directory exists
      ansible.builtin.file:
        path: "{{ user_home }}/.config/containers/systemd"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Write obs Podman network quadlet
      ansible.builtin.template:
        src: obs.network.j2
        dest: "{{ user_home }}/.config/containers/systemd/obs.network"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - prometheus daemon-reload
        - grafana daemon-reload
        - json-exporter daemon-reload

    - name: Write Prometheus quadlet unit
      ansible.builtin.template:
        src: prometheus.container.j2
        dest: "{{ user_home }}/.config/containers/systemd/prometheus.container"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - prometheus daemon-reload
        - restart prometheus

    - name: Write Grafana quadlet unit
      ansible.builtin.template:
        src: grafana.container.j2
        dest: "{{ user_home }}/.config/containers/systemd/grafana.container"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - grafana daemon-reload
        - restart grafana

    - name: Write json-exporter quadlet unit
      ansible.builtin.template:
        src: json-exporter.container.j2
        dest: "{{ user_home }}/.config/containers/systemd/json-exporter.container"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - json-exporter daemon-reload
        - restart json-exporter

    - name: Flush handlers (daemon-reload before enable/start)
      ansible.builtin.meta: flush_handlers

    # ─── obs network still exists ─────────────────────────────────────────────
    # A quadlet .network generates a oneshot that creates the network, exits 0,
    # and then reports active (exited) forever. Nothing re-checks it. Found
    # 2026-08-05: podman storage reset overnight, every network vanished, and
    # obs-network.service still showed success from the previous evening.
    # Prometheus/Grafana/Open WebUI were down for ~10 hours; systemd and a
    # converge both looked fine. Ask podman, not systemd.
    - name: Check the obs podman network still exists
      ansible.builtin.command: podman network exists systemd-obs
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ obs_user_uid.stdout }}"
      register: obs_network_exists
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Recreate the obs network when podman lost it
      ansible.builtin.systemd:
        name: obs-network.service
        state: restarted
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ obs_user_uid.stdout }}"
      when: obs_network_exists.rc != 0
      notify:
        - restart prometheus
        - restart grafana
        - restart json-exporter

    - name: Flush handlers after recreating a missing obs network
      ansible.builtin.meta: flush_handlers
      when: obs_network_exists.rc != 0

    # ─── Start services ───────────────────────────────────────────────────────
    # No enabled: true — these are Quadlet-generated units (from each
    # .container file's own [Install] WantedBy=), and `systemctl enable` on a
    # generated/transient unit fails with "Unit ... is transient or
    # generated". Quadlet wires its own autostart at generation time.
    - name: Ensure Prometheus user service is started
      ansible.builtin.systemd:
        name: prometheus.service
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ obs_user_uid.stdout }}"

    - name: Ensure json-exporter user service is started
      ansible.builtin.systemd:
        name: json-exporter.service
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ obs_user_uid.stdout }}"

    - name: Ensure Grafana user service is started
      ansible.builtin.systemd:
        name: grafana.service
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ obs_user_uid.stdout }}"

    # ser5 is default-deny with NO blanket tailscale0 allow. grafana_host
    # 0.0.0.0 is what makes http://ser5:3000 work; this rule is what keeps
    # the wifi LAN from getting anonymous-admin Grafana. Skip when locked
    # to loopback — there is nothing for UFW to admit.
    - name: Allow Grafana in from the tailnet interface
      community.general.ufw:
        rule: allow
        direction: in
        interface: "{{ grafana_tailnet_interface }}"
        to_port: "{{ grafana_port }}"
        proto: tcp
      when: grafana_host != "127.0.0.1"
