---
# Observability — Prometheus + Grafana as rootless Podman quadlets.
# Disabled by default; set enable_observability: true in group_vars/all.yml to activate.
#
# Purpose: monitor the mini inference box from ser5 —
#   GPU temps, VRAM/GTT usage, and token throughput via Prometheus metrics.
# Both services run as user-level systemd units (quadlets), no root required,
# and survive reboots via user lingering (containers role must run first).
#
# STUB — set enable_observability: true and flesh out the TODOs below to build this out.

- name: Observability role is a stub
  ansible.builtin.debug:
    msg: >
      enable_observability: true but this role is not yet fully implemented.
      See ansible/roles/observability/tasks/main.yml for TODOs.

