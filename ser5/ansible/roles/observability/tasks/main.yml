---
# Observability — Prometheus + Grafana as rootless Podman quadlets on ser5.
# Scrapes: mini node-exporter (:9100, system + GPU hwmon/drm) and Ollama (:11434/metrics).
# Both services run as user-level systemd units (quadlets); the containers role must
# run first (enables lingering and creates ~/.config/systemd/user/).
# Access Grafana at http://localhost:3000 after provisioning.
# Suggested dashboards to import manually:
#   - https://grafana.com/grafana/dashboards/1860  (node-exporter-full)
#   - https://grafana.com/grafana/dashboards/20728 (Ollama)

- name: Observability role is disabled
  ansible.builtin.debug:
    msg: "enable_observability: false — skipping Prometheus + Grafana."
  when: not (enable_observability | bool)

- name: Deploy observability stack
  when: enable_observability | bool
  block:
    - name: Resolve {{ username }} UID (needed for systemctl --user calls)
      ansible.builtin.command: "id -u {{ username }}"
      register: obs_user_uid
      changed_when: false

    # ─── Data directories ──────────────────────────────────────────────────────
    - name: Create Prometheus config directory
      ansible.builtin.file:
        path: "{{ prometheus_config_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create Prometheus data directory
      ansible.builtin.file:
        path: "{{ prometheus_data_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create Grafana data directory
      ansible.builtin.file:
        path: "{{ grafana_data_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create Grafana provisioning/datasources directory
      ansible.builtin.file:
        path: "{{ grafana_provisioning_dir }}/datasources"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    # ─── Configuration ────────────────────────────────────────────────────────
    - name: Write Prometheus scrape config
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ prometheus_config_dir }}/prometheus.yml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - prometheus daemon-reload
        - restart prometheus

    - name: Write Grafana Prometheus datasource provisioning
      ansible.builtin.template:
        src: grafana-datasource.yml.j2
        dest: "{{ grafana_provisioning_dir }}/datasources/prometheus.yml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - grafana daemon-reload
        - restart grafana

    # ─── Quadlet units ────────────────────────────────────────────────────────
    # Podman's quadlet generator scans ~/.config/containers/systemd/ for .container
    # and .network files (NOT ~/.config/systemd/user/ — that's for plain .service units).
    - name: Ensure user containers/systemd quadlet directory exists
      ansible.builtin.file:
        path: "{{ user_home }}/.config/containers/systemd"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Write obs Podman network quadlet
      ansible.builtin.template:
        src: obs.network.j2
        dest: "{{ user_home }}/.config/containers/systemd/obs.network"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - prometheus daemon-reload
        - grafana daemon-reload

    - name: Write Prometheus quadlet unit
      ansible.builtin.template:
        src: prometheus.container.j2
        dest: "{{ user_home }}/.config/containers/systemd/prometheus.container"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - prometheus daemon-reload
        - restart prometheus

    - name: Write Grafana quadlet unit
      ansible.builtin.template:
        src: grafana.container.j2
        dest: "{{ user_home }}/.config/containers/systemd/grafana.container"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - grafana daemon-reload
        - restart grafana

    - name: Flush handlers (daemon-reload before enable/start)
      ansible.builtin.meta: flush_handlers

    # ─── Start services ───────────────────────────────────────────────────────
    # No enabled: true — these are Quadlet-generated units (from each
    # .container file's own [Install] WantedBy=), and `systemctl enable` on a
    # generated/transient unit fails with "Unit ... is transient or
    # generated". Quadlet wires its own autostart at generation time.
    - name: Ensure Prometheus user service is started
      ansible.builtin.systemd:
        name: prometheus.service
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ obs_user_uid.stdout }}"

    - name: Ensure Grafana user service is started
      ansible.builtin.systemd:
        name: grafana.service
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ obs_user_uid.stdout }}"
