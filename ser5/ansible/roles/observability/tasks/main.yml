---
# Observability — Prometheus + Grafana as rootless Podman quadlets on ser5.
# Scrapes: mini node-exporter (:9100, system + GPU hwmon/drm) and Ollama (:11434/metrics).
# Both services run as user-level systemd units (quadlets); the containers role must
# run first (enables lingering and creates ~/.config/systemd/user/).
# Access Grafana at http://localhost:3000 after provisioning.
# Suggested dashboards to import manually:
#   - https://grafana.com/grafana/dashboards/1860  (node-exporter-full)
#   - llama.cpp exposes llamacpp:* metrics (tokens_predicted_total,
#     n_decode_total, requests_processing, requests_deferred, n_busy_slots_per_decode).
#     No community dashboard covers these; build panels from those names.
#     tokens_predicted_total / n_decode_total is the MTP acceptance rate, but it
#     is only meaningful at concurrency 1 — continuous batching decodes every
#     active slot in one step, which inflates the ratio independently of MTP.

- name: Observability role is disabled
  ansible.builtin.debug:
    msg: "enable_observability: false — skipping Prometheus + Grafana."
  when: not (enable_observability | bool)

- name: Deploy observability stack
  when: enable_observability | bool
  block:
    - name: Resolve {{ username }} UID (needed for systemctl --user calls)
      ansible.builtin.command: "id -u {{ username }}"
      register: obs_user_uid
      changed_when: false
      # check_mode: false because `command` does not support check mode and is
      # SKIPPED there — and a skipped register renders `.stdout` as the EMPTY
      # STRING, not as undefined. Every `XDG_RUNTIME_DIR: /run/user/{{ ... }}`
      # below then becomes `/run/user/`, and `systemctl --user` fails with
      # "Failed to connect to user scope bus via local transport" — a message
      # that reads like a broken user manager rather than an empty variable.
      # Nothing about `id -u` needs to be withheld from a dry run.
      check_mode: false

    # ─── Data directories ──────────────────────────────────────────────────────
    - name: Create Prometheus config directory
      ansible.builtin.file:
        path: "{{ prometheus_config_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create Prometheus data directory
      ansible.builtin.file:
        path: "{{ prometheus_data_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create Grafana data directory
      ansible.builtin.file:
        path: "{{ grafana_data_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create Grafana provisioning/datasources directory
      ansible.builtin.file:
        path: "{{ grafana_provisioning_dir }}/datasources"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    # ─── Configuration ────────────────────────────────────────────────────────
    - name: Write Prometheus scrape config
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ prometheus_config_dir }}/prometheus.yml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - prometheus daemon-reload
        - restart prometheus

    - name: Write Grafana Prometheus datasource provisioning
      ansible.builtin.template:
        src: grafana-datasource.yml.j2
        dest: "{{ grafana_provisioning_dir }}/datasources/prometheus.yml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - grafana daemon-reload
        - restart grafana

    # ─── Retire pre-quadlet static units ──────────────────────────────────────
    # RETIREMENT TASK — delete once every host has converged past it (see docs/todo.md).
    #
    # These roles used to write plain .service units into ~/.config/systemd/user/.
    # A static unit file there SHADOWS the quadlet generator's output for the same
    # name: generator units are the lowest-precedence source systemd considers, so
    # ~/.config/systemd/user/prometheus.service silently wins over the prometheus.service
    # compiled from prometheus.container.
    #
    # This failed silently and durably. Ansible reported `ok`/`changed` on the
    # quadlet templates, the generated unit was correct, and `systemctl restart`
    # succeeded — while the container kept booting the image pinned in the June
    # leftover. ser5 ran Prometheus 2.55.1 / Grafana 11.4.0 for weeks against
    # quadlets that said 3.13.2 / 13.1.1. Nothing in a converge could surface it;
    # only comparing the RUNNING image against the quadlet catches it.
    #
    # `systemctl --user show <unit> -p FragmentPath` is the check: a path under
    # .../systemd/generator/ means the quadlet is live, anything under
    # ~/.config/systemd/user/ means it is being shadowed.
    - name: Retire pre-quadlet static units that shadow the generator
      ansible.builtin.file:
        path: "{{ user_home }}/.config/systemd/user/{{ item }}"
        state: absent
      loop:
        - prometheus.service
        - grafana.service
        - obs-network.service
      notify:
        - prometheus daemon-reload
        - grafana daemon-reload
        - restart prometheus
        - restart grafana

    # ─── Quadlet units ────────────────────────────────────────────────────────
    # Podman's quadlet generator scans ~/.config/containers/systemd/ for .container
    # and .network files (NOT ~/.config/systemd/user/ — that's for plain .service units).
    - name: Ensure user containers/systemd quadlet directory exists
      ansible.builtin.file:
        path: "{{ user_home }}/.config/containers/systemd"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Write obs Podman network quadlet
      ansible.builtin.template:
        src: obs.network.j2
        dest: "{{ user_home }}/.config/containers/systemd/obs.network"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - prometheus daemon-reload
        - grafana daemon-reload

    - name: Write Prometheus quadlet unit
      ansible.builtin.template:
        src: prometheus.container.j2
        dest: "{{ user_home }}/.config/containers/systemd/prometheus.container"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - prometheus daemon-reload
        - restart prometheus

    - name: Write Grafana quadlet unit
      ansible.builtin.template:
        src: grafana.container.j2
        dest: "{{ user_home }}/.config/containers/systemd/grafana.container"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - grafana daemon-reload
        - restart grafana

    - name: Flush handlers (daemon-reload before enable/start)
      ansible.builtin.meta: flush_handlers

    # ─── Start services ───────────────────────────────────────────────────────
    # No enabled: true — these are Quadlet-generated units (from each
    # .container file's own [Install] WantedBy=), and `systemctl enable` on a
    # generated/transient unit fails with "Unit ... is transient or
    # generated". Quadlet wires its own autostart at generation time.
    - name: Ensure Prometheus user service is started
      ansible.builtin.systemd:
        name: prometheus.service
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ obs_user_uid.stdout }}"

    - name: Ensure Grafana user service is started
      ansible.builtin.systemd:
        name: grafana.service
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ obs_user_uid.stdout }}"
