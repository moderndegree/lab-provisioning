---
# ─── brain — markdown second brain vault on ser5 ─────────────────────────────
# Plain files under {{ data_mount }}/brain. Layout is Obsidian-compatible and
# suitable for optional external viewers. This role only seeds + backs up files;
# lab-provisioning does not ship a vault UI or MCP server.

brain_root: "{{ data_mount }}/brain"

# When agentlab is present, point vault playbooks at the same ACE files agents use.
brain_link_agentlab_playbooks: true
brain_agentlab_playbooks: "{{ data_mount }}/agentlab/playbooks"
