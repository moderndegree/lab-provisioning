---
# Voice I/O — speaches (STT + TTS) as a rootless quadlet, plus the gateway as a
# systemd user unit. See defaults/main.yml for the measurements behind every
# engine and model choice here.

- name: voice stub — role is disabled
  ansible.builtin.debug:
    msg: >
      voice role is disabled (enable_voice: false).
      Set enable_voice: true in group_vars/all.yml to activate.
  when: not (enable_voice | default(false) | bool)

- name: Deploy the voice stack
  when: enable_voice | default(false) | bool
  block:
    - name: Resolve {{ username }} UID (needed for systemctl --user calls)
      ansible.builtin.command: "id -u {{ username }}"
      register: voice_user_uid
      changed_when: false
      # check_mode: false because `command` does not support check mode and is
      # SKIPPED there — and a skipped register renders `.stdout` as the EMPTY
      # STRING, not as undefined. Every `XDG_RUNTIME_DIR: /run/user/{{ ... }}`
      # below then becomes `/run/user/`, and `systemctl --user` fails with
      # "Failed to connect to user scope bus via local transport" — a message
      # that reads like a broken user manager rather than an empty variable.
      # Nothing about `id -u` needs to be withheld from a dry run.
      check_mode: false

    # The cgroup path in the locality ruleset is built from this. Reading it
    # rather than assuming 1000 matters because a wrong path does not error —
    # the nftables rule simply matches nothing and stops enforcing, silently.
    - name: Record the UID as a fact
      ansible.builtin.set_fact:
        voice_user_uid_value: "{{ voice_user_uid.stdout | trim }}"

    - name: Ensure the voice directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0750"
      loop:
        - "{{ voice_data_dir }}"
        - "{{ voice_models_dir }}"

    # The Ledger's own directory is voice_data_dir above; this only makes the
    # vault's errands folder exist up front so the first export is not also the
    # first mkdir. Skipped when the export is disabled or roles/brain never ran —
    # the exporter treats a missing vault as "do not export" rather than an
    # error, so this is a convenience, not a dependency.
    - name: Ensure the vault errands folder exists
      ansible.builtin.file:
        path: "{{ voice_vault_dir }}/notes/errands"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0750"
      when:
        - voice_vault_dir | length > 0
        - enable_brain | default(false) | bool

    # voice_app_dir gets NO mode assertion here, deliberately. rsync's archive
    # mode copies the SOURCE directory's own permission bits onto this dest
    # root on every sync (not just its contents) — confirmed 2026-08-30 via its
    # itemized ".d...p..... ./" output. Asserting a different mode here just
    # means this task and the sync permanently fight over it, one flipping it
    # back every run the other just changed. Let the sync own it; existence
    # alone is enough before the first sync ever runs.
    - name: Ensure the gateway app directory exists
      ansible.builtin.file:
        path: "{{ voice_app_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"

    # ─── Silero VAD ──────────────────────────────────────────────────────────
    # Checksummed because it is a binary blob fetched from the internet onto an
    # always-on box, and because a truncated download would not fail loudly —
    # onnxruntime would refuse the graph at the first utterance, long after the
    # converge went green.
    - name: Fetch the Silero VAD graph
      ansible.builtin.get_url:
        url: "{{ voice_vad_model_url }}"
        dest: "{{ voice_vad_model_path }}"
        checksum: "sha256:{{ voice_vad_model_sha256 }}"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify: restart voice-gateway

    # ─── speaches ────────────────────────────────────────────────────────────
    - name: Template the speaches quadlet
      ansible.builtin.template:
        src: voice-speech.container.j2
        dest: "{{ user_home }}/.config/containers/systemd/voice-speech.container"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - voice daemon-reload
        - restart voice-speech

    - name: Flush handlers (daemon-reload before start)
      ansible.builtin.meta: flush_handlers

    - name: Ensure voice-speech is started
      ansible.builtin.systemd:
        name: voice-speech.service
        state: started
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ voice_user_uid.stdout }}"
      when: not ansible_check_mode

    # Cold start loads models off the data disk; the pulls below fail flat if
    # they race it, and the failure reads as "model missing" rather than "not up
    # yet".
    - name: Wait for speaches to answer
      ansible.builtin.uri:
        url: "http://{{ voice_speech_host }}:{{ voice_speech_port }}/health"
        status_code: [200]
      register: voice_speech_up
      retries: 30
      delay: 5
      until: voice_speech_up.status | default(0) == 200
      changed_when: false
      when: not ansible_check_mode

    # speaches does NOT download a model on demand. A model it does not already
    # hold raises huggingface_hub.CacheNotFound and the request returns 500, so
    # the cache has to be populated explicitly. Verified 2026-08-30.
    - name: Read the models speaches already holds
      ansible.builtin.uri:
        url: "http://{{ voice_speech_host }}:{{ voice_speech_port }}/v1/models"
        return_content: true
      register: voice_models_present
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Download the speech models
      ansible.builtin.uri:
        url: >-
          http://{{ voice_speech_host }}:{{ voice_speech_port }}/v1/models/{{ item }}
        method: POST
        status_code: [200, 201, 409]
        # A first pull is hundreds of MB over the public internet.
        timeout: 1800
      loop: "{{ voice_speech_models }}"
      register: voice_model_pull
      changed_when: voice_model_pull.status | default(0) in [200, 201]
      when:
        - not ansible_check_mode
        - item not in (voice_models_present.json.data | default([]) | map(attribute='id') | list)

    # ─── Gateway ─────────────────────────────────────────────────────────────
    - name: Install the gateway system prompt
      ansible.builtin.copy:
        src: system-prompt.md
        dest: "{{ voice_data_dir }}/system-prompt.md"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify: restart voice-gateway

    # Copied rather than run from the repo checkout: the gateway is a service on
    # this box and must not depend on a working copy that can be moved, dirty,
    # or mid-rebase.
    #
    # synchronize rather than copy, purely for --exclude. Running the bench or a
    # pip install in the source tree leaves __pycache__ and .egg-info behind, and
    # ansible.builtin.copy has no way to skip them: it would ship that junk and
    # report `changed` on any run where a .pyc timestamp had moved, so the role
    # would never settle.
    # changed_when overridden: synchronize's own `changed` is a false positive
    # on every run. rsync's archive mode always emits an attribute-sync entry
    # for the destination ROOT directory itself (".d...p..... ./"), even when
    # every file beneath it is identical, and the module treats any itemized
    # line as `changed` without excluding it. Confirmed 2026-08-30: a manual
    # `rsync -n --itemize-changes` between the same two trees showed zero
    # lines, yet the module still reported changed. Left as-is, this breaks the
    # repo's own rule that a second `make provision` must be green.
    - name: Copy the gateway package onto the box
      ansible.posix.synchronize:
        src: "{{ voice_src_dir }}/"
        dest: "{{ voice_app_dir }}/"
        delete: true
        rsync_opts:
          - "--exclude=__pycache__"
          - "--exclude=*.egg-info"
          - "--exclude=.venv"
          - "--exclude=*.pyc"
          - "--exclude=build"
          - "--exclude=dist"
      become: false
      register: voice_src_copy
      changed_when: >-
        voice_src_copy.stdout_lines
        | map('regex_replace', '^\S+ ', '')
        | reject('equalto', './')
        | list | length > 0
      notify: restart voice-gateway

    - name: Own the copied package
      ansible.builtin.file:
        path: "{{ voice_app_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        recurse: true

    - name: Create the gateway virtualenv
      ansible.builtin.command:
        cmd: "python3 -m venv {{ voice_venv_dir }}"
        creates: "{{ voice_venv_dir }}/bin/python"
      become: true
      become_user: "{{ username }}"
      register: voice_venv_created

    # Reinstalled only when the source actually changed or the venv is new.
    # `pip install` is not idempotent on its own, so changed_when reads pip's own
    # report rather than assuming.
    - name: Install the gateway into its virtualenv
      ansible.builtin.command:
        cmd: "{{ voice_venv_dir }}/bin/pip install --upgrade {{ voice_app_dir }}"
      become: true
      become_user: "{{ username }}"
      register: voice_pip
      changed_when: "'Successfully installed' in voice_pip.stdout"
      when: voice_src_copy.changed or voice_venv_created.changed
      notify: restart voice-gateway

    - name: Template the gateway unit
      ansible.builtin.template:
        src: voice-gateway.service.j2
        dest: "{{ user_home }}/.config/systemd/user/voice-gateway.service"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify:
        - voice daemon-reload
        - restart voice-gateway

    - name: Flush handlers (daemon-reload before enable/start)
      ansible.builtin.meta: flush_handlers

    # This one is a real unit file, not a quadlet-generated one, so unlike the
    # container units it CAN and must be enabled.
    - name: Enable and start voice-gateway
      ansible.builtin.systemd:
        name: voice-gateway.service
        state: started
        enabled: true
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ voice_user_uid.stdout }}"
      when: not ansible_check_mode

    # ─── The bench ───────────────────────────────────────────────────────────
    # Same venv, same package, different entry point (`python -m
    # voice_gateway.bench`). It shares nothing with the gateway but the Ledger
    # file, which is the whole point: the handoff is a row, so either unit can
    # restart without losing an errand.
    - name: Template the bench unit
      ansible.builtin.template:
        src: voice-bench.service.j2
        dest: "{{ user_home }}/.config/systemd/user/voice-bench.service"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      when: enable_voice_bench | bool
      notify:
        - voice daemon-reload
        - restart voice-bench

    - name: Flush handlers (daemon-reload before the bench starts)
      ansible.builtin.meta: flush_handlers

    - name: Enable and start voice-bench
      ansible.builtin.systemd:
        name: voice-bench.service
        state: "{{ 'started' if (enable_voice_bench | bool) else 'stopped' }}"
        enabled: "{{ enable_voice_bench | bool }}"
        scope: user
      become: true
      become_user: "{{ username }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ voice_user_uid.stdout }}"
      failed_when: false
      when: not ansible_check_mode

    # ─── Locality, enforced on the wire ──────────────────────────────────────
    # Its own nftables table, so removal is one `nft delete table` and UFW is
    # never touched. See defaults/main.yml for why this is off until turned on
    # deliberately.
    - name: Deploy the locality ruleset
      when: voice_locality_enforce | bool
      block:
        - name: Ensure the nftables directory exists
          ansible.builtin.file:
            path: "{{ voice_locality_ruleset | dirname }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Template the locality ruleset
          ansible.builtin.template:
            src: voice-locality.nft.j2
            dest: "{{ voice_locality_ruleset }}"
            owner: root
            group: root
            mode: "0644"
            # nft parses the file without touching the live ruleset. A typo here
            # would otherwise land as a firewall that half-loaded.
            validate: "/usr/sbin/nft --check --file %s"
          notify: reload voice-locality

        - name: Template the locality unit
          ansible.builtin.template:
            src: voice-locality.service.j2
            dest: /etc/systemd/system/voice-locality.service
            owner: root
            group: root
            mode: "0644"
          notify:
            - voice system daemon-reload
            - reload voice-locality

        - name: Flush handlers (load the ruleset before enabling)
          ansible.builtin.meta: flush_handlers

        - name: Enable and start voice-locality
          ansible.builtin.systemd:
            name: voice-locality.service
            state: started
            enabled: true
            daemon_reload: true
          when: not ansible_check_mode

    # ─── Exposure ────────────────────────────────────────────────────────────
    # ser5 is default-deny with NO blanket tailscale0 allow (mini has one; this
    # box does not). Every service that needs the tailnet adds its own rule —
    # see roles/hermes. Without this the gateway binds fine, answers on
    # loopback, and is silently unreachable from the desktop client.
    - name: Allow the voice gateway in from the tailnet interface
      community.general.ufw:
        rule: allow
        direction: in
        interface: "{{ voice_tailnet_interface }}"
        to_port: "{{ voice_gateway_port }}"
        proto: tcp

    # ─── Open WebUI voice wiring ────────────────────────────────────────────
    # Same self-gating idiom as roles/searxng's identical step: check for the
    # DB rather than enable_openwebui directly, so this naturally does nothing
    # if Open WebUI has never actually run.
    - name: Check for an existing Open WebUI database
      ansible.builtin.stat:
        path: "{{ openwebui_db_path }}"
      register: voice_openwebui_db

    - name: Write Open WebUI audio config helper
      ansible.builtin.template:
        src: configure-openwebui-audio.py.j2
        dest: "{{ voice_data_dir }}/configure-openwebui-audio.py"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0750"
      when: voice_openwebui_db.stat.exists

    - name: Point Open WebUI's audio PersistentConfig at voice
      ansible.builtin.command:
        cmd: python3 {{ voice_data_dir }}/configure-openwebui-audio.py
      register: voice_openwebui_audio_config
      changed_when: true
      when:
        - voice_openwebui_db.stat.exists
        - not ansible_check_mode
