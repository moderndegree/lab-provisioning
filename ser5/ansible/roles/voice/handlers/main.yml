---
- name: voice daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ username }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ voice_user_uid.stdout }}"

- name: restart voice-speech
  ansible.builtin.systemd:
    name: voice-speech.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ username }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ voice_user_uid.stdout }}"
  when: not ansible_check_mode

- name: restart voice-gateway
  ansible.builtin.systemd:
    name: voice-gateway.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ username }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ voice_user_uid.stdout }}"
  when: not ansible_check_mode
