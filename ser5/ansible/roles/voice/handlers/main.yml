---
- name: voice daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ username }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ voice_user_uid.stdout }}"

- name: restart voice-speech
  ansible.builtin.systemd:
    name: voice-speech.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ username }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ voice_user_uid.stdout }}"
  when: not ansible_check_mode

# `listen:` topic, NOT two tasks sharing a `name:` — tried that first and it
# does not do what it looks like it does. Confirmed with -vvv 2026-08-30: when
# two handler tasks share a `name:`, notifying that name runs only the FIRST
# of them, silently — no error, no "skipping" line, the second is just absent
# from the executed task list. Then tried wrapping both steps in a `block:`
# under one handler name — ansible-core 2.20 rejects that outright ("The
# requested handler ... was not found"): handlers/main.yml does not accept a
# block as a handler entry. `listen:` is the documented mechanism for "one
# notification, several handler tasks, in order" and is what actually works —
# verified end to end after switching to it.
#
# The stat exists because the VAD-fetch task in tasks/main.yml notifies this
# handler and gets flushed by the SPEECH phase's `meta: flush_handlers` — on a
# first-ever converge that fires before voice-gateway.service has been
# templated at all, and `systemd: name=voice-gateway.service state=restarted`
# hard-fails with "Could not find the requested service" for a unit systemd
# has never heard of (not merely inactive). The later "Enable and start
# voice-gateway" task still brings it up on that same first run; this handler
# only needs to be a safe no-op until the unit exists, then behave normally on
# every converge after.
- name: Check whether voice-gateway.service exists yet
  listen: "restart voice-gateway"
  ansible.builtin.stat:
    path: "{{ user_home }}/.config/systemd/user/voice-gateway.service"
  register: voice_gateway_unit_file

- name: Restart voice-gateway
  listen: "restart voice-gateway"
  ansible.builtin.systemd:
    name: voice-gateway.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ username }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ voice_user_uid.stdout }}"
  when:
    - not ansible_check_mode
    - voice_gateway_unit_file.stat.exists

# Same shape and the same reason as the gateway handler above: on a first-ever
# converge the VAD fetch flushes handlers before this unit has been templated,
# and `state: restarted` hard-fails on a unit systemd has never heard of.
- name: Check whether voice-bench.service exists yet
  listen: "restart voice-bench"
  ansible.builtin.stat:
    path: "{{ user_home }}/.config/systemd/user/voice-bench.service"
  register: voice_bench_unit_file

- name: Restart voice-bench
  listen: "restart voice-bench"
  ansible.builtin.systemd:
    name: voice-bench.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ username }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ voice_user_uid.stdout }}"
  when:
    - not ansible_check_mode
    - voice_bench_unit_file.stat.exists

- name: voice system daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true

# `restarted`, not `reloaded`: the unit is a oneshot whose ExecStop deletes the
# table and whose ExecStart reloads it, so a restart is the only thing that
# actually re-reads the file. A `reload` on a oneshot is a no-op that reports
# success — the same class of lie as the network oneshot in roles/observability
# that reported `active (exited)` for ten hours after its network was gone.
- name: reload voice-locality
  ansible.builtin.systemd:
    name: voice-locality.service
    state: restarted
    daemon_reload: true
  when:
    - not ansible_check_mode
    - voice_locality_enforce | bool
