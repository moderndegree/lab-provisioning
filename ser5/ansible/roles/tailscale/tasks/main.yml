---
# Join the Tailscale tailnet.
# Requires vault_tailscale_authkey from ansible/group_vars/vault.yml (encrypted).
# After a successful `tailscale up`, this box appears in your tailnet alongside mini.

# Tailscale repo pinned to 'noble' — no 'resolute' (26.04) release in their repo yet.
# Update this once https://pkgs.tailscale.com/stable/ubuntu/ lists resolute.
- name: Install python3-debian (required by deb822_repository)
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Remove legacy Tailscale apt repository file (superseded by deb822 format)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent

- name: Remove legacy Tailscale keyring (superseded by deb822_repository-managed key)
  ansible.builtin.file:
    path: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: absent

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: noble
    components: main
    signed_by: https://pkgs.tailscale.com/stable/ubuntu/noble.gpg
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: "tailscale{{ '' if _ts_latest else '=' + tailscale_version }}"
    state: "{{ 'latest' if _ts_latest else 'present' }}"
    update_cache: true
    # Tailscale's apt repo only keeps recent releases, so an exact pin can age out.
    # allow_downgrade lets a valid pin be enforced even if a newer build slipped in.
    allow_downgrade: true
  vars:
    _ts_latest: "{{ (tailscale_version | default('latest') | trim) in ['', 'latest'] }}"

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Query Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: ts_status_raw
  changed_when: false
  failed_when: false

- name: Parse Tailscale backend state
  ansible.builtin.set_fact:
    ts_backend_state: >-
      {{ (ts_status_raw.stdout | from_json).BackendState
         if (ts_status_raw.rc == 0 and ts_status_raw.stdout | length > 0)
         else 'NeedsLogin' }}

- name: Authenticate with Tailscale (skipped when already Running)
  ansible.builtin.command: >
    tailscale up
    --authkey {{ vault_tailscale_authkey }}
    --hostname {{ hostname }}
    --accept-routes
  when: ts_backend_state != 'Running'
  no_log: true
  changed_when: true
