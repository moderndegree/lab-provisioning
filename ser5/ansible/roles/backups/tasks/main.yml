# Backups — restic snapshots to {{ data_mount }}/backups.
# Disabled by default; set enable_backups: true in group_vars/all.yml to activate.
#
# restic provides content-addressable, encrypted, deduplicated snapshots.
# The local repo at {{ data_mount }}/backups survives OS-disk wipes.
# Pair with a remote restic repo (B2, S3, rclone) for off-site durability.
#
# STUB — set enable_backups: true and flesh out the TODOs below to build this out.

