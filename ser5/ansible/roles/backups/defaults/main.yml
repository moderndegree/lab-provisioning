---
# ─── restic backups ───────────────────────────────────────────────────────────
# Local repo on the data disk — survives OS-disk wipes. Pair with an off-site
# restic repo (B2/S3/rclone) for real durability; this role covers the local tier.

restic_repo: "{{ data_mount }}/backups"
restic_password: "{{ vault_restic_password | default('') }}"

# NOTE (2026-08-05): none of the below is in effect. enable_backups is false in
# group_vars/all.yml and always has been — restic is not installed on ser5 and
# the repo at {{ data_mount }}/backups was never initialised. Everything here
# describes what WOULD be snapshotted once the flag is flipped and
# vault_restic_password is set. See docs/todo.md.
#
# What gets snapshotted. services carries Grafana dashboards and Prometheus
# config.
#
# agentlab is RETAINED here on purpose after quality-loop was removed 2026-08:
# the role that provisioned it is gone, but /data/agentlab still holds runs.db —
# 356 recorded evaluation runs that cannot be regenerated now the harness is
# deleted. It is a frozen archive, not a live path. Drop this line (and the
# directory) once that record is exported or judged worthless.
restic_backup_paths:
  - "{{ user_home }}"
  - "{{ data_mount }}/agentlab"
  - "{{ data_mount }}/brain"
  - "{{ data_mount }}/services"
  - /etc

# Reproducible or re-scrapeable bulk — never worth snapshot space.
restic_excludes:
  # The venv is reproducible-in-principle only while the package exists; it does
  # not, so it is excluded as dead weight rather than as regenerable.
  - "{{ data_mount }}/agentlab/venv"
  - "{{ data_mount }}/services/prometheus/data"
  - "{{ user_home }}/.cache"
  - "{{ user_home }}/.n"
  - "{{ user_home }}/.npm"
  - "**/__pycache__"
  - "**/node_modules"
  - "**/.venv"

# Retention policy applied (with prune) after every backup run.
restic_keep_daily: 7
restic_keep_weekly: 4
restic_keep_monthly: 6

# Timer schedule. Persistent=true in the unit catches up after downtime.
restic_oncalendar: "*-*-* 03:30:00"
