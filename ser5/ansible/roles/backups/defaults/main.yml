---
# ─── restic backups ───────────────────────────────────────────────────────────
# Local repo on the data disk — survives OS-disk wipes. Pair with an off-site
# restic repo (B2/S3/rclone) for real durability; this role covers the local tier.

restic_repo: "{{ data_mount }}/backups"
restic_password: "{{ vault_restic_password | default('') }}"

# What gets snapshotted. agentlab carries the irreplaceable experiment record
# (runs.db, traces, playbooks, bootstrapped datasets); services carries Grafana
# dashboards and Prometheus config.
restic_backup_paths:
  - "{{ user_home }}"
  - "{{ data_mount }}/agentlab"
  - "{{ data_mount }}/brain"
  - "{{ data_mount }}/services"
  - /etc

# Reproducible or re-scrapeable bulk — never worth snapshot space.
restic_excludes:
  - "{{ data_mount }}/agentlab/venv"
  - "{{ data_mount }}/services/prometheus/data"
  - "{{ user_home }}/.cache"
  - "{{ user_home }}/.n"
  - "{{ user_home }}/.npm"
  - "**/__pycache__"
  - "**/node_modules"
  - "**/.venv"

# Retention policy applied (with prune) after every backup run.
restic_keep_daily: 7
restic_keep_weekly: 4
restic_keep_monthly: 6

# Timer schedule. Persistent=true in the unit catches up after downtime.
restic_oncalendar: "*-*-* 03:30:00"
